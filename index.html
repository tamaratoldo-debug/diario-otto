<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Diário do Otto" />
<title>Diário do Otto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1EA; --ink:#221F1D; --ink-muted:#8A8378; --accent:#D9A441;
    --c-alimentacao:#B5722E; --c-remedio:#C99A3A; --c-peso:#3E6B5C;
    --c-intercorrencia:#A8473A; --c-consulta:#3E5F7A; --c-procedimento:#6E5490; --c-exame:#6B6455;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{overflow-x:hidden; margin:0; padding:0}
  body{background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--ink); padding-bottom:calc(40px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color:transparent}
  .display{font-family:'Space Grotesk',system-ui,sans-serif}
  .wrap{max-width:460px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px 0}
  .card{background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); margin:0 4px}
  .hero{background:var(--ink); border-radius:24px; padding:20px 20px 24px; position:relative}
  .hero-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px}
  .hero-title{color:#fff; font-weight:600; font-size:1.15rem; display:flex; align-items:center; gap:8px}
  .hero-title svg{color:var(--accent)}
  .settings-btn{background:none; border:none; color:#B8B2A6; padding:8px; border-radius:999px; display:flex}
  .peso-label{color:#8B8578; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px}
  .peso-row{display:flex; align-items:baseline; gap:10px}
  .peso-val{color:#fff; font-weight:700; font-size:2.5rem; line-height:1}
  .peso-unit{font-size:1.1rem; font-weight:500; margin-left:4px}
  .peso-delta{display:flex; align-items:center; gap:4px; font-size:.85rem; font-weight:500; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,.08)}
  .peso-date{color:#8B8578; font-size:.75rem; margin-top:4px}

  .quick{padding:12px; margin-top:-16px; position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .quick button{border:none; border-radius:12px; padding:12px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:inherit; cursor:pointer}
  .quick button span{font-size:.68rem; font-weight:500; color:var(--ink); text-align:center; line-height:1.1}

  .section{margin-top:16px; padding:16px}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .section-title{font-size:.9rem; font-weight:600}
  .link-btn{background:none; border:none; font-size:.75rem; font-weight:600; display:flex; align-items:center; gap:4px; cursor:pointer; padding:0}
  .empty-note{font-size:.75rem; color:var(--ink-muted); padding:4px 0}

  .med-row{display:flex; align-items:center; gap:12px; background:#FBFAF7; border-radius:12px; padding:10px 12px; margin-bottom:8px}
  .pending-checkbox{width:18px; height:18px; border-radius:50%; border:2px solid #7FB89A; flex-shrink:0; display:inline-block}
  .photo-preview{position:relative; display:inline-block; margin-top:2px}
  .photo-preview img{width:100px; height:100px; object-fit:cover; border-radius:10px; display:block; border:1px solid #E5E0D4}
  .photo-remove{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:999px; background:#A8473A; border:2px solid #fff; display:flex; align-items:center; justify-content:center; cursor:pointer}
  .entry-thumb{width:44px; height:44px; object-fit:cover; border-radius:8px; margin-top:6px; border:1px solid #F1EEE6}
  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px}
  .lightbox-close{position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:999px; background:rgba(255,255,255,.15); border:none; display:flex; align-items:center; justify-content:center}
  .med-row:last-child{margin-bottom:0}
  .check-btn{width:34px; height:34px; border-radius:999px; border:none; background:var(--c-remedio); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer}
  .med-name{font-size:.9rem; font-weight:500}
  .med-sub{font-size:.7rem; color:var(--ink-muted)}

  .chart-wrap{height:130px; margin-top:4px}

  .search-box{display:flex; align-items:center; gap:8px; background:#fff; border-radius:12px; padding:10px 12px; box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .search-box input{border:none; outline:none; flex:1; font-size:16px; background:transparent; font-family:inherit}
  .filters{display:flex; gap:8px; overflow-x:auto; margin-top:10px; padding-bottom:4px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip-filter{white-space:nowrap; font-size:.75rem; font-weight:500; padding:6px 12px; border-radius:999px; border:1px solid #EAE5DA; background:#fff; color:var(--ink-muted); flex-shrink:0; cursor:pointer}
  .chip-filter.active{border:none; color:#fff}

  .month-label{font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin:16px 4px 8px}
  .day-card{background:#fff; border-radius:12px; padding:12px; display:flex; gap:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); margin-bottom:8px}
  .day-num{display:flex; flex-direction:column; align-items:center; width:44px; flex-shrink:0; padding-top:2px}
  .day-num .n{font-weight:700; font-size:1.3rem; line-height:1}
  .day-num .m{font-size:.65rem; font-weight:500; color:var(--ink-muted)}
  .day-sep{width:1px; background:#EFEBE1; align-self:stretch}
  .entries-col{flex:1; min-width:0}
  .entry-row{width:100%; text-align:left; background:none; border:none; padding:10px 0; font-family:inherit; cursor:pointer; border-bottom:1px solid #F1EEE6}
  .entry-row:last-child{border-bottom:none; padding-bottom:0}
  .entry-row:first-child{padding-top:0}
  .entry-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .entry-title{display:flex; align-items:center; gap:6px; min-width:0; font-size:.88rem; font-weight:600}
  .entry-title span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .entry-time{font-size:.7rem; color:var(--ink-muted); font-family:'Space Grotesk',sans-serif; flex-shrink:0}
  .entry-sub{font-size:.72rem; color:var(--ink-muted); margin-top:3px; line-height:1.3}
  .badge{display:inline-block; font-size:.62rem; font-weight:600; padding:2px 6px; border-radius:4px; margin-top:4px}

  .empty-state{text-align:center; padding:56px 0; color:var(--ink-muted)}

  .warning-banner{display:flex; gap:8px; background:#FBEAE7; border:1px solid #E3B5AC; border-radius:12px; padding:10px 12px; margin:12px 4px 0; font-size:.75rem; color:#8A3A30; align-items:flex-start}
  .warning-banner button{background:none; border:none; flex-shrink:0}

  /* Modal / bottom sheet */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50}
  .sheet{background:#fff; border-radius:24px 24px 0 0; width:100%; max-width:460px; max-height:88vh; display:flex; flex-direction:column; animation:slideUp .2s ease-out}
  @keyframes slideUp{from{transform:translateY(24px); opacity:0} to{transform:translateY(0); opacity:1}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid #F1EEE6; flex-shrink:0}
  .sheet-title{display:flex; align-items:center; gap:8px; font-weight:600; font-size:1rem; min-width:0}
  .icon-btn{width:40px; height:40px; border-radius:999px; border:none; background:#F1EEE6; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0}
  .icon-btn.danger{background:#F6E9E6}
  .sheet-body{overflow-y:auto; padding:16px 20px 4px; flex:1; min-height:0}
  .sheet-foot{display:flex; gap:8px; padding:12px 20px 20px; border-top:1px solid #F1EEE6; flex-shrink:0}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:.72rem; font-weight:500; color:var(--ink-muted); margin-bottom:6px}
  .field input, .field textarea, .field select{width:100%; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; color:var(--ink); background:#FBFAF7; font-family:inherit}
  .field textarea{min-height:70px; resize:vertical}
  .row2{display:flex; gap:8px}
  .row2 .field{flex:1}
  .pickgrid{display:flex; flex-wrap:wrap; gap:6px}
  .pick-btn{font-size:.85rem; font-weight:500; padding:9px 13px; border-radius:10px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .pick-btn.sel{color:#fff}
  .como-list{display:flex; flex-direction:column; gap:6px}
  .como-btn{text-align:left; font-size:.88rem; font-weight:500; padding:11px 13px; border-radius:10px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .como-btn.sel{color:#fff}
  .btn-primary{flex:1; padding:13px; border-radius:12px; border:none; background:var(--ink); color:#fff; font-weight:600; font-size:.9rem; cursor:pointer; font-family:inherit}
  .btn-primary:disabled{opacity:.4}
  .btn-secondary{padding:13px 16px; border-radius:12px; border:none; background:#F1EEE6; color:var(--ink); font-weight:600; font-size:.9rem; cursor:pointer; font-family:inherit}
  .btn-danger{flex:1; padding:11px; border-radius:10px; border:none; background:#A8473A; color:#fff; font-weight:600; font-size:.85rem; cursor:pointer; font-family:inherit}
  .hint{font-size:.68rem; color:var(--ink-muted); margin-top:4px}
  .manager-item{display:flex; align-items:center; justify-content:space-between; background:#FBFAF7; border-radius:10px; padding:10px 12px; margin-bottom:6px}
  .manager-item .name{font-size:.88rem; font-weight:500}
  .manager-item .sub{font-size:.68rem; color:var(--ink-muted)}
  .del-btn{background:none; border:none; flex-shrink:0; margin-left:8px; cursor:pointer}
  .add-form{background:#FBFAF7; border:1px solid #E5E0D4; border-radius:12px; padding:12px; margin-bottom:8px}
  .tipo-toggle{display:flex; gap:6px}
  .tipo-toggle button{flex:1; font-size:.72rem; font-weight:500; padding:9px 6px; border-radius:8px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .tipo-toggle button.sel{color:#fff; background:var(--c-remedio)}
  .add-trigger{width:100%; padding:11px; border-radius:10px; border:none; background:#F1EEE6; display:flex; align-items:center; justify-content:center; gap:6px; font-size:.85rem; font-weight:500; cursor:pointer; font-family:inherit}
  .confirm-box{padding:16px 20px 20px}
  .confirm-box p{font-size:.8rem; color:var(--ink-muted); margin:0 0 12px}
</style>
</head>
<body>

<div id="warningHost"></div>

<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <div class="hero-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5.172C11 3.782 9.423 2.679 7.5 3c-2.823.47-4.113 6.006-4 7 .08.703 1.725 1.722 3.656 1a2.5 2.5 0 1 1 3.626-3.256"/><path d="M14.5 6.5a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1"/><circle cx="18" cy="7" r="1"/><circle cx="20.5" cy="10.5" r="1"/><circle cx="12" cy="21" r="1"/><path d="M9 8c0 2 1 3 2.5 3.5S13 15 13 17c0 2-1 3-2.5 3.5"/></svg>
        Diário do Otto
      </div>
      <button class="settings-btn" id="btnSettings" aria-label="Configurações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="peso-label">Peso atual</div>
    <div class="peso-row">
      <div class="peso-val" id="pesoVal">—</div>
      <div id="pesoDeltaHost"></div>
    </div>
    <div class="peso-date" id="pesoDate"></div>
  </div>

  <div class="card quick" id="quickActions"></div>

  <div class="card section" id="chartSection" style="display:none">
    <div class="section-title" style="margin-bottom:8px">Evolução do peso</div>
    <div class="chart-wrap"><svg id="chartSvg" width="100%" height="130" viewBox="0 0 400 130" preserveAspectRatio="none"></svg></div>
  </div>

  <a class="card section" id="sheetLinkCard" style="display:none; text-decoration:none; color:inherit; align-items:center; justify-content:space-between; flex-direction:row; padding:16px" target="_blank" rel="noreferrer">
    <div style="display:flex; align-items:center; gap:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--c-exame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 14 22H6.5a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10.5 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg>
      <span style="font-size:.9rem; font-weight:500">Planilha de exames</span>
    </div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
  </a>

  <div style="margin-top:20px; padding:0 4px">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Buscar registros..." />
    </div>
    <div class="filters" id="filterChips"></div>
  </div>

  <div style="margin-top:16px; padding:0 4px" id="timeline"></div>
</div>

<div id="modalHost"></div>

<script>
// ---------- storage (localStorage, synchronous — no more hanging saves) ----------
const store = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v===null? fallback : JSON.parse(v);}catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ console.error('storage error', e); return false; } }
};

// ---------- config ----------
const CATEGORIES = {
  alimentacao:{label:'Alimentação', short:'Comeu', color:'var(--c-alimentacao)', hex:'#B5722E', icon:'utensils'},
  remedio:{label:'Remédio', short:'Remédio', color:'var(--c-remedio)', hex:'#C99A3A', icon:'pill'},
  peso:{label:'Peso', short:'Peso', color:'var(--c-peso)', hex:'#3E6B5C', icon:'scale'},
  intercorrencia:{label:'Intercorrência', short:'Intercorrência', color:'var(--c-intercorrencia)', hex:'#A8473A', icon:'alert'},
  consulta:{label:'Consulta', short:'Consulta', color:'var(--c-consulta)', hex:'#3E5F7A', icon:'stethoscope'},
  procedimento:{label:'Procedimento', short:'Procedimento', color:'var(--c-procedimento)', hex:'#6E5490', icon:'syringe'},
  exame:{label:'Exame', short:'Exame', color:'var(--c-exame)', hex:'#6B6455', icon:'flask'}
};
const CATEGORY_ORDER = ['alimentacao','remedio','peso','intercorrencia','consulta','procedimento','exame'];
const COMO_COMEU = [
  ['tudo_vontade','Comeu tudo com vontade'],
  ['tudo_insistencia','Comeu tudo, com insistência'],
  ['parte','Comeu só parte'],
  ['cheirou_recusou','Cheirou e recusou'],
  ['recusou','Recusou totalmente']
];
const COMO_COMEU_MAP = Object.fromEntries(COMO_COMEU);
const GRAVIDADES = ['Leve','Moderada','Grave'];
const EXAME_TIPOS = ['Sangue','Imagem','Urina','Fezes','Outro'];

const ICONS = {
  utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  scale:'<path d="M12 3v18M8 6l-6 12M16 6l6 12M2 18h12M10 18h12M6 6h4M14 6h4"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>',
  stethoscope:'<path d="M4.8 2.3A.3.3 0 1 0 5.397 2 .3.3 0 0 0 4.8 2.3M8.5 2v9a4.5 4.5 0 0 1-4.5 4.5m0 0a4.5 4.5 0 0 1-4.5-4.5V2M4 15.5v2a10 10 0 0 0 10 10h1a2 2 0 0 0 2-2v-1.5a2 2 0 0 0-4 0v.9"/>',
  syringe:'<path d="m18 2 4 4M14.5 5.5 3 17l-1 4 4-1L17.5 8.5M9 11l4 4M4 21l3-3"/>',
  flask:'<path d="M10 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 14 22H6.5a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10.5 8V2M6.453 15h11.094M8.5 2h7"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  paw:'<path d="M11 5.172C11 3.782 9.423 2.679 7.5 3c-2.823.47-4.113 6.006-4 7 .08.703 1.725 1.722 3.656 1a2.5 2.5 0 1 1 3.626-3.256"/><circle cx="18" cy="7" r="1"/><circle cx="20.5" cy="10.5" r="1"/><circle cx="12" cy="21" r="1"/><path d="M9 8c0 2 1 3 2.5 3.5S13 15 13 17c0 2-1 3-2.5 3.5"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/>'
};
function icon(name, size=16, stroke='currentColor'){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}

// ---------- helpers ----------
const genId = ()=> Date.now()+'-'+Math.random().toString(36).slice(2,8);
const pad = n=> String(n).padStart(2,'0');
const todayStr = ()=>{ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = iso=> new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
const fmtDay = iso=> new Date(iso).getDate();
const fmtMonthShort = iso=> new Date(iso).toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase();
const fmtTime = iso=> new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtMonthYear = iso=>{ const s=new Date(iso).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); };
const fmtDateShort = ds=>{ if(!ds) return '?'; const [y,m,d]=ds.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const isSameDay = (iso, ds)=>{ const d=new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`===ds; };
const isMedActiveToday = med=>{ if(med.tipo==='continuo') return true; const t=todayStr(); if(med.dataInicio && t<med.dataInicio) return false; if(med.dataFim && t>med.dataFim) return false; return true; };
const esc = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Resizes + compresses a photo before storing as base64, so a handful of photos
// don't blow through the browser's localStorage quota (typically a few MB).
function resizeImageFile(file, maxDim=700, quality=0.65){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- render: hero / peso ----------
function renderHero(){
  const pesoEntries = entries.filter(e=>e.category==='peso').slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const last = pesoEntries[pesoEntries.length-1];
  const prev = pesoEntries[pesoEntries.length-2];
  document.getElementById('pesoVal').innerHTML = last ? `${last.value}<span class="peso-unit">kg</span>` : '—';
  document.getElementById('pesoDate').textContent = last ? `registrado em ${fmtDate(last.date)}` : '';
  const deltaHost = document.getElementById('pesoDeltaHost');
  if(last && prev){
    const delta = +(last.value - prev.value).toFixed(2);
    const color = delta>0 ? '#E8A15C' : delta<0 ? '#7FB89A' : '#B8B2A6';
    const arrow = delta>0 ? '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>' : delta<0 ? '<path d="M23 18l-9.5-9.5-5 5L1 6"/><path d="M17 18h6v-6"/>' : '<line x1="5" y1="12" x2="19" y2="12"/>';
    deltaHost.innerHTML = `<div class="peso-delta" style="color:${color}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${arrow}</svg>${delta>0?'+':''}${delta}kg</div>`;
  } else deltaHost.innerHTML = '';

  const chartSection = document.getElementById('chartSection');
  if(pesoEntries.length>=2){
    chartSection.style.display='block';
    const vals = pesoEntries.map(e=>e.value);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min)||1;
    const w=400,h=130,pad=10;
    const pts = pesoEntries.map((e,i)=>{
      const x = pad + (i/(pesoEntries.length-1||1))*(w-2*pad);
      const y = h-pad - ((e.value-min)/range)*(h-2*pad);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#3E6B5C"/>`).join('');
    document.getElementById('chartSvg').innerHTML = `<path d="${path}" fill="none" stroke="#3E6B5C" stroke-width="2"/>${dots}`;
  } else chartSection.style.display='none';

  const sheetCard = document.getElementById('sheetLinkCard');
  if(settings.sheetLink){ sheetCard.style.display='flex'; sheetCard.href = settings.sheetLink; } else sheetCard.style.display='none';
}

// ---------- pending meds (rendered inline inside today's day-card) ----------
function dosesGivenToday(medId){
  const t = todayStr();
  return entries.filter(e=> e.category==='remedio' && e.medId===medId && isSameDay(e.date, t));
}

function pendingMedsForToday(){
  return meds.filter(isMedActiveToday).filter(m=> dosesGivenToday(m.id).length===0);
}

function pendingRowsHtml(pending){
  return pending.map(m=>{
    const sub = `${m.tipo==='continuo'?'Contínuo':'Até '+fmtDateShort(m.dataFim)}${m.horario?' · '+m.horario:''}${m.dose?' · '+esc(m.dose):''}`;
    return `<button class="entry-row" data-med="${m.id}">
      <div class="entry-top">
        <div class="entry-title"><span style="color:${CATEGORIES.remedio.hex}; display:flex">${icon('pill',13,CATEGORIES.remedio.hex)}</span><span>${esc(m.name)}</span></div>
        <span class="pending-checkbox" aria-label="Marcar como dado"></span>
      </div>
      <div class="entry-sub">${sub}</div>
    </button>`;
  }).join('');
}

function toggleMedToday(medId){
  const med = meds.find(m=>m.id===medId);
  if(!med) return;
  const givenToday = dosesGivenToday(medId);
  if(givenToday.length > 0){
    // undo: remove today's dose(s) logged for this med
    const idsToRemove = new Set(givenToday.map(e=>e.id));
    entries = entries.filter(e=> !idsToRemove.has(e.id));
  } else {
    let date = new Date();
    if(med.horario){ const [h,m2] = med.horario.split(':').map(Number); date.setHours(h,m2,0,0); }
    entries.push({ id:genId(), category:'remedio', medId:med.id, title:med.name, note:med.dose||'', date:date.toISOString(), createdAt:Date.now() });
  }
  entries.sort((a,b)=> new Date(b.date)-new Date(a.date));
  persistEntries();
  renderAll();
}

// ---------- render: timeline ----------
function entrySubtitle(e){
  if(e.category==='alimentacao'){
    const parts=[]; if(e.comoComeu) parts.push(COMO_COMEU_MAP[e.comoComeu]); if(e.quantidade) parts.push(e.quantidade); if(e.note) parts.push(e.note);
    return parts.join(' · ');
  }
  if(e.category==='consulta' && e.clinica) return e.clinica + (e.note? ' · '+e.note : '');
  return e.note || '';
}

function renderTimeline(){
  let list = entries.slice();
  if(filter!=='todos') list = list.filter(e=>e.category===filter);
  if(search.trim()){
    const q = search.trim().toLowerCase();
    list = list.filter(e => (e.title||'').toLowerCase().includes(q) || (e.note||'').toLowerCase().includes(q) || (e.clinica||'').toLowerCase().includes(q) || (e.quantidade||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=> new Date(b.date)-new Date(a.date));

  const host = document.getElementById('timeline');

  let html=''; const months=[];
  for(const e of list){
    const mk = fmtMonthYear(e.date); const dk = new Date(e.date).toDateString();
    if(!months.length || months[months.length-1].key!==mk){ months.push({key:mk, days:[]}); }
    const curMonth = months[months.length-1];
    if(!curMonth.days.length || curMonth.days[curMonth.days.length-1].key!==dk){ curMonth.days.push({key:dk, items:[]}); }
    curMonth.days[curMonth.days.length-1].items.push(e);
  }

  // Only show the pending meds checklist when it's meaningful: no filter narrowing to something unrelated, no active search.
  const showPending = (filter==='todos' || filter==='remedio') && !search.trim();
  const pending = showPending ? pendingMedsForToday() : [];
  const todayKey = new Date().toDateString();
  const todayMonthKey = fmtMonthYear(new Date().toISOString());

  if(pending.length > 0){
    let curMonth = months.find(m=> m.key===todayMonthKey);
    if(!curMonth){ curMonth = {key:todayMonthKey, days:[]}; months.unshift(curMonth); }
    let todayDay = curMonth.days.find(d=> d.key===todayKey);
    if(!todayDay){ todayDay = {key:todayKey, items:[]}; curMonth.days.unshift(todayDay); }
  }

  if(months.length===0){
    host.innerHTML = `<div class="empty-state">${icon('paw',28,'currentColor')}<div style="font-size:.85rem; margin-top:8px">${entries.length===0? 'Nenhum registro ainda. Toque numa categoria acima pra começar.' : 'Nada encontrado com esse filtro.'}</div></div>`;
    return;
  }

  for(const month of months){
    html += `<div class="month-label">${month.key}</div>`;
    for(const day of month.days){
      const isToday = day.key===todayKey;
      const pendingHtml = isToday ? pendingRowsHtml(pending) : '';
      if(day.items.length===0 && !pendingHtml) continue;
      const dayNum = day.items[0] ? fmtDay(day.items[0].date) : new Date().getDate();
      const dayMon = day.items[0] ? fmtMonthShort(day.items[0].date) : fmtMonthShort(new Date().toISOString());
      html += `<div class="day-card"><div class="day-num"><div class="n">${dayNum}</div><div class="m">${dayMon}</div></div><div class="day-sep"></div><div class="entries-col">`;
      html += pendingHtml;
      html += day.items.map(e=>{
        const cat = CATEGORIES[e.category];
        let badge='';
        if(e.category==='intercorrencia' && e.gravidade){
          const bg = e.gravidade==='Grave'?'#A8473A20':e.gravidade==='Moderada'?'#D9A44120':'#8A837820';
          const fg = e.gravidade==='Grave'?'#A8473A':e.gravidade==='Moderada'?'#B5842E':'var(--ink-muted)';
          badge = `<span class="badge" style="background:${bg}; color:${fg}">${e.gravidade}</span><br/>`;
        }
        const sub = entrySubtitle(e);
        return `<button class="entry-row" data-id="${e.id}">
          <div class="entry-top">
            <div class="entry-title"><span style="color:${cat.hex}; display:flex">${icon(cat.icon,13,cat.hex)}</span><span>${esc(e.title)}</span></div>
            <span class="entry-time">${fmtTime(e.date)}</span>
          </div>
          ${badge}
          ${sub?`<div class="entry-sub">${esc(sub)}</div>`:''}
          ${e.photo?`<span class="entry-thumb-wrap" data-photo="${e.photo}"><img class="entry-thumb" src="${e.photo}"/></span>`:''}
        </button>`;
      }).join('');
      html += `</div></div>`;
    }
  }
  host.innerHTML = html;
  host.querySelectorAll('[data-id]').forEach(b=> b.addEventListener('click', ()=> openEntryModal(null, b.dataset.id)));
  host.querySelectorAll('[data-med]').forEach(b=> b.addEventListener('click', ()=> toggleMedToday(b.dataset.med)));
  host.querySelectorAll('.entry-thumb-wrap').forEach(w=> w.addEventListener('click', (ev)=>{ ev.stopPropagation(); openLightbox(w.dataset.photo); }));
}

function openEntryModal(category, editId){

    title: editing.title||'', quantidade: editing.quantidade||'',

    note: editing.note||'', value: editing.value ?? '', gravidade: editing.gravidade||'',
    comoComeu: editing.comoComeu||'', clinica: editing.clinica||'', tipoExame: editing.tipoExame||EXAME_TIPOS[0],
    photo: editing.photo||''
  } : emptyForm();

  const cat = CATEGORIES[category];
  const host = document.getElementById('modalHost');

  function canSave(){
    if(category==='peso') return form.value!=='' && !isNaN(parseFloat(form.value));
    if(category==='exame') return true;
    return form.title.trim()!=='';
  }

  function fieldsHtml(){

      h += `<div class="field"><label>O que foi oferecido</label>
        <div class="pickgrid" id="foodPick">${foods.map(f=>`<button type="button" class="pick-btn ${form.title===f.name?'sel':''}" style="${form.title===f.name?`background:${cat.hex}`:''}" data-name="${esc(f.name)}">${esc(f.name)}</button>`).join('') || '<span class="hint">Nenhum alimento cadastrado ainda.</span>'}</div>
        <button type="button" class="link-btn" id="openFoodMgr" style="color:${cat.hex}; margin-top:8px">+ Gerenciar alimentos</button>
      </div>
      <div class="field"><label>Quantidade (opcional)</label><input id="f_quantidade" value="${esc(form.quantidade)}" placeholder="ex: 110g, 1 xícara, 1 lata"/></div>
      <div class="field"><label>Como ele comeu</label><div class="como-list" id="comoList">${COMO_COMEU.map(([v,l])=>`<button type="button" class="como-btn ${form.comoComeu===v?'sel':''}" style="${form.comoComeu===v?`background:${cat.hex}`:''}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
    }
    if(category==='remedio'){
      h += `<div class="field"><label>Remédio</label>
        <div class="pickgrid" id="medPick">${meds.map(m=>`<button type="button" class="pick-btn ${form.title===m.name?'sel':''}" style="${form.title===m.name?`background:${cat.hex}`:''}" data-name="${esc(m.name)}" data-dose="${esc(m.dose||'')}" data-horario="${esc(m.horario||'')}">${esc(m.name)}</button>`).join('') || '<span class="hint">Nenhum remédio cadastrado ainda.</span>'}</div>
        <button type="button" class="link-btn" id="openMedMgr" style="color:${cat.hex}; margin-top:8px">+ Gerenciar remédios</button>
        <div class="hint">Dica: pra remédios de hoje, use o checklist na tela principal — é mais rápido que abrir esse formulário.</div>
      </div>`;
    }
    if(category==='peso'){
      h += `<div class="field"><label>Peso (kg)</label><input id="f_value" type="number" step="0.1" value="${esc(String(form.value))}" placeholder="ex: 8.4"/></div>`;
    }
    if(category==='intercorrencia'){
      h += `<div class="field"><label>O que aconteceu</label><input id="f_title" value="${esc(form.title)}" placeholder="ex: Vômito, coceira..."/>
        <div class="pickgrid" id="icPick" style="margin-top:6px">${suggestChips('intercorrencia', form.title)}</div>
      </div>
      <div class="field"><label>Gravidade (opcional)</label><div class="row2">${GRAVIDADES.map(g=>`<button type="button" class="pick-btn ${form.gravidade===g?'sel':''}" style="flex:1; ${form.gravidade===g?`background:${cat.hex}`:''}" data-g="${g}">${g}</button>`).join('')}</div></div>

        <input type="file" id="photoInput" accept="image/*" style="display:none"/>
      </div>`;

      h += `<div class="field"><label>Motivo</label><input id="f_title" value="${esc(form.title)}" placeholder="ex: Consulta de rotina, retorno..."/>

  function suggestChips(kind, val){

  }

    host.innerHTML = `<div class="overlay" id="ovEntry">
      <div class="sheet" id="sheetEntry">

          <div class="sheet-title" style="color:${cat.hex}">${icon(cat.icon,17,cat.hex)}<span style="color:var(--ink)">${editing?'Editar':'Novo'} · ${cat.label}</span></div>

    document.getElementById('btnCancelEntry').addEventListener('click', requestClose);

    document.getElementById('btnSaveEntry').addEventListener('click', save);

    const v = document.getElementById('f_value'); if(v) v.addEventListener('input', e=>{ form.value=e.target.value; toggleSave(); });
    const cl = document.getElementById('f_clinica'); if(cl) cl.addEventListener('input', e=>{ form.clinica=e.target.value; syncSuggestions(); });
    const q = document.getElementById('f_quantidade'); if(q) q.addEventListener('input', e=> form.quantidade=e.target.value);

    const dt = document.getElementById('f_dateT'); if(dt) dt.addEventListener('input', e=> form.dateT=e.target.value);

    const foodPick = document.getElementById('foodPick');
    if(foodPick) foodPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; refreshBody(); }));
    const openFM = document.getElementById('openFoodMgr'); if(openFM) openFM.addEventListener('click', ()=> openFoodManager(()=>{ refreshBody(); }));

    if(medPick) medPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      form.title=b.dataset.name;
      if(!form.note && b.dataset.dose) form.note=b.dataset.dose;
      if(!editing && b.dataset.horario) form.dateT=b.dataset.horario;
      refreshBody();
    }));
    const openMM = document.getElementById('openMedMgr'); if(openMM) openMM.addEventListener('click', ()=> openMedManager(()=>{ refreshBody(); }));

    const comoList = document.getElementById('comoList');
    if(comoList) comoList.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.comoComeu = form.comoComeu===b.dataset.v ? '' : b.dataset.v; refreshBody(); }));

    const gravRow = document.querySelectorAll('[data-g]');
    gravRow.forEach(b=> b.addEventListener('click', ()=>{ form.gravidade = form.gravidade===b.dataset.g ? '' : b.dataset.g; refreshBody(); }));
    wirePhoto();

    const exPick = document.getElementById('exPick');
    if(exPick) exPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.tipoExame=b.dataset.t; refreshBody(); }));

    document.querySelectorAll('[data-sugg]').forEach(b=> b.addEventListener('click', ()=>{
      const kind=b.dataset.sugg, val=b.dataset.val;
      if(kind==='clinica') form.clinica=val; else form.title=val;
      refreshBody();
    }));
  }

  function syncSuggestions(){
    // live re-render just the suggestion rows without losing focus on text inputs: simplest reliable approach is full refresh of body except focused field's caret;
    // acceptable tradeoff here given text fields are short.
  }
  function toggleSave(){ document.getElementById('btnSaveEntry').disabled = !canSave(); }

  function wirePhoto(){
    const addBtn = document.getElementById('addPhotoBtn');
    const input = document.getElementById('photoInput');
    const removeBtn = document.getElementById('removePhoto');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        form.photo = await resizeImageFile(file);
      }catch(err){
        console.error('Erro ao processar foto', err);
        showWarning('Não consegui processar essa foto. Tenta outra.');
      }
      refreshBody();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{ form.photo=''; refreshBody(); });
  }
  function refreshBody(){ document.getElementById('bodyEntry').innerHTML = fieldsHtml(); wireBodyOnly(); toggleSave(); }
  function wireBodyOnly(){
    const t = document.getElementById('f_title'); if(t) t.addEventListener('input', e=>{ form.title=e.target.value; toggleSave(); });
    const v = document.getElementById('f_value'); if(v) v.addEventListener('input', e=>{ form.value=e.target.value; toggleSave(); });
    const cl = document.getElementById('f_clinica'); if(cl) cl.addEventListener('input', e=>{ form.clinica=e.target.value; });
    const q = document.getElementById('f_quantidade'); if(q) q.addEventListener('input', e=> form.quantidade=e.target.value);
    const nt = document.getElementById('f_note'); if(nt) nt.addEventListener('input', e=> form.note=e.target.value);
    const dd = document.getElementById('f_dateD'); if(dd) dd.addEventListener('input', e=> form.dateD=e.target.value);
    const dt = document.getElementById('f_dateT'); if(dt) dt.addEventListener('input', e=> form.dateT=e.target.value);
    const foodPick = document.getElementById('foodPick'); if(foodPick) foodPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; refreshBody(); }));
    const openFM = document.getElementById('openFoodMgr'); if(openFM) openFM.addEventListener('click', ()=> openFoodManager(()=>{ refreshBody(); }));
    const medPick = document.getElementById('medPick'); if(medPick) medPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; if(!form.note && b.dataset.dose) form.note=b.dataset.dose; if(!editing && b.dataset.horario) form.dateT=b.dataset.horario; refreshBody(); }));
    const openMM = document.getElementById('openMedMgr'); if(openMM) openMM.addEventListener('click', ()=> openMedManager(()=>{ refreshBody(); }));
    const comoList = document.getElementById('comoList'); if(comoList) comoList.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.comoComeu = form.comoComeu===b.dataset.v ? '' : b.dataset.v; refreshBody(); }));
    document.querySelectorAll('[data-g]').forEach(b=> b.addEventListener('click', ()=>{ form.gravidade = form.gravidade===b.dataset.g ? '' : b.dataset.g; refreshBody(); }));
    wirePhoto();
    const exPick = document.getElementById('exPick'); if(exPick) exPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.tipoExame=b.dataset.t; refreshBody(); }));
    document.querySelectorAll('[data-sugg]').forEach(b=> b.addEventListener('click', ()=>{ const kind=b.dataset.sugg, val=b.dataset.val; if(kind==='clinica') form.clinica=val; else form.title=val; refreshBody(); }));
  }

  function requestClose(){
    const hasText = form.title.trim()!=='' || form.note.trim()!=='' || form.value!=='';
    if(!editing && hasText){
      document.getElementById('footEntry').outerHTML = `<div class="confirm-box"><p>Descartar o que você preencheu?</p><div style="display:flex; gap:8px">
        <button class="btn-secondary" id="btnKeepEditing" style="flex:1">Continuar editando</button>
        <button class="btn-danger" id="btnDiscard">Descartar</button>
      </div></div>`;
      document.getElementById('btnKeepEditing').addEventListener('click', render);
      document.getElementById('btnDiscard').addEventListener('click', closeModal);
    } else closeModal();
  }

  function save(){
    const dateIso = new Date(`${form.dateD}T${form.dateT}`).toISOString();
    let entry = { id: editing? editing.id : genId(), category, date: dateIso, note: form.note.trim(), createdAt: editing? editing.createdAt : Date.now() };
    if(category==='peso'){ entry.value = parseFloat(form.value); entry.title='Peso'; }
    else if(category==='exame'){ entry.title=form.tipoExame; entry.tipoExame=form.tipoExame; }
    else if(category==='intercorrencia'){ entry.title=form.title.trim(); entry.gravidade=form.gravidade; if(form.photo) entry.photo=form.photo; }
    else if(category==='consulta'){ entry.title=form.title.trim(); entry.clinica=form.clinica.trim(); }
    else if(category==='alimentacao'){ entry.title=form.title.trim(); entry.comoComeu=form.comoComeu; entry.quantidade=form.quantidade.trim(); }
    else entry.title=form.title.trim();

    if(editing) entries = entries.map(e=> e.id===editing.id? entry : e);
    else entries.push(entry);
    entries.sort((a,b)=> new Date(b.date)-new Date(a.date));
    const ok = persistEntries();
    if(!ok) showWarning('Não consegui salvar esse registro no armazenamento do navegador. Tente novamente.');

    if(category==='intercorrencia' && entry.title && !chips.intercorrencia.includes(entry.title)){ chips.intercorrencia.push(entry.title); persistChips('intercorrencia'); }
    if(category==='consulta'){
      if(entry.title && !chips.consulta.includes(entry.title)){ chips.consulta.push(entry.title); persistChips('consulta'); }
      if(entry.clinica && !chips.clinica.includes(entry.clinica)){ chips.clinica.push(entry.clinica); persistChips('clinica'); }
    }
    if(category==='procedimento' && entry.title && !chips.procedimento.includes(entry.title)){ chips.procedimento.push(entry.title); persistChips('procedimento'); }

    closeModal();
    renderAll();
  }

  render();
}

function closeModal(){ document.getElementById('modalHost').innerHTML=''; }

  const host = document.getElementById('modalHost');
  host.innerHTML = `<div class="overlay" id="ovDel" style="align-items:center">
    <div style="background:#fff; border-radius:16px; padding:20px; max-width:320px; width:calc(100% - 48px)">
      <div style="font-size:.9rem; font-weight:600; margin-bottom:4px">Excluir registro?</div>
      <div style="font-size:.75rem; color:var(--ink-muted); margin-bottom:16px">Essa ação não pode ser desfeita.</div>
      <div style="display:flex; gap:8px">
        <button class="btn-secondary" id="btnCancelDel" style="flex:1">Cancelar</button>
        <button class="btn-danger" id="btnConfirmDel">Excluir</button>
      </div>
    </div>
  </div>`;
  document.getElementById('ovDel').addEventListener('click', e=>{ if(e.target.id==='ovDel') closeModal(); });
  document.getElementById('btnCancelDel').addEventListener('click', closeModal);
  document.getElementById('btnConfirmDel').addEventListener('click', ()=>{
    entries = entries.filter(e=>e.id!==id);

}

// ================= FOOD MANAGER =================
function openFoodManager(onDone){
  const host = document.getElementById('modalHost');
  let list = foods.slice();
  function render(){
    host.innerHTML = `<div class="overlay" id="ovFood">
      <div class="sheet">
        <div class="sheet-head"><div class="sheet-title">Meus alimentos</div><button class="icon-btn" id="closeFood">${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div class="hint" style="margin-bottom:12px">Cadastre aqui tudo que o Otto costuma comer. Depois é só tocar, sem digitar de novo.</div>
          <div style="display:flex; gap:8px; margin-bottom:14px">
            <input id="newFoodName" placeholder="ex: Ração seca, Frango com arroz..." style="flex:1; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; background:#FBFAF7; font-family:inherit"/>
            <button id="addFoodBtn" style="flex-shrink:0; border:none; border-radius:12px; padding:0 16px; background:${CATEGORIES.alimentacao.hex}; color:#fff">${icon('plus',18,'#fff')}</button>
          </div>
          <div id="foodList">${list.map(f=>`<div class="manager-item"><span class="name">${esc(f.name)}</span><button class="del-btn" data-id="${f.id}">${icon('trash',14,'var(--ink-muted)')}</button></div>`).join('') || '<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>'}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneFoodBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovFood').addEventListener('click', e=>{ if(e.target.id==='ovFood') finish(); });
    document.getElementById('closeFood').addEventListener('click', finish);
    document.getElementById('doneFoodBtn').addEventListener('click', finish);
    document.getElementById('addFoodBtn').addEventListener('click', addFood);
    document.getElementById('newFoodName').addEventListener('keydown', e=>{ if(e.key==='Enter') addFood(); });
    document.querySelectorAll('#foodList .del-btn').forEach(b=> b.addEventListener('click', ()=>{ list = list.filter(f=>f.id!==b.dataset.id); render(); }));
  }
  function addFood(){
    const input = document.getElementById('newFoodName');
    const n = input.value.trim();
    if(!n) return;
    if(list.some(f=>f.name.toLowerCase()===n.toLowerCase())){ input.value=''; return; }
    list.push({id:genId(), name:n});
    render();
  }
  function finish(){
    foods = list;
    persistFoods();
    closeModal();
    if(onDone) onDone();
  }
  render();
}

// ================= MED MANAGER =================
function openMedManager(onDone){
  const host = document.getElementById('modalHost');
  let list = meds.slice();
  let adding = false;
  let draft = {name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horario:''};

  function render(){
    host.innerHTML = `<div class="overlay" id="ovMed">
      <div class="sheet" style="max-height:90vh">
        <div class="sheet-head"><div class="sheet-title">Meus remédios</div><button class="icon-btn" id="closeMed">${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div class="hint" style="margin-bottom:12px">Cadastre uma vez. Remédios contínuos aparecem todo dia no checklist; pontuais só entre a data de início e fim.</div>
          <div id="medList">${list.map(m=>`<div class="manager-item"><div><div class="name">${esc(m.name)}</div><div class="sub">${m.tipo==='continuo'?'Contínuo':`Pontual · ${fmtDateShort(m.dataInicio)} a ${fmtDateShort(m.dataFim)}`}${m.horario?' · '+m.horario:''}${m.dose?' · '+esc(m.dose):''}</div></div><button class="del-btn" data-id="${m.id}">${icon('trash',14,'var(--ink-muted)')}</button></div>`).join('') || (adding?'':'<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>')}</div>
          <div id="addArea"></div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneMedBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovMed').addEventListener('click', e=>{ if(e.target.id==='ovMed') finish(); });
    document.getElementById('closeMed').addEventListener('click', finish);
    document.getElementById('doneMedBtn').addEventListener('click', finish);
    document.querySelectorAll('#medList .del-btn').forEach(b=> b.addEventListener('click', ()=>{ list = list.filter(m=>m.id!==b.dataset.id); render(); }));
    renderAddArea();
  }

  function renderAddArea(){
    const area = document.getElementById('addArea');
    if(!adding){
      area.innerHTML = `<button class="add-trigger" id="startAdd">${icon('plus',15)} Cadastrar remédio</button>`;
      document.getElementById('startAdd').addEventListener('click', ()=>{ adding=true; draft={name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horario:''}; renderAddArea(); });
      return;
    }
    area.innerHTML = `<div class="add-form">
      <div class="field"><label>Nome do remédio</label><input id="d_name" value="${esc(draft.name)}" placeholder="ex: Omeprazol"/></div>
      <div class="field"><label>Tipo</label><div class="tipo-toggle">
        <button data-tipo="continuo" class="${draft.tipo==='continuo'?'sel':''}">Contínuo</button>
        <button data-tipo="pontual" class="${draft.tipo==='pontual'?'sel':''}">Pontual (início e fim)</button>
      </div></div>
      ${draft.tipo==='pontual'? `<div class="row2">
        <div class="field"><label>Início</label><input id="d_inicio" type="date" value="${draft.dataInicio}"/></div>
        <div class="field"><label>Fim</label><input id="d_fim" type="date" value="${draft.dataFim}"/></div>
      </div>` : ''}
      <div class="field"><label>Dose / instruções (opcional)</label><input id="d_dose" value="${esc(draft.dose)}" placeholder="ex: 1 comprimido"/></div>
      <div class="field"><label>Horário programado (opcional)</label><input id="d_horario" type="time" value="${draft.horario}"/>
        <div class="hint">Ao tocar em "dado agora" no checklist, o registro usa esse horário — não o momento exato do toque.</div>
      </div>
      <div style="display:flex; gap:8px; margin-top:4px">
        <button class="btn-secondary" id="cancelAdd" style="flex:1">Cancelar</button>
        <button class="btn-primary" id="confirmAdd" ${draft.name.trim()?'':'disabled'}>Adicionar</button>
      </div>
    </div>`;
    document.getElementById('d_name').addEventListener('input', e=>{ draft.name=e.target.value; document.getElementById('confirmAdd').disabled = !draft.name.trim(); });
    document.querySelectorAll('[data-tipo]').forEach(b=> b.addEventListener('click', ()=>{ draft.tipo=b.dataset.tipo; renderAddArea(); }));
    const di = document.getElementById('d_inicio'); if(di) di.addEventListener('input', e=> draft.dataInicio=e.target.value);
    const df = document.getElementById('d_fim'); if(df) df.addEventListener('input', e=> draft.dataFim=e.target.value);
    document.getElementById('d_dose').addEventListener('input', e=> draft.dose=e.target.value);
    document.getElementById('d_horario').addEventListener('input', e=> draft.horario=e.target.value);
    document.getElementById('cancelAdd').addEventListener('click', ()=>{ adding=false; renderAddArea(); });
    document.getElementById('confirmAdd').addEventListener('click', ()=>{
      const n = draft.name.trim(); if(!n) return;
      list.push({ id:genId(), name:n, tipo:draft.tipo, dataInicio: draft.tipo==='pontual'?draft.dataInicio:'', dataFim: draft.tipo==='pontual'?draft.dataFim:'', dose:draft.dose.trim(), horario:draft.horario });
      adding=false;
      render();
    });
  }

  function finish(){ meds=list; persistMeds(); closeModal(); if(onDone) onDone(); }
  render();
}

// ---------- top-level wiring ----------
document.getElementById('btnSettings').addEventListener('click', openSettings);
document.getElementById('searchInput').addEventListener('input', e=>{ search=e.target.value; renderTimeline(); });

renderQuickActions();
renderFilters();
renderAll();
</script>
