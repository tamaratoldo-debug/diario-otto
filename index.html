<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Diário do Otto" />
<title>Diário do Otto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F8; --panel-bg:#EEF0F5; --ink:#20242C; --ink-muted:#8A8F9C; --accent:#4A6FE0;
    --c-alimentacao:#D98A2E; --c-alimentacao-bg:#FBEEDB;
    --c-remedio:#3EAE8A; --c-remedio-bg:#E0F4EC;
    --c-peso:#4C6FFF; --c-peso-bg:#E7ECFF;
    --c-intercorrencia:#E0604A; --c-intercorrencia-bg:#FBE6E1;
    --c-consulta:#7B61E0; --c-consulta-bg:#ECE7FB;
    --c-procedimento:#D9569B; --c-procedimento-bg:#FBE5F0;
    --c-exame:#6B7A99; --c-exame-bg:#E9ECF2;
    --c-creche:#A97C50; --c-creche-bg:#F2E8DC;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{overflow-x:hidden; margin:0; padding:0}
  body{background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--ink); padding-bottom:calc(40px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color:transparent}
  .display{font-family:'Space Grotesk',system-ui,sans-serif}
  .wrap{max-width:460px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 0}
  .card{background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); margin:0 4px}
  .hero{position:relative; overflow:hidden; height:220px; border-radius:24px; background:linear-gradient(135deg,#DCE3F0,#EAEDF5)}
  .hero-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .hero-noPhoto{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#AEB7D6}
  .hero-gradient{position:absolute; inset:0; background:linear-gradient(to top, rgba(15,18,30,.68), rgba(15,18,30,0) 55%)}
  .hero-settings{position:absolute; top:14px; right:14px; z-index:2; background:rgba(255,255,255,.28); border:none; color:#fff; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px)}
  .hero-content{position:absolute; left:0; right:0; bottom:0; z-index:1; padding:16px 18px; text-align:center}
  .hero-name{font-family:'Fraunces',serif; font-weight:600; font-size:1.85rem; line-height:1; color:#fff}
  .hero-meta{font-size:.78rem; color:rgba(255,255,255,.85); margin-top:5px}

  .quick-card{background:#fff; border-radius:22px; padding:18px 12px; margin-top:14px; box-shadow:0 1px 2px rgba(20,24,40,0.05)}
  .quick-grid{display:flex; flex-wrap:wrap; justify-content:center; gap:16px 10px}
  .quick-grid button{width:74px}
  .quick-grid button{background:none; border:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:7px; font-family:inherit; cursor:pointer}
  .quick-grid .icon-circle{width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .quick-grid .lbl{font-size:.66rem; font-weight:500; color:var(--ink); text-align:center; line-height:1.15}

  .section{margin-top:16px; padding:16px}
  .link-btn{background:none; border:none; font-size:.75rem; font-weight:600; display:flex; align-items:center; gap:4px; cursor:pointer; padding:0}
  .section-title{font-size:.9rem; font-weight:600}

  .pending-checkbox{width:18px; height:18px; border-radius:50%; border:2px solid #7FB89A; flex-shrink:0; display:flex; align-items:center; justify-content:center}
  .rep-overlay{position:fixed; inset:0; background:#fff; z-index:200; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .rep-bar{position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid #E5E5E5; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; justify-content:space-between}
  .rep-doc{font-family:Helvetica,Arial,sans-serif; color:#151515; padding:18px 18px 40px; max-width:600px; margin:0 auto}
  .rep-h1{font-size:1.25rem; font-weight:700; margin:0; color:#2E4F3B}
  .rep-sub{font-size:.78rem; color:#151515; margin:4px 0 0}
  .rep-hr{border:none; border-top:0.8px solid #C9C9C9; margin:10px 0 14px}
  .rep-h2{font-size:.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:20px 0 8px; color:#2E4F3B}
  .rep-table{width:100%; border-collapse:collapse; font-size:.78rem}
  .rep-table th{text-align:left; font-size:.7rem; color:#151515; font-weight:700; border-bottom:0.8px solid #C9C9C9; padding:4px 6px 4px 0}
  .rep-table td{border-bottom:0.6px solid #E2E2E2; padding:4px 6px 4px 0; vertical-align:top}
  .rep-table td:first-child{color:#2E4F3B; font-weight:700}
  .rep-day{border:0.7px solid #C9C9C9; margin-bottom:7px; break-inside:avoid; page-break-inside:avoid}
  .rep-daily-start{break-before:page; page-break-before:always}
  .rep-day-row{display:flex; border-bottom:0.4px solid #E2E2E2}
  .rep-day-row:last-child{border-bottom:none}
  .rep-day-label{flex:0 0 82px; font-size:.66rem; font-weight:700; padding:4px 5px; border-right:0.4px solid #E2E2E2; color:#151515}
  .rep-day-val{flex:1; font-size:.68rem; padding:4px 5px; line-height:1.25}
  .rep-small{font-size:.68rem; color:#5A5A5A}
  @media print{
    .rep-bar{display:none}
    .rep-overlay{position:static}
    body > .wrap, #warningHost, #backupBannerHost{display:none !important}
  }
  .photo-preview{position:relative; display:inline-block; margin-top:2px}
  .photo-preview img{width:100px; height:100px; object-fit:cover; border-radius:10px; display:block; border:1px solid #E5E0D4}
  .photo-remove{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:999px; background:#A8473A; border:2px solid #fff; display:flex; align-items:center; justify-content:center; cursor:pointer}
  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px}
  .lightbox-close{position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:999px; background:rgba(255,255,255,.15); border:none; display:flex; align-items:center; justify-content:center}

  .chart-wrap{height:130px; margin-top:4px}

  .search-box{display:flex; align-items:center; gap:8px; background:transparent; border:1px solid #E2E4EA; border-radius:12px; padding:8px 12px}
  .search-box input{border:none; outline:none; flex:1; font-size:16px; background:transparent; font-family:inherit}
  .filters{display:flex; gap:8px; overflow-x:auto; margin-top:10px; padding-bottom:4px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip-filter{white-space:nowrap; font-size:.75rem; font-weight:500; padding:6px 12px; border-radius:999px; border:1px solid #EAE5DA; background:#fff; color:var(--ink-muted); flex-shrink:0; cursor:pointer}
  .chip-filter.active{border:none; color:#fff}

  .month-label{font-size:.9rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink); margin:22px 4px 10px}
  .day-squares-row{display:flex; gap:8px; overflow-x:auto; padding:2px 4px 10px; scrollbar-width:none}
  .day-squares-row::-webkit-scrollbar{display:none}
  .day-square{flex-shrink:0; width:46px; display:flex; flex-direction:column; align-items:center; gap:3px; background:#fff; border:1px solid #EFEBE1; border-radius:12px; padding:8px 4px 7px; font-family:inherit; cursor:pointer}
  .day-square.active{background:var(--ink); border-color:var(--ink)}
  .day-square .ds-n{font-weight:700; font-size:1.05rem; line-height:1; color:var(--ink)}
  .day-square.active .ds-n{color:#fff}
  .day-square .ds-w{font-size:.6rem; font-weight:500; color:var(--ink-muted); text-transform:uppercase}
  .day-square.active .ds-w{color:rgba(255,255,255,.65)}
  .day-card{background:#fff; border-radius:12px; padding:12px; display:flex; gap:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); margin-bottom:8px}
  .day-num{display:flex; flex-direction:column; align-items:center; width:44px; flex-shrink:0; padding-top:2px}
  .day-num .n{font-weight:700; font-size:1.3rem; line-height:1}
  .day-num .m{font-size:.65rem; font-weight:500; color:var(--ink-muted)}
  .day-sep{width:1px; background:#EFEBE1; align-self:stretch}
  .entries-col{flex:1; min-width:0}
  .entry-row{width:100%; text-align:left; background:none; border:none; padding:10px 0; font-family:inherit; cursor:pointer; border-bottom:1px solid #F1EEE6; color:var(--ink)}
  .entry-row:last-child{border-bottom:none; padding-bottom:0}
  .entry-row:first-child{padding-top:0}
  .entry-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .entry-title{display:flex; align-items:center; gap:6px; min-width:0; font-size:.88rem; font-weight:600}
  .entry-title span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .entry-time{font-size:.7rem; color:var(--ink-muted); font-family:'Space Grotesk',sans-serif; flex-shrink:0}
  .entry-sub{font-size:.72rem; color:var(--ink-muted); margin-top:3px; line-height:1.3}
  .badge{display:inline-block; font-size:.62rem; font-weight:600; padding:2px 6px; border-radius:4px}

  .empty-state{text-align:center; padding:56px 0; color:var(--ink-muted)}

  .warning-fixed{position:fixed; top:calc(12px + env(safe-area-inset-top)); left:0; right:0; z-index:70; display:flex; justify-content:center; padding:0 16px; pointer-events:none}
  .warning-banner{display:flex; gap:8px; background:#FBEAE7; border:1px solid #E3B5AC; border-radius:12px; padding:10px 12px; font-size:.75rem; color:#8A3A30; align-items:flex-start; max-width:460px; width:100%; pointer-events:auto; box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .warning-banner button{background:none; border:none; flex-shrink:0}

  /* Modal / bottom sheet */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50}
  .sheet{background:#fff; border-radius:24px 24px 0 0; width:100%; max-width:460px; max-height:88vh; display:flex; flex-direction:column; animation:slideUp .2s ease-out}
  @keyframes slideUp{from{transform:translateY(24px); opacity:0} to{transform:translateY(0); opacity:1}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid #F1EEE6; flex-shrink:0}
  .sheet-title{display:flex; align-items:center; gap:8px; font-weight:600; font-size:1rem; min-width:0}
  .icon-btn{width:40px; height:40px; border-radius:999px; border:none; background:#F1EEE6; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0}
  .icon-btn:disabled{opacity:.35; cursor:default}
  .icon-btn.danger{background:#F6E9E6}
  .sheet-body{overflow-y:auto; overflow-x:hidden; padding:16px 20px 4px; flex:1; min-height:0}
  .sheet-foot{display:flex; gap:8px; padding:12px 20px 20px; border-top:1px solid #F1EEE6; flex-shrink:0}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:.72rem; font-weight:500; color:var(--ink-muted); margin-bottom:6px}
  .field input, .field textarea, .field select{width:100%; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; color:var(--ink); background:#FBFAF7; font-family:inherit; box-sizing:border-box}
  .dt-wrap{position:relative}
  .dt-display{width:100%; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; color:var(--ink); background:#FBFAF7; box-sizing:border-box; min-height:22px; display:flex; align-items:center; gap:8px; pointer-events:none}
  .dt-native{position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:16px; border:none; margin:0; padding:0}
  .field textarea{min-height:70px; resize:vertical}
  .row2{display:flex; gap:8px}
  .row2 > *{min-width:0}
  .row2 .field{flex:1}
  .pickgrid{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
  .pick-btn{font-size:.85rem; font-weight:500; padding:9px 13px; border-radius:10px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .med-pick-btn{font-family:inherit; text-align:left; padding:9px 13px; border-radius:10px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .med-pick-btn .mp-name{font-size:.85rem; font-weight:500}
  .med-pick-btn .mp-sub{font-size:.68rem; opacity:.75; margin-top:2px}
  .pick-btn.sel{color:#fff}
  .como-list{display:flex; flex-direction:column; gap:6px}
  .como-btn{text-align:left; font-size:.88rem; font-weight:500; padding:11px 13px; border-radius:10px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .como-btn.sel{color:#fff}
  .btn-primary{flex:1; padding:13px; border-radius:12px; border:none; background:var(--ink); color:#fff; font-weight:600; font-size:.9rem; cursor:pointer; font-family:inherit}
  .btn-primary:disabled{opacity:.4}
  .btn-secondary{padding:13px 16px; border-radius:12px; border:none; background:#F1EEE6; color:var(--ink); font-weight:600; font-size:.9rem; cursor:pointer; font-family:inherit}
  .btn-danger{flex:1; padding:11px; border-radius:10px; border:none; background:#A8473A; color:#fff; font-weight:600; font-size:.85rem; cursor:pointer; font-family:inherit}
  .hint{font-size:.68rem; color:var(--ink-muted); margin-top:4px}
  .manager-item{display:flex; align-items:center; justify-content:space-between; background:#FBFAF7; border-radius:10px; padding:10px 12px; margin-bottom:6px}
  .manager-item .name{font-size:.88rem; font-weight:500}
  .manager-item .sub{font-size:.68rem; color:var(--ink-muted)}
  .del-btn{background:none; border:none; flex-shrink:0; margin-left:8px; cursor:pointer}
  .add-form{background:#FBFAF7; border:1px solid #E5E0D4; border-radius:12px; padding:12px; margin-bottom:8px}
  .tipo-toggle{display:flex; gap:6px}
  .tipo-toggle button{flex:1; font-size:.72rem; font-weight:500; padding:9px 6px; border-radius:8px; border:none; background:#F1EEE6; color:var(--ink); cursor:pointer}
  .tipo-toggle button.sel{color:#fff; background:var(--c-remedio)}
  .add-trigger{width:100%; padding:11px; border-radius:10px; border:none; background:#F1EEE6; display:flex; align-items:center; justify-content:center; gap:6px; font-size:.85rem; font-weight:500; cursor:pointer; font-family:inherit}
  .confirm-box{padding:16px 20px 20px}
  .confirm-box p{font-size:.8rem; color:var(--ink-muted); margin:0 0 12px}
</style>
</head>
<body>

<div id="warningHost"></div>
<div id="backupBannerHost"></div>

<div class="wrap">

  <div class="hero" id="heroCard"></div>

  <div class="quick-card">
    <div class="quick-grid" id="quickActions"></div>
  </div>

  <div style="margin-top:20px; padding:0 4px">
    <div style="display:flex; align-items:center; gap:8px">
      <button id="searchToggleBtn" style="flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid #E2E4EA; background:transparent; display:flex; align-items:center; justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <div class="filters" id="filterChips" style="margin-top:0"></div>
    </div>
    <div class="search-box" id="searchBox" style="display:none; margin-top:10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Buscar registros..." />
      <button id="searchCloseBtn" style="background:none; border:none; padding:2px; display:flex; flex-shrink:0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <div style="margin-top:16px; padding:0 4px" id="timeline"></div>
</div>

<div id="modalHost"></div>
<div id="lightboxHost"></div>

<script>
// ---------- storage (localStorage, synchronous — no more hanging saves) ----------
const store = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v===null? fallback : JSON.parse(v);}catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ console.error('storage error', e); return false; } }
};

// ---------- config ----------
const CATEGORIES = {
  alimentacao:{label:'Alimentação', short:'Alimentação', color:'var(--c-alimentacao)', hex:'#D98A2E', bgHex:'#FBEEDB', icon:'utensils'},
  remedio:{label:'Remédio', short:'Remédio', color:'var(--c-remedio)', hex:'#3EAE8A', bgHex:'#E0F4EC', icon:'pill'},
  peso:{label:'Peso', short:'Peso', color:'var(--c-peso)', hex:'#4C6FFF', bgHex:'#E7ECFF', icon:'scale'},
  intercorrencia:{label:'Intercorrência', short:'Intercorrência', color:'var(--c-intercorrencia)', hex:'#E0604A', bgHex:'#FBE6E1', icon:'alert'},
  consulta:{label:'Consulta', short:'Consulta', color:'var(--c-consulta)', hex:'#7B61E0', bgHex:'#ECE7FB', icon:'stethoscope'},
  procedimento:{label:'Procedimento', short:'Procedimento', color:'var(--c-procedimento)', hex:'#D9569B', bgHex:'#FBE5F0', icon:'syringe'},
  exame:{label:'Exame', short:'Exame', color:'var(--c-exame)', hex:'#6B7A99', bgHex:'#E9ECF2', icon:'flask'},
  creche:{label:'Creche', short:'Creche', color:'var(--c-creche)', hex:'#A97C50', bgHex:'#F2E8DC', icon:'home'}
};
const CATEGORY_ORDER = ['alimentacao','remedio','peso','intercorrencia','consulta','procedimento','exame'];
const COMO_COMEU = [
  ['tudo_vontade','Comeu tudo com vontade'],
  ['tudo','Comeu tudo'],
  ['parte','Comeu só parte'],
  ['cheirou_recusou','Cheirou e recusou'],
  ['recusou','Recusou totalmente']
];
const COMO_COMEU_MAP = Object.fromEntries(COMO_COMEU);
const GRAVIDADES = ['Leve','Moderada','Grave'];
const EXAME_TIPOS = ['Sangue','Imagem','Urina','Fezes','Outro'];

const ICONS = {
  utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  scale:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v4l2.5 2.5"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>',
  stethoscope:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/><path d="M3.22 8H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  flask:'<path d="M10 2v7.31"/><path d="M14 9.3V2"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  chevronDown:'<path d="m6 9 6 6 6-6"/>',
  chevronUp:'<path d="m18 15-6-6-6 6"/>',
  chevronLeft:'<path d="m15 18-6-6 6-6"/>',

// Custom-styled date/time field: the real <input type="date/time"> stays in the DOM but invisible
// (opacity:0) so tapping it still opens the native iOS picker exactly where it sits, while a
// styled div underneath shows the value in our own compact format. This sidesteps Safari's
// unstylable native date/time chrome entirely instead of fighting it with CSS overrides.
function dtField(id, type, value, placeholder){
  const iconName = type==='time' ? 'clock' : 'calendar';
  const display = type==='time'
    ? (value || `<span style="color:#B3AFA3">${placeholder||'Selecionar'}</span>`)
    : (value ? fmtDateDMY(value) : `<span style="color:#B3AFA3">${placeholder||'Selecionar'}</span>`);
  return `<div class="dt-wrap">
    <div class="dt-display" id="${id}_display">${icon(iconName,15,'#8A8F9C')}<span>${display}</span></div>
    <input type="${type}" id="${id}" class="dt-native" value="${value||''}"/>
  </div>`;
}
function wireDtField(id, onChange){
  const input = document.getElementById(id);
  if(!input) return;
  input.addEventListener('change', e=>{
    const v = e.target.value;
    if(onChange) onChange(v);
    const disp = document.getElementById(id+'_display');
    if(disp){
      const type = input.type;
      const text = type==='time' ? (v||'Selecionar') : (v? fmtDateDMY(v) : 'Selecionar');
      const span = disp.querySelector('span');
      if(span) span.textContent = text;
    }
  });
}

// Photos live in IndexedDB, not localStorage: the quota is far larger (typically
// hundreds of MB, vs ~5-10MB for localStorage), so photos can stay near full quality.
const PHOTO_DB_NAME = 'ottoPhotosDB';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('photos');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPutPhoto(id, blob){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').put(blob, id);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGetPhoto(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readonly');
    const req = tx.objectStore('photos').get(id);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbDeletePhoto(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

// Resizes + compresses a photo, returning a Blob (more memory-efficient than base64
// for IndexedDB). Near-full quality now that storage isn't the constraint it was.
function resizeImageFile(file, maxDim=1600, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=> resolve(blob), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Migração: remédios antigos tinham 1 horário só (campo "horario"). Agora tem
// uma lista de horários ("horarios"), e existe um terceiro tipo "sob-demanda"
// (remédio salvo mas sem horário fixo, tipo "dou se precisar").
(function migrateMedsToHorarios(){
  let changed = false;
  meds = meds.map(m=>{
    if(m.horarios) return m;
    changed = true;
    const horarios = m.horario ? [m.horario] : [];
    const { horario, ...rest } = m;
    return { ...rest, horarios };
  });
  if(changed) store.set('otto:meds', meds);
})();
// Migração: cada horário agora tem sua própria dose (ex: CBD pode ser 6 gts de
// manhã e 11 à noite). Remédios antigos tinham 1 dose só pra todos os
// horários — aqui ela é copiada pra cada horário, sem perder o que já tinha.
(function migrateMedsToPerHorarioDose(){
  let changed = false;
  meds = meds.map(m=>{
    if(!m.horarios || m.horarios.length===0) return m;
    if(typeof m.horarios[0] === 'object') return m;
    changed = true;
    const horarios = m.horarios.map(h=> ({ time:h, dose:m.dose||'' }));
    return { ...m, horarios };
  });
  if(changed) store.set('otto:meds', meds);
})();
// Fusão: antes de hoje, "2x ao dia" só dava pra fazer cadastrando o mesmo
// remédio duas vezes (um pra cada horário). Agora que um remédio aceita
// vários horários, junta automaticamente os que têm mesmo nome/tipo/período
// num só, somando os horários de todos.
(function mergeDuplicateMedsByName(){
  const groups = new Map();
  for(const m of meds){
    const key = [m.name.trim().toLowerCase(), m.tipo, m.dataInicio||'', m.dataFim||''].join('|');
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  let changed = false;
  const merged = [];
  const idRemap = {}; // id do remedio descartado -> id do que sobreviveu
  for(const group of groups.values()){
    if(group.length===1){ merged.push(group[0]); continue; }
    changed = true;
    const survivor = group[0];
    const byTime = new Map();
    for(const m of group){ for(const h of (m.horarios||[])){ if(!byTime.has(h.time)) byTime.set(h.time, h); } }
    const horarios = [...byTime.values()].sort((a,b)=> a.time.localeCompare(b.time));
    merged.push({ ...survivor, horarios });
    for(const m of group){ if(m.id!==survivor.id) idRemap[m.id] = survivor.id; }
  }
  if(changed){
    meds = merged;
    store.set('otto:meds', meds);
    // Redireciona lançamentos já feitos que apontavam pro remédio descartado
    let entriesChanged = false;
    entries = entries.map(e=>{
      if(e.medId && idRemap[e.medId]){ entriesChanged = true; return { ...e, medId: idRemap[e.medId] }; }
      return e;
    });
    if(entriesChanged) writeStore('otto:entries', entries);
  }
})();
// Segunda fusão, mais tolerante: a primeira só juntava remédios com nome+tipo
// e MESMO início/fim exatos. Essa aqui junta só por nome+tipo (ignora
// pequenas diferenças de data), pra pegar duplicatas que escaparam da
// primeira passada — somando os horários de cada cópia num remédio só.
(function mergeDuplicateMedsByNameLoose(){
  const groups = new Map();
  for(const m of meds){
    const key = m.name.trim().toLowerCase()+'|'+m.tipo;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  let changed = false;
  const merged = [];
  const idRemap2 = {};
  for(const group of groups.values()){
    if(group.length===1){ merged.push(group[0]); continue; }
    changed = true;
    const survivor = group.reduce((a,b)=> (a.horarios||[]).length >= (b.horarios||[]).length ? a : b);
    const byTime = new Map();
    for(const m of group){ for(const h of (m.horarios||[])){ if(!byTime.has(h.time) || !byTime.get(h.time).dose) byTime.set(h.time, h); } }
    const horarios = [...byTime.values()].sort((a,b)=> a.time.localeCompare(b.time));
    merged.push({ ...survivor, horarios });
    for(const m of group){ if(m.id!==survivor.id) idRemap2[m.id] = survivor.id; }
  }
  if(changed){
    meds = merged;
    store.set('otto:meds', meds);
    let entriesChanged = false;
    entries = entries.map(e=>{
      if(e.medId && idRemap2[e.medId]){ entriesChanged = true; return { ...e, medId: idRemap2[e.medId] }; }
      return e;
    });
    if(entriesChanged) writeStore('otto:entries', entries);
  }
})();

})();
(function dedupeMeds(){
  const seen = new Set();
  const deduped = meds.filter(m=>{
    const key = m.name.trim().toLowerCase()+'|'+(m.horarios||[]).map(h=>h.time).join(',');

})();

function ageText(){
  if(!settings.birthdate) return '';
  const b = new Date(settings.birthdate+'T00:00:00');
  const now = new Date();
  let years = now.getFullYear()-b.getFullYear();
  let months = now.getMonth()-b.getMonth();
  if(now.getDate()<b.getDate()) months--;
  if(months<0){ years--; months+=12; }
  if(years<1) return `${months} ${months===1?'mês':'meses'}`;
  if(years<2 && months>0) return `${years} ano e ${months} ${months===1?'mês':'meses'}`;
  return `${years} ${years===1?'ano':'anos'}`;
}

    (horario===undefined || (e.horarioSlot||'')===horario));
}

// Cada remédio ativo num dia (contínuo/pontual) vira 1 "slot" por horário
// cadastrado, já que agora um remédio pode ter vários horários no dia. Usada
// tanto pro checklist de hoje quanto pra reconstruir o que era esperado num
// dia passado (ver pastMedGroupHtml).
function pendingSlotsForDate(dateStr){
  const active = meds.filter(m=> isMedActiveOnDate(m, dateStr));
  const slots = [];
  for(const m of active){
    const horarios = (m.horarios && m.horarios.length>0) ? m.horarios : [{time:'', dose:m.dose||''}];
    for(const h of horarios) slots.push({ med:m, horario:h.time, dose:h.dose });
  }
  return slots;
}
function pendingSlotsForToday(){ return pendingSlotsForDate(todayStr()); }

function onDemandMeds(){
  return meds.filter(m=> m.tipo==='sob-demanda');
}

// Agrupamento de remédios pra dias que não são hoje: reconstrói o que era
// esperado naquele dia (a partir do cadastro atual dos remédios, igual ao
// checklist de hoje) e cruza com o que foi de fato lançado. Slot com
// lançamento correspondente = check verde; slot sem lançamento = check
// vazio, mas tocável, pra marcar retroativamente. Lançamentos que não batem
// com nenhum slot esperado (remédio já apagado do cadastro, etc.) continuam
// aparecendo soltos, como sempre apareceram, só que sem like de "esperado".
function pastMedGroupHtml(dayKey, dateStr, remedioEntries, searchQuery){
  const slots = pendingSlotsForDate(dateStr);
  if(slots.length===0 && remedioEntries.length===0) return '';
  const q = normalizeSearch(searchQuery||'');
  const matchesSearch = q!=='' && (slots.some(s=> normalizeSearch(s.med.name).includes(q)) || remedioEntries.some(e=> normalizeSearch(e.title).includes(q)));
  const isOpen = matchesSearch || expandedMedGroups.has(dayKey);

  const usedEntryIds = new Set();
  const slotRows = slots.map(s=>{
    const sameMed = e=> (e.medId && e.medId===s.med.id) || (!e.medId && e.title && normalizeSearch(e.title)===normalizeSearch(s.med.name));
    // Lançamentos antigos, de antes de cada dose guardar seu próprio horário,
    // não têm horarioSlot salvo. Pra esses, casa pelo horário real do
    // timestamp em vez do campo (que não existe) — resolve o remédio certo
    // sem depender de um campo que não existia na época.
    let match = remedioEntries.find(e=> !usedEntryIds.has(e.id) && sameMed(e) && (e.horarioSlot||'')===(s.horario||''));
    if(!match && s.horario){
      match = remedioEntries.find(e=> !usedEntryIds.has(e.id) && sameMed(e) && !e.horarioSlot && fmtTime(e.date)===s.horario);
    }
    if(match) usedEntryIds.add(match.id);
    return { med:s.med, horario:s.horario, dose:s.dose, entry:match||null };
  });
  const adHoc = remedioEntries.filter(e=> !usedEntryIds.has(e.id));

  const givenCount = slotRows.filter(r=>r.entry).length + adHoc.length;
  const totalCount = slotRows.length + adHoc.length;
  if(totalCount===0) return '';

  const header = `<button class="entry-row" data-medgroup-toggle="${esc(dayKey)}" style="${isOpen?'border-bottom:none; padding-bottom:6px':''}">
    <div class="entry-top">
      <div class="entry-title"><span style="color:${CATEGORIES.remedio.hex}; display:flex">${icon('pill',13,CATEGORIES.remedio.hex)}</span><span>Remédios</span></div>
      <span style="display:flex; align-items:center; gap:4px; color:var(--ink-muted); font-size:.72rem; font-weight:600">${givenCount}/${totalCount}${icon(isOpen?'chevronUp':'chevronDown',14,'var(--ink-muted)')}</span>
    </div>
  </button>`;
  if(!isOpen) return header;

  const slotRowsHtml = slotRows.map(r=>{
    const m = r.med;
    const given = !!r.entry;
    const sub = `${m.tipo==='continuo'?'Contínuo':'Até '+fmtDateShort(m.dataFim)}${r.horario?' · '+r.horario:''}${(given?r.entry.note:r.dose)?' · '+esc(given?r.entry.note:r.dose):''}`;
    const inner = `<button data-med-edit="${m.id}" style="flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font-family:inherit; cursor:pointer; color:inherit">
        <div class="entry-title"><span style="color:${CATEGORIES.remedio.hex}; display:flex">${icon('pill',13,CATEGORIES.remedio.hex)}</span><span>${esc(m.name)}</span></div>
        <div class="entry-sub">${sub}</div>
      </button>
      <button data-med="${m.id}" data-horario="${esc(r.horario)}" data-med-date="${esc(dateStr)}" aria-label="${given?'Dado, toque pra desfazer':'Marcar como dado'}" style="background:none; border:none; padding:6px; margin:0 -6px 0 0; cursor:pointer; flex-shrink:0">
        <span class="pending-checkbox" style="${given?`background:${CATEGORIES.remedio.hex}; border-color:${CATEGORIES.remedio.hex}`:''}">${given?icon('check',11,'#fff'):''}</span>
      </button>`;
    return { sortKey: r.horario||'99:99', inner };
  });

  const adHocRowsHtml = adHoc.map(e=>{
    const sub = [fmtTime(e.date), e.note].filter(Boolean).join(' · ');
    const inner = `<button data-id="${e.id}" style="flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font-family:inherit; cursor:pointer; color:inherit">
        <div class="entry-title"><span style="color:${CATEGORIES.remedio.hex}; display:flex">${icon('pill',13,CATEGORIES.remedio.hex)}</span><span>${esc(e.title)}</span></div>
        <div class="entry-sub">${sub}</div>
      </button>
      <span class="pending-checkbox" style="background:${CATEGORIES.remedio.hex}; border-color:${CATEGORIES.remedio.hex}; flex-shrink:0">${icon('check',11,'#fff')}</span>`;
    return { sortKey: fmtTime(e.date), inner };
  });

  const allRows = [...slotRowsHtml, ...adHocRowsHtml].sort((a,b)=> a.sortKey.localeCompare(b.sortKey));
  const rows = allRows.map((row, idx)=> `<div class="entry-row" style="display:flex; align-items:center; gap:8px; cursor:default; padding:10px 0; ${idx===allRows.length-1?'border-bottom:none':'border-bottom:1px solid rgba(0,0,0,.04)'}">${row.inner}</div>`).join('');

  return `${header}<div style="background:${CATEGORIES.remedio.hex}0F; border-radius:12px; padding:0 10px; margin-bottom:8px">${rows}</div>`;
}

  const givenCount = sortedSlots.filter(s=> dosesGivenToday(s.med, s.horario).length>0).length + adHocEntries.length;

    const inner = `<button data-med-edit="${m.id}" style="flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font-family:inherit; cursor:pointer; color:inherit">
        <div class="entry-title"><span style="color:${CATEGORIES.remedio.hex}; display:flex">${icon('pill',13,CATEGORIES.remedio.hex)}</span><span>${esc(m.name)}</span></div>
        <div class="entry-sub">${sub}</div>
      </button>
      <button data-med="${m.id}" data-horario="${esc(s.horario)}" aria-label="${given?'Dado hoje, toque pra desfazer':'Marcar como dado'}" style="background:none; border:none; padding:6px; margin:0 -6px 0 0; cursor:pointer; flex-shrink:0">
        <span class="pending-checkbox" style="${given?`background:${CATEGORIES.remedio.hex}; border-color:${CATEGORIES.remedio.hex}`:''}">${given?icon('check',11,'#fff'):''}</span>
      </button>`;
    return { sortKey: s.horario||'99:99', inner };
  });

  const adHocRows = adHocEntries.map(e=>{
    const sub = [fmtTime(e.date), e.note].filter(Boolean).join(' · ');
    const inner = `<button data-id="${e.id}" style="flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font-family:inherit; cursor:pointer; color:inherit">
        <div class="entry-title"><span style="color:${CATEGORIES.remedio.hex}; display:flex">${icon('pill',13,CATEGORIES.remedio.hex)}</span><span>${esc(e.title)}</span></div>
        <div class="entry-sub">${sub}</div>
      </button>
      <span class="pending-checkbox" style="background:${CATEGORIES.remedio.hex}; border-color:${CATEGORIES.remedio.hex}; flex-shrink:0">${icon('check',11,'#fff')}</span>`;
    return { sortKey: fmtTime(e.date), inner };
  });

  const allRows = [...medRows, ...adHocRows].sort((a,b)=> a.sortKey.localeCompare(b.sortKey));
  const rows = allRows.map((row, idx)=> `<div class="entry-row" style="display:flex; align-items:center; gap:8px; cursor:default; padding:10px 0; ${idx===allRows.length-1?'border-bottom:none':'border-bottom:1px solid rgba(0,0,0,.04)'}">${row.inner}</div>`).join('');

  return `${header}<div style="background:${CATEGORIES.remedio.hex}0F; border-radius:12px; padding:0 10px; margin-bottom:8px">${rows}</div>`;
}

let medToggleLock = false;
// dateStr é o dia (YYYY-MM-DD) em que a dose deve ser lançada — 'hoje' quando
// vem do checklist do dia corrente, ou o dia específico quando vem do
// checklist de um dia passado (marcação retroativa).
function toggleMedOnDate(medId, horario, dateStr, explicitTime){
  if(medToggleLock) return;
  medToggleLock = true;
  setTimeout(()=>{ medToggleLock = false; }, 500);
  const med = meds.find(m=>m.id===medId);
  if(!med) return;
  const t = dateStr || todayStr();
  const givenOnDate = dosesGivenOnDate(med, horario, t);
  if(givenOnDate.length > 0){
    // undo: remove o(s) lançamento(s) daquele dia pra esse remedio+horario
    const idsToRemove = new Set(givenOnDate.map(e=>e.id));
    entries = entries.filter(e=> !idsToRemove.has(e.id));
  } else {
    const [y,mo,da] = t.split('-').map(Number);
    let date = new Date(y, mo-1, da);
    const slot = (med.horarios||[]).find(h=> h.time===horario);
    const dose = slot ? slot.dose : med.dose;
    if(horario){ const [h,m2] = horario.split(':').map(Number); date.setHours(h,m2,0,0); }
    else if(explicitTime){ const [h,m2] = explicitTime.split(':').map(Number); date.setHours(h,m2,0,0); }
    else if(t===todayStr()){ const now = new Date(); date.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0); }
    else { date.setHours(12,0,0,0); }
    entries.push({ id:genId(), category:'remedio', medId:med.id, horarioSlot:horario||'', title:med.name, note:dose||'', date:date.toISOString(), createdAt:Date.now() });
  }
  entries.sort((a,b)=> new Date(b.date)-new Date(a.date));
  persistEntries();
  renderAll();
}
function toggleMedToday(medId, horario){ toggleMedOnDate(medId, horario, todayStr()); }

// ---------- render: timeline ----------
function entrySubtitle(e){
  if(e.category==='alimentacao'){
    const parts=[]; if(e.comoComeu) parts.push(COMO_COMEU_MAP[e.comoComeu]); if(e.quantidade) parts.push(e.quantidade); if(e.note) parts.push(e.note);
    return parts.join(' · ');
  }
  if(e.category==='consulta' && e.clinica) return e.clinica + (e.note? ' · '+e.note : '');
  if(e.category==='peso') return `${e.value} kg` + (e.note? ' · '+e.note : '');
  return e.note || '';
}

function entryRowHtml(e){
  const cat = CATEGORIES[e.category];
  let badge='';
  if(e.category==='intercorrencia' && e.gravidade){
    const bg = e.gravidade==='Grave'?'#A8473A20':e.gravidade==='Moderada'?'#D9A44120':'#8A837820';
    const fg = e.gravidade==='Grave'?'#A8473A':e.gravidade==='Moderada'?'#B5842E':'var(--ink-muted)';
    badge = `<span class="badge" style="background:${bg}; color:${fg}; flex-shrink:0">${e.gravidade}</span>`;
  }
  const sub = entrySubtitle(e);
  return `<button class="entry-row" data-id="${e.id}">
    <div class="entry-top">
      <div class="entry-title"><span style="color:${cat.hex}; display:flex">${icon(cat.icon,13,cat.hex)}</span><span style="flex:1; min-width:0">${esc(e.title)}</span>${badge}</div>
      ${e.category!=='creche' ? `<span class="entry-time">${fmtTime(e.date)}</span>` : ''}
    </div>
    ${sub?`<div class="entry-sub">${esc(sub)}</div>`:''}
  </button>`;
}

const normalizeSearch = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const sortMedsByName = (a,b)=> normalizeSearch(a.name).localeCompare(normalizeSearch(b.name), 'pt');

function renderTimeline(){
  let list = entries.slice();
  if(filter!=='todos') list = list.filter(e=>e.category===filter);
  const isSearching = !!search.trim();
  if(isSearching){
    const q = normalizeSearch(search);
    list = list.filter(e => normalizeSearch(e.title).includes(q) || normalizeSearch(e.note).includes(q) || normalizeSearch(e.clinica).includes(q) || normalizeSearch(e.quantidade).includes(q));
  }
  list.sort((a,b)=> new Date(b.date)-new Date(a.date));

  const host = document.getElementById('timeline');

  let html=''; const months=[];
  for(const e of list){
    const mk = fmtMonthYear(e.date); const dk = new Date(e.date).toDateString();
    if(!months.length || months[months.length-1].key!==mk){ months.push({key:mk, days:[]}); }
    const curMonth = months[months.length-1];
    if(!curMonth.days.length || curMonth.days[curMonth.days.length-1].key!==dk){ curMonth.days.push({key:dk, items:[]}); }
    curMonth.days[curMonth.days.length-1].items.push(e);
  }

  // Only show the today's meds checklist when it's meaningful: no filter narrowing to something unrelated, no active search.
  const showPending = (filter==='todos' || filter==='remedio') && !search.trim();
  const activeSlotsToday = showPending ? pendingSlotsForToday() : [];
  const activeMedNamesToday = new Set(activeSlotsToday.map(s=>normalizeSearch(s.med.name)));
  const activeSlotKeys = new Set(activeSlotsToday.map(s=> s.med.id+'|'+(s.horario||'')));
  const activeSlotKeysByName = new Set(activeSlotsToday.map(s=> normalizeSearch(s.med.name)+'|'+(s.horario||'')));
  const todayKey = new Date().toDateString();
  const todayMonthKey = fmtMonthYear(new Date().toISOString());

  let adHocMedEntriesToday = [];
  if(showPending){
    // Registry-linked remedio doses logged today are already represented (checked) in the
    // stable checklist above — remove them here so they don't also show a second time below.
    // Doses avulsas (sob demanda / medId sem correspondência) também são puxadas pro checklist
    // em vez de aparecerem soltas na lista principal do dia.
    // Importante: o "match" precisa ser por remédio+horário, não só remédio — senão, se você
    // editar o horário de um remédio depois de já ter dado a dose de hoje, esse registro antigo
    // fica preso (não bate mais com nenhum horário atual) e simplesmente some da tela.
    // Também casa por NOME+horário além de por id — assim, um lançamento antigo com o id
    // quebrado (de antes de uma fusão de remédios duplicados) ainda é reconhecido como "o
    // mesmo remédio" e não aparece feito uma cópia solta.
    const todayDate = todayStr();
    for(const month of months){
      if(month.key!==todayMonthKey) continue;
      for(const day of month.days){
        if(day.key!==todayKey) continue;
        day.items = day.items.filter(e=> {
          if(e.category!=='remedio' || !isSameDay(e.date, todayDate)) return true;
          const matchesById = e.medId && activeSlotKeys.has(e.medId+'|'+(e.horarioSlot||''));
          const matchesByName = e.title && activeSlotKeysByName.has(normalizeSearch(e.title)+'|'+(e.horarioSlot||''));
          // Lançamentos bem antigos, de antes do horário ser salvo por dose,
          // não têm horarioSlot — casa só pelo nome nesse caso, pra não
          // aparecerem soltos feito cópia.
          const matchesByNameNoSlot = !e.horarioSlot && e.title && activeMedNamesToday.has(normalizeSearch(e.title));
          if(matchesById || matchesByName || matchesByNameNoSlot) return false;
          adHocMedEntriesToday.push(e);
          return false;
        });
      }
    }
  }

  if(activeSlotsToday.length > 0 || adHocMedEntriesToday.length > 0){
    let curMonth = months.find(m=> m.key===todayMonthKey);
    if(!curMonth){ curMonth = {key:todayMonthKey, days:[]}; months.unshift(curMonth); }
    let todayDay = curMonth.days.find(d=> d.key===todayKey);
    if(!todayDay){ todayDay = {key:todayKey, items:[]}; curMonth.days.unshift(todayDay); }
  }

  if(months.length===0){
    host.innerHTML = `<div class="empty-state">${icon('paw',28,'currentColor')}<div style="font-size:.85rem; margin-top:8px">${entries.length===0? 'Nenhum registro ainda. Toque numa categoria acima pra começar.' : 'Nada encontrado com esse filtro.'}</div></div>`;
    return;
  }

  for(const month of months){
    const isCollapsed = collapsedMonths.has(month.key);
    html += `<button class="month-label" data-month="${esc(month.key)}" style="display:flex; align-items:center; justify-content:flex-start; gap:6px; width:100%; background:none; border:none; cursor:pointer; font-family:inherit; padding:0">
      <span>${month.key}</span>${icon(isCollapsed?'chevronDown':'chevronUp',13,'var(--ink-muted)')}
    </button>`;
    if(isCollapsed) continue;

    let squaresHtml = '', cardsHtml = '';
    for(const day of month.days){
      const isToday = day.key===todayKey;
      const refDate = day.items[0] ? day.items[0].date : new Date().toISOString();

      let pendingHtml = '';
      if(isToday){
        pendingHtml = pendingRowsHtml(activeSlotsToday, adHocMedEntriesToday);
      } else {
        day.items = day.items.filter(e=> e.category!=='remedio');
        const dayDateStr = toLocalDateStr(new Date(day.key));
        // Sempre usa os lançamentos completos (entries, não list) pra decidir
        // o que foi dado, independente do texto buscado — a busca não pode
        // fazer remédio já dado parecer que não foi.
        const dayRemedioEntries = entries.filter(e=> e.category==='remedio' && new Date(e.date).toDateString()===day.key);
        pendingHtml = pastMedGroupHtml(day.key, dayDateStr, dayRemedioEntries, search);
      }
      if(day.items.length===0 && !pendingHtml) continue;
      const dayNum = fmtDay(refDate);
      const weekday = fmtWeekdayShort(refDate);
      const isExpanded = isSearching ? true : expandedDays.has(day.key);

      squaresHtml += `<button class="day-square${isExpanded?' active':''}" data-daysquare="${esc(day.key)}">
        <div class="ds-n">${dayNum}</div>
        <div class="ds-w">${weekday}</div>
      </button>`;

      // Cada dia sempre existe no DOM, só escondido/mostrado via display — nunca
      // recriado. Isso evita reconstruir a timeline inteira a cada toque, o que
      // era a causa do salto de rolagem.
      cardsHtml += `<div class="day-card" data-daycard="${esc(day.key)}" style="${isExpanded?'':'display:none'}"><div class="day-num"><div class="n">${dayNum}</div></div><div class="day-sep"></div><div class="entries-col">`;
      cardsHtml += pendingHtml;
      const sortedItems = day.items.slice().sort((a,b)=>{
        if(a.category==='creche' && b.category!=='creche') return -1;
        if(b.category==='creche' && a.category!=='creche') return 1;
        return new Date(a.date) - new Date(b.date);
      });
      cardsHtml += sortedItems.map(entryRowHtml).join('');
      cardsHtml += `</div></div>`;
    }
    if(squaresHtml){
      html += `<div class="day-squares-row">${squaresHtml}</div>`;
      html += cardsHtml;
    }
  }
  host.innerHTML = html;
  host.querySelectorAll('[data-id]').forEach(b=> b.addEventListener('click', ()=> openEntryModal(null, b.dataset.id)));
  host.querySelectorAll('[data-med]').forEach(b=> b.addEventListener('click', ()=> toggleMedOnDate(b.dataset.med, b.dataset.horario, b.dataset.medDate || todayStr())));
  host.querySelectorAll('[data-med-edit]').forEach(b=> b.addEventListener('click', ()=> openMedManager(()=> renderAll(), b.dataset.medEdit)));
  host.querySelectorAll('[data-daysquare]').forEach(b=> b.addEventListener('click', ()=>{
    const key = b.dataset.daysquare;
    const card = host.querySelector(`[data-daycard="${CSS.escape(key)}"]`);
    const nowExpanded = !expandedDays.has(key);
    const prevHeight = document.documentElement.scrollHeight;
    const prevScrollY = window.scrollY;

    if(nowExpanded) expandedDays.add(key); else expandedDays.delete(key);
    b.classList.toggle('active', nowExpanded);
    if(card) card.style.display = nowExpanded ? '' : 'none';

    // Testa a causa real do pulo, direto: a pagina ficou mais curta do que a
    // posicao em que voce estava rolada? Se sim, o navegador vai te empurrar
    // pra cima a forca pra caber — isso acontece tanto em paginas longas
    // quanto curtas, entao nao depende de filtro ou quantidade de conteudo.
    const newHeight = document.documentElement.scrollHeight;
    const newMaxScroll = Math.max(0, newHeight - window.innerHeight);
    if(prevScrollY > newMaxScroll){
      const target = Math.max(0, prevScrollY + (newHeight - prevHeight));
      let frames = 0;
      (function enforce(){
        window.scrollTo(0, target);
        frames++;
        if(frames < 18) requestAnimationFrame(enforce);
      })();
    }
  }));
  const medsToggle = document.getElementById('medsSummaryToggle');
  if(medsToggle) medsToggle.addEventListener('click', ()=>{ medsExpanded = !medsExpanded; renderTimeline(); });
  host.querySelectorAll('[data-medgroup-toggle]').forEach(b=> b.addEventListener('click', ()=>{
    const key = b.dataset.medgroupToggle;
    if(expandedMedGroups.has(key)) expandedMedGroups.delete(key); else expandedMedGroups.add(key);
    renderTimeline();
  }));
  host.querySelectorAll('[data-month]').forEach(b=> b.addEventListener('click', ()=>{
    const key = b.dataset.month;
    if(collapsedMonths.has(key)) collapsedMonths.delete(key); else collapsedMonths.add(key);
    persistCollapsedMonths();
    renderTimeline();
  }));
}

function showSuccess(msg){
  document.getElementById('warningHost').innerHTML = `<div class="warning-fixed"><div class="warning-banner" style="background:#E5F3EC; border-color:#B9DDC8; color:#2C6B47">${icon('check',15,'#2C6B47')}<div style="flex:1">${esc(msg)}</div><button id="warnClose">${icon('x',14,'#2C6B47')}</button></div></div>`;
  document.getElementById('warnClose').addEventListener('click', ()=> document.getElementById('warningHost').innerHTML='');
}

function blobToDataUrl(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function exportBackup(silent){
  try{
    const photoIds = new Set();
    entries.forEach(e=>{ if(e.photoId) photoIds.add(e.photoId); });
    if(settings.profilePhotoId) photoIds.add(settings.profilePhotoId);
    const photos = {};
    for(const id of photoIds){
      try{
        const blob = await idbGetPhoto(id);
        if(blob) photos[id] = await blobToDataUrl(blob);
      }catch(e){ console.error('Erro exportando foto', id, e); }
    }
    const data = { app:'diario-otto', version:1, exportedAt:new Date().toISOString(), entries, foods, meds, chips, settings, photos };
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `diario-otto-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    settings.lastAutoBackupAt = new Date().toISOString();
    persistSettings();
    hideBackupBanner();
    if(!silent) showSuccess('Backup exportado.');
    return true;
  }catch(err){
    console.error('Erro ao exportar', err);
    if(!silent) showWarning('Não consegui gerar o backup. Tenta de novo.');
    return false;
  }
}

// Backup: em vez de baixar sozinho (o que forçaria a caixa "Deseja baixar?"
// do Safari aparecer sem o usuário pedir), mostramos um aviso discreto
// quando já faz 12h+ desde o último backup, com um botão. O download só
// dispara quando a pessoa toca — mas essa caixa do Safari ainda aparece
// nesse momento, isso é do sistema e não dá pra evitar.
const AUTO_BACKUP_INTERVAL_MS = 12*60*60*1000; // 12h
let backupBannerLastShownAt = store.get('otto:backupBannerLastShownAt', 0);
function hideBackupBanner(){
  const el = document.getElementById('backupBannerHost');
  if(el) el.innerHTML = '';
}
function checkBackupBanner(){
  const last = settings.lastAutoBackupAt ? new Date(settings.lastAutoBackupAt).getTime() : 0;
  if(Date.now() - last < AUTO_BACKUP_INTERVAL_MS) return;
  if(Date.now() - backupBannerLastShownAt < 24*60*60*1000) return; // no máximo 1x por dia
  const host = document.getElementById('backupBannerHost');
  if(!host) return;
  backupBannerLastShownAt = Date.now();
  writeStore('otto:backupBannerLastShownAt', backupBannerLastShownAt);
  host.innerHTML = `<div class="warning-fixed" style="top:calc(64px + env(safe-area-inset-top))"><div class="warning-banner" style="background:#EEF0F5; border-color:#D6DAE6; color:#3D4250; align-items:center">
    <div style="flex:1">Faz um tempo que não tem backup. Quer fazer agora?</div>
    <button id="backupNowBtn" style="background:var(--ink); color:#fff; border-radius:8px; padding:5px 10px; font-size:.72rem; font-weight:600; flex-shrink:0">Fazer backup</button>
    <button id="backupDismissBtn" style="flex-shrink:0">${icon('x',14,'#3D4250')}</button>
  </div></div>`;
  document.getElementById('backupNowBtn').addEventListener('click', ()=> exportBackup(false));
  document.getElementById('backupDismissBtn').addEventListener('click', hideBackupBanner);
}

async function importBackup(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || data.app!=='diario-otto' || !Array.isArray(data.entries)) throw new Error('formato inválido');

    entries = data.entries || [];
    foods = data.foods || [];
    meds = data.meds || [];
    chips = {
      intercorrencia: (data.chips && data.chips.intercorrencia) || [],
      consulta: (data.chips && data.chips.consulta) || [],
      clinica: (data.chips && data.chips.clinica) || [],
      procedimento: (data.chips && data.chips.procedimento) || [],
      quantidade: (data.chips && data.chips.quantidade) || []
    };
    settings = data.settings || {sheetLink:''};

    writeStore('otto:entries', entries);
    writeStore('otto:foods', foods);
    writeStore('otto:meds', meds);
    writeStore('otto:intercorrencia-chips', chips.intercorrencia);
    writeStore('otto:consulta-chips', chips.consulta);
    writeStore('otto:clinica-chips', chips.clinica);
    writeStore('otto:procedimento-chips', chips.procedimento);
    writeStore('otto:quantidade-chips', chips.quantidade);
    writeStore('otto:settings', settings);

    if(data.photos){
      for(const id in data.photos){
        try{
          const blob = await (await fetch(data.photos[id])).blob();
          await idbPutPhoto(id, blob);
        }catch(e){ console.error('Erro importando foto', id, e); }
      }
    }

    closeModal();
    await loadProfilePhoto();
    renderAll();
    renderFilters();
    showSuccess('Backup importado com sucesso.');
  }catch(err){
    console.error('Erro ao importar', err);
    showWarning('Não consegui importar esse arquivo. Confira se é um backup válido do Diário do Otto.');
  }
}

function pesoChartHtml(){
  const pesoEntries = entries.filter(e=>e.category==='peso').slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(pesoEntries.length<2) return '';
  const vals = pesoEntries.map(e=>e.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const w=400,h=160,sidePad=14,topPad=20,bottomPad=22;
  const pts = pesoEntries.map((e,i)=>{
    const x = sidePad + (i/(pesoEntries.length-1||1))*(w-2*sidePad);
    const y = topPad + (h-topPad-bottomPad) - ((e.value-min)/range)*(h-topPad-bottomPad);
    const d = new Date(e.date);
    return [x,y,e.value,`${pad(d.getDate())}/${pad(d.getMonth()+1)}`];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${CATEGORIES.peso.hex}"/>`).join('');
  const valueLabels = pts.map(p=>`<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--ink-muted)">${p[2]}</text>`).join('');
  const dateLabels = pts.map(p=>`<text x="${p[0].toFixed(1)}" y="${(p[1]+16).toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--ink-muted)">${p[3]}</text>`).join('');
  return `<div class="field"><label>Evolução do peso</label><div class="chart-wrap"><svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="${CATEGORIES.peso.hex}" stroke-width="2"/>${dots}${valueLabels}${dateLabels}</svg></div></div>`;
}

  function suggestChips(kind, val){
    const q = normalizeSearch(val);
    const list = chips[kind].filter(c=> !q || (normalizeSearch(c).includes(q) && normalizeSearch(c)!==q));
    return list.map(c=>`<button type="button" class="pick-btn" data-sugg="${kind}" data-val="${esc(c)}">${esc(c)}</button>`).join('');

    const v = document.getElementById('f_value'); if(v) v.addEventListener('input', e=>{ form.value=e.target.value; toggleSave(); });
    const cl = document.getElementById('f_clinica'); if(cl) cl.addEventListener('input', e=>{ form.clinica=e.target.value; syncSuggestions(); });
    const q = document.getElementById('f_quantidade'); if(q) q.addEventListener('input', e=> form.quantidade=e.target.value);
    const nt = document.getElementById('f_note'); if(nt) nt.addEventListener('input', e=> form.note=e.target.value);
    wireDtField('f_dateD', v=> form.dateD=v);
    wireDtField('f_dateT', v=> form.dateT=v);

    const foodPick = document.getElementById('foodPick');
    if(foodPick) foodPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; refreshBody(); }));

  }
  function toggleSave(){ const b=document.getElementById('btnSaveEntry'); if(b) b.disabled = !canSave(); }

  function wirePhoto(){
    const addBtn = document.getElementById('addPhotoBtn');
    const input = document.getElementById('photoInput');
    const removeBtn = document.getElementById('removePhoto');
    const thumb = document.getElementById('photoThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const blob = await resizeImageFile(file);
        form.photoBlob = blob;
        form.photo = URL.createObjectURL(blob);
        form.removedPhoto = false;
      }catch(err){
        console.error('Erro ao processar foto', err);
        showWarning('Não consegui processar essa foto. Tenta outra.');
      }
      refreshBody();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{
      form.photo=''; form.photoBlob=null; form.removedPhoto = true;
      refreshBody();
    });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(form.photo));
    wireAnexo();
  }

  function wireAnexo(){
    const addBtn = document.getElementById('addAnexoBtn');
    const input = document.getElementById('anexoInput');
    const removeBtn = document.getElementById('removeAnexo');
    const thumb = document.getElementById('anexoThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        if(file.type && file.type.startsWith('image/')){
          form.anexoBlob = await resizeImageFile(file);
        } else {
          form.anexoBlob = file;
        }
        form.anexoUrl = URL.createObjectURL(form.anexoBlob);
        form.anexoName = file.name;
        form.anexoType = file.type;
        form.removedAnexo = false;
      }catch(err){
        console.error('Erro ao processar anexo', err);
        showWarning('Não consegui processar esse arquivo. Tenta outro.');
      }
      refreshBody();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{
      form.anexoUrl=''; form.anexoBlob=null; form.anexoName=''; form.anexoType=''; form.removedAnexo = true;
      refreshBody();
    });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(form.anexoUrl));
  }
  function refreshBody(){ document.getElementById('bodyEntry').innerHTML = fieldsHtml(); wireBodyOnly(); toggleSave(); }

    const openFM = document.getElementById('openFoodMgr'); if(openFM) openFM.addEventListener('click', ()=> openFoodManager(()=>{ refreshBody(); }));
    const medPick = document.getElementById('medPick'); if(medPick) medPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; if(!form.note && b.dataset.dose) form.note=b.dataset.dose; if(!editing && b.dataset.horario) form.dateT=b.dataset.horario; refreshBody(); }));
    if(quickPick){
      document.querySelectorAll('[data-quicklog]').forEach(b=> b.addEventListener('click', ()=>{
        const m = meds.find(x=>x.id===b.dataset.quicklog);
        if(!m) return;
        medQuickTimePick = m.id;
        const now = new Date();
        medQuickTimeVal = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        refreshBody();
      }));
      document.querySelectorAll('[data-quicklogtime]').forEach(b=> b.addEventListener('click', ()=>{

        toggleMedOnDate(medId, '', todayStr(), medQuickTimeVal);

      const toggleConcludedBtn2 = document.getElementById('toggleConcluded');

    const comoList = document.getElementById('comoList'); if(comoList) comoList.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.comoComeu = form.comoComeu===b.dataset.v ? '' : b.dataset.v; refreshBody(); }));

  function requestClose(){
    const hasText = form.title.trim()!=='' || form.note.trim()!=='' || form.value!=='';
    if(!editing && hasText){
