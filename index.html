    if(category==='procedimento'){
      h += `<div class="field"><label>Procedimento</label><input id="f_title" value="${esc(form.title)}" placeholder="ex: Vacina V10, Cirurgia..."/>
      </div>`;
    }
    if(category==='exame'){
      h += `<div class="field"><label>Tipo de exame</label><input id="f_tipoExame" value="${esc(form.tipoExame)}" placeholder="ex: Sangue, Imagem, Urina..."/></div>
      ${settings.sheetLink ? `<a href="${esc(settings.sheetLink)}" target="_blank" rel="noreferrer" class="link-btn" style="color:${cat.hex}; margin-bottom:14px; display:inline-flex; align-items:center; gap:5px">${icon('external',13,cat.hex)} Ver planilha de exames</a>` : ''}`;
    }
    if(quickPick){
      return h;
    }
    h += `<div class="field"><label>Data e hora</label><div class="row2">
        <div style="flex:1.3">${dtField('f_dateD','date',form.dateD)}</div>
        <div style="flex:1">${dtField('f_dateT','time',form.dateT)}</div>
      </div></div>
      <div class="field"><label>${category==='exame'?'Observação (ex: resultado, ver planilha)':'Observação (opcional)'}</label><textarea id="f_note">${esc(form.note)}</textarea></div>`;
    return h;
  }

  function suggestChips(kind, val){
    const q = (val||'').trim().toLowerCase();
    const list = chips[kind].filter(c=> !q || (c.toLowerCase().includes(q) && c.toLowerCase()!==q));
    return list.map(c=>`<button type="button" class="pick-btn" data-sugg="${kind}" data-val="${esc(c)}">${esc(c)}</button>`).join('');
  }

  function render(){
    host.innerHTML = `<div class="overlay" id="ovEntry">
      <div class="sheet" id="sheetEntry">
        <div class="sheet-head">
          <div class="sheet-title" style="color:${cat.hex}">${icon(cat.icon,17,cat.hex)}<span style="color:var(--ink)">${quickPick? 'Remédios atuais' : `${editing?'Editar':'Novo'} · ${cat.label}`}</span></div>
          <div style="display:flex; gap:6px">
            ${editing? `<button class="icon-btn danger" id="btnDelEntry">${icon('trash',17,'#A8473A')}</button>` : ''}
            <button class="icon-btn" id="btnCloseEntry">${icon('x',18)}</button>
          </div>
        </div>
        <div class="sheet-body" id="bodyEntry">${fieldsHtml()}</div>
        ${quickPick ? '' : `<div class="sheet-foot" id="footEntry">
          <button class="btn-secondary" id="btnCancelEntry">Cancelar</button>
          <button class="btn-primary" id="btnSaveEntry" ${canSave()?'':'disabled'}>${editing?'Salvar alterações':'Registrar'}</button>
        </div>`}
      </div>
    </div>`;
    wire();
  }

  function wire(){
    document.getElementById('ovEntry').addEventListener('click', (ev)=>{ if(ev.target.id==='ovEntry') requestClose(); });
    document.getElementById('btnCloseEntry').addEventListener('click', requestClose);
    const cancelBtn = document.getElementById('btnCancelEntry'); if(cancelBtn) cancelBtn.addEventListener('click', requestClose);
    if(editing){ const delBtn = document.getElementById('btnDelEntry'); if(delBtn) delBtn.addEventListener('click', ()=>{ closeModal(); openConfirmDelete(editing.id); }); }
    const saveBtn = document.getElementById('btnSaveEntry'); if(saveBtn) saveBtn.addEventListener('click', save);

    const t = document.getElementById('f_title'); if(t) t.addEventListener('input', e=>{ form.title=e.target.value; toggleSave(); });
    const v = document.getElementById('f_value'); if(v) v.addEventListener('input', e=>{ form.value=e.target.value; toggleSave(); });
    const cl = document.getElementById('f_clinica'); if(cl) cl.addEventListener('input', e=>{ form.clinica=e.target.value; syncSuggestions(); });
    const q = document.getElementById('f_quantidade'); if(q) q.addEventListener('input', e=> form.quantidade=e.target.value);
    const nt = document.getElementById('f_note'); if(nt) nt.addEventListener('input', e=> form.note=e.target.value);
    wireDtField('f_dateD', v=> form.dateD=v);
    wireDtField('f_dateT', v=> form.dateT=v);

    const foodPick = document.getElementById('foodPick');
    if(foodPick) foodPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; refreshBody(); }));
    const openFM = document.getElementById('openFoodMgr'); if(openFM) openFM.addEventListener('click', ()=> openFoodManager(()=>{ refreshBody(); }));

    const medPick = document.getElementById('medPick');
    if(medPick && !quickPick) medPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      form.title=b.dataset.name;
      if(!form.note && b.dataset.dose) form.note=b.dataset.dose;
      if(!editing && b.dataset.horario) form.dateT=b.dataset.horario;
      refreshBody();
    }));
    if(medPick && quickPick) medPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.dataset.id;
      closeModal();
      openMedManager(null, id);
    }));
    const openMM = document.getElementById('openMedMgr'); if(openMM) openMM.addEventListener('click', ()=> openMedManager(()=>{ refreshBody(); }));

    const comoList = document.getElementById('comoList');
    if(comoList) comoList.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.comoComeu = form.comoComeu===b.dataset.v ? '' : b.dataset.v; refreshBody(); }));

    const gravRow = document.querySelectorAll('[data-g]');
    gravRow.forEach(b=> b.addEventListener('click', ()=>{ form.gravidade = form.gravidade===b.dataset.g ? '' : b.dataset.g; refreshBody(); }));
    wirePhoto();

    const tipoExameInput = document.getElementById('f_tipoExame');
    if(tipoExameInput) tipoExameInput.addEventListener('input', e=> form.tipoExame=e.target.value);

    document.querySelectorAll('[data-sugg]').forEach(b=> b.addEventListener('click', ()=>{
      const kind=b.dataset.sugg, val=b.dataset.val;
      if(kind==='clinica') form.clinica=val;
      else if(kind==='quantidade') form.quantidade=val;
      else form.title=val;
      refreshBody();
    }));
  }

  function syncSuggestions(){
    // live re-render just the suggestion rows without losing focus on text inputs: simplest reliable approach is full refresh of body except focused field's caret;
    // acceptable tradeoff here given text fields are short.
  }
  function toggleSave(){ const b=document.getElementById('btnSaveEntry'); if(b) b.disabled = !canSave(); }

  function wirePhoto(){
    const addBtn = document.getElementById('addPhotoBtn');
    const input = document.getElementById('photoInput');
    const removeBtn = document.getElementById('removePhoto');
    const thumb = document.getElementById('photoThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const blob = await resizeImageFile(file);
        form.photoBlob = blob;
        form.photo = URL.createObjectURL(blob);
        form.removedPhoto = false;
      }catch(err){
        console.error('Erro ao processar foto', err);
        showWarning('Não consegui processar essa foto. Tenta outra.');
      }
      refreshBody();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{
      form.photo=''; form.photoBlob=null; form.removedPhoto = true;
      refreshBody();
    });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(form.photo));
    wireAnexo();
  }

  function wireAnexo(){
    const addBtn = document.getElementById('addAnexoBtn');
    const input = document.getElementById('anexoInput');
    const removeBtn = document.getElementById('removeAnexo');
    const thumb = document.getElementById('anexoThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        if(file.type && file.type.startsWith('image/')){
          form.anexoBlob = await resizeImageFile(file);
        } else {
          form.anexoBlob = file;
        }
        form.anexoUrl = URL.createObjectURL(form.anexoBlob);
        form.anexoName = file.name;
        form.anexoType = file.type;
        form.removedAnexo = false;
      }catch(err){
        console.error('Erro ao processar anexo', err);
        showWarning('Não consegui processar esse arquivo. Tenta outro.');
      }
      refreshBody();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{
      form.anexoUrl=''; form.anexoBlob=null; form.anexoName=''; form.anexoType=''; form.removedAnexo = true;
      refreshBody();
    });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(form.anexoUrl));
  }
  function refreshBody(){ document.getElementById('bodyEntry').innerHTML = fieldsHtml(); wireBodyOnly(); toggleSave(); }
  function wireBodyOnly(){
    const t = document.getElementById('f_title'); if(t) t.addEventListener('input', e=>{ form.title=e.target.value; toggleSave(); });
    const v = document.getElementById('f_value'); if(v) v.addEventListener('input', e=>{ form.value=e.target.value; toggleSave(); });
    const cl = document.getElementById('f_clinica'); if(cl) cl.addEventListener('input', e=>{ form.clinica=e.target.value; });
    const q = document.getElementById('f_quantidade'); if(q) q.addEventListener('input', e=> form.quantidade=e.target.value);
    const nt = document.getElementById('f_note'); if(nt) nt.addEventListener('input', e=> form.note=e.target.value);
    wireDtField('f_dateD', v=> form.dateD=v);
    wireDtField('f_dateT', v=> form.dateT=v);
    const foodPick = document.getElementById('foodPick'); if(foodPick) foodPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; refreshBody(); }));
    const openFM = document.getElementById('openFoodMgr'); if(openFM) openFM.addEventListener('click', ()=> openFoodManager(()=>{ refreshBody(); }));
    const medPick = document.getElementById('medPick'); if(medPick) medPick.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.title=b.dataset.name; if(!form.note && b.dataset.dose) form.note=b.dataset.dose; if(!editing && b.dataset.horario) form.dateT=b.dataset.horario; refreshBody(); }));
    const openMM = document.getElementById('openMedMgr'); if(openMM) openMM.addEventListener('click', ()=> openMedManager(()=>{ refreshBody(); }));
    const comoList = document.getElementById('comoList'); if(comoList) comoList.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ form.comoComeu = form.comoComeu===b.dataset.v ? '' : b.dataset.v; refreshBody(); }));
    document.querySelectorAll('[data-g]').forEach(b=> b.addEventListener('click', ()=>{ form.gravidade = form.gravidade===b.dataset.g ? '' : b.dataset.g; refreshBody(); }));
    wirePhoto();
    const tipoExameInput2 = document.getElementById('f_tipoExame'); if(tipoExameInput2) tipoExameInput2.addEventListener('input', e=> form.tipoExame=e.target.value);
    document.querySelectorAll('[data-sugg]').forEach(b=> b.addEventListener('click', ()=>{ const kind=b.dataset.sugg, val=b.dataset.val; if(kind==='clinica') form.clinica=val; else if(kind==='quantidade') form.quantidade=val; else form.title=val; refreshBody(); }));
  }

  function requestClose(){
    const hasText = form.title.trim()!=='' || form.note.trim()!=='' || form.value!=='';
    if(!editing && hasText){
      document.getElementById('footEntry').outerHTML = `<div class="confirm-box"><p>Descartar o que você preencheu?</p><div style="display:flex; gap:8px">
        <button class="btn-secondary" id="btnKeepEditing" style="flex:1">Continuar editando</button>
        <button class="btn-danger" id="btnDiscard">Descartar</button>
      </div></div>`;
      document.getElementById('btnKeepEditing').addEventListener('click', render);
      document.getElementById('btnDiscard').addEventListener('click', closeModal);
      const headerClose = document.getElementById('btnCloseEntry');
      if(headerClose) headerClose.disabled = true;
    } else closeModal();
  }

  async function save(){
    const dateIso = new Date(`${form.dateD}T${form.dateT}`).toISOString();
    let entry = { id: editing? editing.id : genId(), category, date: dateIso, note: form.note.trim(), createdAt: editing? editing.createdAt : Date.now() };
    if(category==='peso'){ entry.value = parseFloat(form.value); entry.title='Peso'; }
    else if(category==='exame'){ entry.title=form.tipoExame; entry.tipoExame=form.tipoExame; }
    else if(category==='intercorrencia'){
      entry.title=form.title.trim(); entry.gravidade=form.gravidade;
      if(form.photoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, form.photoBlob);
          entry.photoId = newId;
          if(editing && editing.photoId && editing.photoId!==newId) idbDeletePhoto(editing.photoId).catch(()=>{});
        }catch(err){
          console.error('Erro ao salvar foto', err);
          showWarning('Não consegui salvar a foto, mas o resto do registro foi salvo.');
        }
      } else if(form.photoId && !form.removedPhoto){
        entry.photoId = form.photoId;
      } else if(form.removedPhoto && editing && editing.photoId){
        idbDeletePhoto(editing.photoId).catch(()=>{});
      } else if(!form.removedPhoto && editing && editing.photo){
        entry.photo = editing.photo; // legacy entries saved before the IndexedDB migration
      }
    }
    else if(category==='consulta'){
      entry.title=form.title.trim(); entry.clinica=form.clinica.trim();
      if(form.anexoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, form.anexoBlob);
          entry.anexoId = newId; entry.anexoName = form.anexoName; entry.anexoType = form.anexoType;
          if(editing && editing.anexoId && editing.anexoId!==newId) idbDeletePhoto(editing.anexoId).catch(()=>{});
        }catch(err){
          console.error('Erro ao salvar anexo', err);
          showWarning('Não consegui salvar o anexo, mas o resto foi salvo.');
        }
      } else if(form.anexoId && !form.removedAnexo){
        entry.anexoId = form.anexoId; entry.anexoName = editing?.anexoName||''; entry.anexoType = editing?.anexoType||'';
      } else if(form.removedAnexo && editing && editing.anexoId){
        idbDeletePhoto(editing.anexoId).catch(()=>{});
      }
    }
    else if(category==='alimentacao'){ entry.title=form.title.trim(); entry.comoComeu=form.comoComeu; entry.quantidade=form.quantidade.trim(); }
    else entry.title=form.title.trim();

    if(editing) entries = entries.map(e=> e.id===editing.id? entry : e);
    else entries.push(entry);
    entries.sort((a,b)=> new Date(b.date)-new Date(a.date));
    const ok = persistEntries();
    if(!ok) showWarning('Não consegui salvar esse registro no armazenamento do navegador. Tente novamente.');

    if(category==='intercorrencia' && entry.title && !chips.intercorrencia.includes(entry.title)){ chips.intercorrencia.push(entry.title); persistChips('intercorrencia'); }
    if(category==='consulta'){
      if(entry.title && !chips.consulta.includes(entry.title)){ chips.consulta.push(entry.title); persistChips('consulta'); }
      if(entry.clinica && !chips.clinica.includes(entry.clinica)){ chips.clinica.push(entry.clinica); persistChips('clinica'); }
    }
    if(category==='procedimento' && entry.title && !chips.procedimento.includes(entry.title)){ chips.procedimento.push(entry.title); persistChips('procedimento'); }
    if(category==='alimentacao' && entry.quantidade && !chips.quantidade.includes(entry.quantidade)){ chips.quantidade.push(entry.quantidade); persistChips('quantidade'); }

    closeModal();
    renderAll();
  }

  render();

  if(editing && editing.photoId){
    idbGetPhoto(editing.photoId).then(blob=>{
      if(blob && document.getElementById('bodyEntry')){
        form.photo = URL.createObjectURL(blob);
        refreshBody();
      }
    }).catch(err=> console.error('Erro ao carregar foto', err));
  }
  if(editing && editing.anexoId){
    idbGetPhoto(editing.anexoId).then(blob=>{
      if(blob && document.getElementById('bodyEntry')){
        form.anexoUrl = URL.createObjectURL(blob);
        refreshBody();
      }
    }).catch(err=> console.error('Erro ao carregar anexo', err));
  }
}

function closeModal(){ document.getElementById('modalHost').innerHTML=''; }

function openConfirmDelete(id){
  const host = document.getElementById('modalHost');
  host.innerHTML = `<div class="overlay" id="ovDel" style="align-items:center">
    <div style="background:#fff; border-radius:16px; padding:20px; max-width:320px; width:calc(100% - 48px)">
      <div style="font-size:.9rem; font-weight:600; margin-bottom:4px">Excluir registro?</div>
      <div style="font-size:.75rem; color:var(--ink-muted); margin-bottom:16px">Essa ação não pode ser desfeita.</div>
      <div style="display:flex; gap:8px">
        <button class="btn-secondary" id="btnCancelDel" style="flex:1">Cancelar</button>
        <button class="btn-danger" id="btnConfirmDel">Excluir</button>
      </div>
    </div>
  </div>`;
  document.getElementById('ovDel').addEventListener('click', e=>{ if(e.target.id==='ovDel') closeModal(); });
  document.getElementById('btnCancelDel').addEventListener('click', closeModal);
  document.getElementById('btnConfirmDel').addEventListener('click', ()=>{
    const toRemove = entries.find(e=>e.id===id);
    if(toRemove && toRemove.photoId) idbDeletePhoto(toRemove.photoId).catch(()=>{});
    if(toRemove && toRemove.anexoId) idbDeletePhoto(toRemove.anexoId).catch(()=>{});
    entries = entries.filter(e=>e.id!==id);
    persistEntries();
    closeModal();
    renderAll();
  });
}

// ================= SETTINGS MODAL =================
function openSettings(){
  const host = document.getElementById('modalHost');
  let draftPhotoBlob = null;
  let draftPhotoUrl = profilePhotoUrl;
  let removedPhoto = false;
  let saving = false;
  let draftRaca = settings.raca || '';
  let draftSexo = settings.sexo || '';
  let draftBirthdate = settings.birthdate || '';
  let draftSheetLink = settings.sheetLink || '';
  let draftCrecheLink = settings.crecheLink || '';

  function render(){
    host.innerHTML = `<div class="overlay" id="ovSet">
      <div class="sheet">
        <div class="sheet-head"><div class="sheet-title">Configurações</div><button class="icon-btn" id="closeSet" ${saving?'disabled':''}>${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div class="field"><label>Foto do Otto</label>
            ${draftPhotoUrl ? `<div class="photo-preview"><img id="profileThumb" src="${draftPhotoUrl}" style="cursor:pointer"/><button type="button" id="removeProfilePhoto" class="photo-remove">${icon('x',13,'#fff')}</button></div>`
              : `<button type="button" id="addProfilePhotoBtn" class="add-trigger">${icon('camera',15)} Adicionar foto</button>`}
            <input type="file" id="profilePhotoInput" accept="image/*" style="display:none"/>
          </div>
          <div class="row2">
            <div class="field"><label>Raça (opcional)</label><input id="racaInput" value="${esc(draftRaca)}" placeholder="ex: Vira-lata"/></div>
            <div class="field"><label>Sexo (opcional)</label><select id="sexoInput">
              <option value="" ${!draftSexo?'selected':''}></option>
              <option value="Macho" ${draftSexo==='Macho'?'selected':''}>Macho</option>
              <option value="Fêmea" ${draftSexo==='Fêmea'?'selected':''}>Fêmea</option>
            </select></div>
          </div>
          <div class="field"><label>Data de nascimento (opcional, pra mostrar a idade)</label>${dtField('birthdateInput','date',draftBirthdate)}</div>
          <div class="field"><label>Link da planilha de exames (Google Sheets)</label><input id="linkInput" value="${esc(draftSheetLink)}" placeholder="https://..."/></div>
          <div class="field"><label>Link do app da creche</label><input id="crecheLinkInput" value="${esc(draftCrecheLink)}" placeholder="https://..."/></div>
          <div style="display:flex; justify-content:center; gap:16px; padding-top:10px; margin-top:6px; border-top:1px solid #F1EEE6">
            <button type="button" id="exportBtn" style="background:none; border:none; font-size:.7rem; color:var(--ink-muted); cursor:pointer">Exportar dados</button>
            <button type="button" id="importBtn" style="background:none; border:none; font-size:.7rem; color:var(--ink-muted); cursor:pointer">Importar dados</button>
            <input type="file" id="importFileInput" accept="application/json" style="display:none"/>
          </div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="saveSet" ${saving?'disabled':''}>${saving?'Salvando...':'Salvar'}</button></div>
      </div>
    </div>`;
    const racaEl = document.getElementById('racaInput'); racaEl.addEventListener('input', e=> draftRaca=e.target.value);
    const sexoEl = document.getElementById('sexoInput'); sexoEl.addEventListener('change', e=> draftSexo=e.target.value);
    wireDtField('birthdateInput', v=> draftBirthdate=v);
    const linkEl = document.getElementById('linkInput'); linkEl.addEventListener('input', e=> draftSheetLink=e.target.value);
    const crecheLinkEl = document.getElementById('crecheLinkInput'); crecheLinkEl.addEventListener('input', e=> draftCrecheLink=e.target.value);
    document.getElementById('exportBtn').addEventListener('click', exportBackup);
    const importFileEl = document.getElementById('importFileInput');
    document.getElementById('importBtn').addEventListener('click', ()=> importFileEl.click());
    importFileEl.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(!confirm('Isso substitui todos os dados atuais pelos do arquivo de backup. Continuar?')) { importFileEl.value=''; return; }
      await importBackup(file);
      importFileEl.value = '';
    });
    document.getElementById('ovSet').addEventListener('click', e=>{ if(e.target.id==='ovSet' && !saving) closeModal(); });
    document.getElementById('closeSet').addEventListener('click', ()=>{ if(!saving) closeModal(); });

    const addBtn = document.getElementById('addProfilePhotoBtn');
    const input = document.getElementById('profilePhotoInput');
    const removeBtn = document.getElementById('removeProfilePhoto');
    const thumb = document.getElementById('profileThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        draftPhotoBlob = await resizeImageFile(file, 1200, 0.85);
        draftPhotoUrl = URL.createObjectURL(draftPhotoBlob);
        removedPhoto = false;
      }catch(err){
        console.error('Erro ao processar foto', err);
        showWarning('Não consegui processar essa foto. Tenta outra.');
      }
      render();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{ draftPhotoUrl=''; draftPhotoBlob=null; removedPhoto=true; render(); });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(draftPhotoUrl));

    document.getElementById('saveSet').addEventListener('click', async ()=>{
      saving = true; render();
      settings.sheetLink = draftSheetLink.trim();
      settings.crecheLink = draftCrecheLink.trim();
      settings.birthdate = draftBirthdate;
      settings.raca = draftRaca.trim();
      settings.sexo = draftSexo;
      if(draftPhotoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, draftPhotoBlob);
          if(settings.profilePhotoId) idbDeletePhoto(settings.profilePhotoId).catch(()=>{});
          settings.profilePhotoId = newId;
        }catch(err){
          console.error('Erro ao salvar foto do Otto', err);
          showWarning('Não consegui salvar a foto, mas o resto foi salvo.');
        }
      } else if(removedPhoto && settings.profilePhotoId){
        idbDeletePhoto(settings.profilePhotoId).catch(()=>{});
        settings.profilePhotoId = '';
      }
      persistSettings();
      closeModal();
      await loadProfilePhoto();
    });
  }
  render();
}

// ================= FOOD MANAGER =================
function openFoodManager(onDone){
  const host = document.getElementById('modalHost');
  let list = foods.slice();
  let editingId = null;
  let draftName = '';
  let draftReceita = '';

  function render(){
    host.innerHTML = `<div class="overlay" id="ovFood">
      <div class="sheet" style="max-height:90%">
        <div class="sheet-head"><div class="sheet-title">Meus alimentos</div><button class="icon-btn" id="closeFood">${icon('x',18)}</button></div>
        <div class="sheet-body">
          ${editingId? `<div class="hint" style="margin-bottom:8px; font-weight:600; color:${CATEGORIES.alimentacao.hex}">Editando</div>` : ''}
          <div class="field"><label>Nome curto</label><input id="foodNameInput" value="${esc(draftName)}" placeholder="ex: Ração seca, Frango com arroz..." style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; background:#FBFAF7; font-family:inherit; box-sizing:border-box"/></div>
          <div class="field"><label>Receita completa (opcional)</label><textarea id="foodRecipeInput" placeholder="ex: 100g frango cozido + 50g abóbora + 1 colher de óleo de linhaça..." style="min-height:80px">${esc(draftReceita)}</textarea></div>
          <div style="display:flex; gap:8px; margin-bottom:14px">
            ${editingId? `<button id="cancelFoodBtn" class="btn-secondary" style="flex:1">Cancelar</button>` : ''}
            <button id="addFoodBtn" style="flex:1; border:none; border-radius:12px; padding:12px; background:${CATEGORIES.alimentacao.hex}; color:#fff; font-weight:600; font-size:.85rem">${editingId?'Salvar':'Adicionar alimento'}</button>
          </div>
          <div id="foodList">${list.map(f=>`
            <div class="manager-item" data-open="${f.id}" style="cursor:pointer">
              <span class="name">${esc(f.name)}</span>
              <button class="del-btn" data-id="${f.id}">${icon('trash',14,'var(--ink-muted)')}</button>
            </div>`).join('') || '<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>'}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneFoodBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovFood').addEventListener('click', e=>{ if(e.target.id==='ovFood') finish(); });
    document.getElementById('closeFood').addEventListener('click', finish);
    document.getElementById('doneFoodBtn').addEventListener('click', finish);
    document.getElementById('addFoodBtn').addEventListener('click', saveFood);
    document.getElementById('foodNameInput').addEventListener('input', e=> draftName=e.target.value);
    document.getElementById('foodRecipeInput').addEventListener('input', e=> draftReceita=e.target.value);
    document.getElementById('foodNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveFood(); } });
    const cancelBtn = document.getElementById('cancelFoodBtn'); if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingId=null; draftName=''; draftReceita=''; render(); });
    document.querySelectorAll('#foodList .del-btn').forEach(b=> b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      list = list.filter(f=>f.id!==b.dataset.id);
      if(editingId===b.dataset.id){ editingId=null; draftName=''; draftReceita=''; }
      render();
    }));
    document.querySelectorAll('#foodList .manager-item').forEach((row, idx)=> row.addEventListener('click', ()=>{
      const f = list[idx];
      if(!f) return;
      editingId = f.id;
      draftName = f.name;
      draftReceita = f.receita || '';
      render();
    }));
  }
  function saveFood(){
    const n = draftName.trim();
    if(!n) return;
    const duplicate = list.some(f=> f.name.toLowerCase()===n.toLowerCase() && f.id!==editingId);
    if(duplicate){ showWarning(`"${n}" já está cadastrado.`); return; }
    if(editingId){
      list = list.map(f=> f.id===editingId ? { ...f, name:n, receita:draftReceita.trim() } : f);
    } else {
      list.push({id:genId(), name:n, receita: draftReceita.trim()});
    }
    editingId=null; draftName=''; draftReceita='';
    render();
  }
  function finish(){
    foods = list;
    persistFoods();
    closeModal();
    if(onDone) onDone();
  }
  render();
}

// ================= MED MANAGER =================
function openMedManager(onDone, jumpToId){
  const host = document.getElementById('modalHost');
  let list = meds.slice();
  let adding = false;
  let editingId = null;
  let draft = {name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horario:''};

  if(jumpToId){
    const m = list.find(x=>x.id===jumpToId);
    if(m){
      editingId = m.id;
      adding = true;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horario:m.horario||'' };
    }
  }

  function render(){
    host.innerHTML = `<div class="overlay" id="ovMed">
      <div class="sheet" style="max-height:90vh">
        <div class="sheet-head"><div class="sheet-title">Remédios atuais</div><button class="icon-btn" id="closeMed">${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div id="addArea"></div>
          <div id="medList" style="${adding?'display:none':''}">${list.map(m=>`<div class="manager-item" data-open="${m.id}" style="cursor:pointer"><div><div class="name">${esc(m.name)}</div><div class="sub">${m.tipo==='continuo'?'Contínuo':`Pontual · ${fmtDateShort(m.dataInicio)} a ${fmtDateShort(m.dataFim)}`}${m.horario?' · '+m.horario:''}${m.dose?' · '+esc(m.dose):''}</div></div><button class="del-btn" data-id="${m.id}">${icon('trash',14,'var(--ink-muted)')}</button></div>`).join('') || (adding?'':'<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>')}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneMedBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovMed').addEventListener('click', e=>{ if(e.target.id==='ovMed') finish(); });
    document.getElementById('closeMed').addEventListener('click', finish);
    document.getElementById('doneMedBtn').addEventListener('click', finish);
    document.querySelectorAll('#medList .del-btn').forEach(b=> b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      list = list.filter(m=>m.id!==b.dataset.id);
      if(editingId===b.dataset.id){ adding=false; editingId=null; }
      render();
    }));
    document.querySelectorAll('#medList .manager-item').forEach((row, idx)=> row.addEventListener('click', ()=>{
      const m = list[idx];
      if(!m) return;
      editingId = m.id;
      adding = true;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horario:m.horario||'' };
      syncMedListVisibility();
      renderAddArea();
      document.getElementById('addArea').scrollIntoView({behavior:'smooth', block:'center'});
    }));
    renderAddArea();
  }

  function syncMedListVisibility(){
    const el = document.getElementById('medList');
    if(el) el.style.display = adding ? 'none' : '';
  }

  function renderAddArea(){
    const area = document.getElementById('addArea');
    if(!adding){
      area.innerHTML = `<button class="add-trigger" id="startAdd" style="margin-bottom:14px">${icon('plus',15)} Cadastrar remédio</button>`;
      document.getElementById('startAdd').addEventListener('click', ()=>{ adding=true; editingId=null; draft={name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horario:''}; syncMedListVisibility(); renderAddArea(); });
      return;
    }
    area.innerHTML = `<div class="add-form">
      ${editingId? `<div class="hint" style="margin-bottom:8px; font-weight:600; color:${CATEGORIES.remedio.hex}">Editando</div>` : ''}
      <div class="field"><label>Nome do remédio</label><input id="d_name" autocomplete="off" value="${esc(draft.name)}" placeholder="ex: Omeprazol"/></div>
      <div class="field"><label>Tipo</label><div class="tipo-toggle">
        <button data-tipo="continuo" class="${draft.tipo==='continuo'?'sel':''}">Contínuo</button>
        <button data-tipo="pontual" class="${draft.tipo==='pontual'?'sel':''}">Pontual (início e fim)</button>
      </div></div>
      ${draft.tipo==='pontual'? `
        <div class="field"><label>Início</label>${dtField('d_inicio','date',draft.dataInicio)}</div>
        <div class="field"><label>Fim</label>${dtField('d_fim','date',draft.dataFim)}</div>
      ` : ''}
      <div class="field"><label>Dose / instruções (opcional)</label><input id="d_dose" autocomplete="off" value="${esc(draft.dose)}" placeholder="ex: 1 comprimido"/></div>
      <div class="field"><label>Horário programado (opcional)</label>${dtField('d_horario','time',draft.horario)}
      </div>
      <div style="display:flex; gap:8px; margin-top:4px">
        <button class="btn-secondary" id="cancelAdd" style="flex:1">Cancelar</button>
        <button class="btn-primary" id="confirmAdd" ${draft.name.trim()?'':'disabled'}>${editingId?'Salvar':'Adicionar'}</button>
      </div>
    </div>`;
    document.getElementById('d_name').addEventListener('input', e=>{ draft.name=e.target.value; document.getElementById('confirmAdd').disabled = !draft.name.trim(); });
    document.querySelectorAll('[data-tipo]').forEach(b=> b.addEventListener('click', ()=>{ draft.tipo=b.dataset.tipo; renderAddArea(); }));
    wireDtField('d_inicio', v=> draft.dataInicio=v);
    wireDtField('d_fim', v=> draft.dataFim=v);
    document.getElementById('d_dose').addEventListener('input', e=> draft.dose=e.target.value);
    wireDtField('d_horario', v=> draft.horario=v);
    document.getElementById('cancelAdd').addEventListener('click', ()=>{ adding=false; editingId=null; syncMedListVisibility(); renderAddArea(); });
    document.getElementById('confirmAdd').addEventListener('click', ()=>{
      const n = draft.name.trim(); if(!n) return;
      const duplicate = list.some(m=> m.name.toLowerCase()===n.toLowerCase() && (m.horario||'')===(draft.horario||'') && m.id!==editingId);
      if(duplicate){
        showWarning(`Já existe "${n}" cadastrado nesse mesmo horário. Edite o existente ou use um horário diferente.`);
        return;
      }
      const payload = { name:n, tipo:draft.tipo, dataInicio: draft.tipo==='pontual'?draft.dataInicio:'', dataFim: draft.tipo==='pontual'?draft.dataFim:'', dose:draft.dose.trim(), horario:draft.horario };
      if(editingId){
        list = list.map(m=> m.id===editingId ? { ...m, ...payload } : m);
      } else {
        list.push({ id:genId(), ...payload });
      }
      adding=false; editingId=null;
      render();
    });
  }

  function finish(){ meds=list; persistMeds(); closeModal(); renderTimeline(); if(onDone) onDone(); }
  render();
}

// ---------- top-level wiring ----------
document.getElementById('searchInput').addEventListener('input', e=>{ search=e.target.value; renderTimeline(); });
document.getElementById('searchToggleBtn').addEventListener('click', ()=>{
  const box = document.getElementById('searchBox');
  const opening = box.style.display==='none';
  box.style.display = opening ? 'flex' : 'none';
  if(opening){ document.getElementById('searchInput').focus(); }
  else { search=''; document.getElementById('searchInput').value=''; renderTimeline(); }
});
document.getElementById('searchCloseBtn').addEventListener('click', ()=>{
  document.getElementById('searchBox').style.display='none';
  search=''; document.getElementById('searchInput').value=''; renderTimeline();
});

renderQuickActions();
renderFilters();
renderAll();
loadProfilePhoto();
</script>
