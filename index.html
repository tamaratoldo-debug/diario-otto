function openReport(){
  const host = document.getElementById('modalHost');
  let start = (()=>{ const d=new Date(); d.setDate(d.getDate()-29); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; })();
  let end = todayStr();

  function dayKeyOf(iso){ const d=new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function dateRangeArray(s,e){
    const out=[]; let cur=new Date(s+'T00:00:00'); const endD=new Date(e+'T00:00:00');
    while(cur<=endD){ out.push(dayKeyOf(cur.toISOString())); cur.setDate(cur.getDate()+1); }
    return out.reverse();
  }
  function fmtLongDate(ds){
    const [y,m,d] = ds.split('-');
    const wd = new Date(ds+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    return `${d}/${m}/${y} · ${wd}`;
  }

  function renderPicker(){
    host.innerHTML = `<div class="overlay" id="ovRep">
      <div class="sheet">
        <div class="sheet-head"><div class="sheet-title">Gerar relatório</div><button class="icon-btn" id="closeRep">${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div class="field"><label>De</label>${dtField('rep_start','date',start)}</div>
          <div class="field"><label>Até</label>${dtField('rep_end','date',end)}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="genRepBtn">Gerar relatório</button></div>
      </div>
    </div>`;
    document.getElementById('ovRep').addEventListener('click', e=>{ if(e.target.id==='ovRep') closeModal(); });
    document.getElementById('closeRep').addEventListener('click', closeModal);
    wireDtField('rep_start', v=> start=v);
    wireDtField('rep_end', v=> end=v);
    document.getElementById('genRepBtn').addEventListener('click', ()=>{
      if(!start || !end || start>end){ showWarning('Confira as datas selecionadas.'); return; }
      renderDoc();
    });
  }

  function weightSectionHtml(pesoEntries){
    if(pesoEntries.length===0) return `<p class="rep-small">Sem registro de peso no período.</p>`;
    if(pesoEntries.length===1){
      const e = pesoEntries[0];
      return `<p style="font-size:.85rem; margin:0">Último registro: <b>${e.value} kg</b> (${fmtDateShort(dayKeyOf(e.date))})</p>`;
    }
    // 2+ pontos: grafico de linha em SVG simples, sem biblioteca nenhuma
    const W=540, H=140, PAD=28;
    const vals = pesoEntries.map(e=>e.value);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const stepX = (W-PAD*2) / (pesoEntries.length-1);
    const pts = pesoEntries.map((e,i)=>{
      const x = PAD + i*stepX;
      const y = H-PAD - ((e.value-min)/range) * (H-PAD*2);
      return {x,y,e};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const dots = pts.map(p=> `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="#2E4F3B"/><text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" font-size="9" text-anchor="middle" fill="#2E4F3B">${p.e.value}</text>`).join('');
    const labels = pts.map((p,i)=> (i===0||i===pts.length-1) ? `<text x="${p.x.toFixed(1)}" y="${H-6}" font-size="8" text-anchor="middle" fill="#5C7568">${fmtDateShort(dayKeyOf(p.e.date))}</text>` : '').join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto"><path d="${path}" fill="none" stroke="#2E4F3B" stroke-width="1.4"/>${dots}${labels}</svg>`;
  }

  function renderDoc(){
    const days = dateRangeArray(start,end);
    const inRange = entries.filter(e=> { const ds=dayKeyOf(e.date); return ds>=start && ds<=end; });
    const pesoEntries = inRange.filter(e=>e.category==='peso').slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
    const continuos = meds.filter(m=> m.tipo==='continuo');

    const medRows = meds.map(m=>{
      const horarios = m.tipo==='sob-demanda' ? 'conforme necessário' : ((m.horarios&&m.horarios.length)? m.horarios.join(', ') : '—');
      const duracao = m.tipo==='continuo'?'Contínuo' : m.tipo==='sob-demanda'?'Sob demanda' : `Pontual (${fmtDateShort(m.dataInicio)} a ${fmtDateShort(m.dataFim)})`;
      return `<tr><td>${esc(m.name)}</td><td>${esc(horarios)}</td><td>${esc(m.dose||'—')}</td><td>${duracao}</td></tr>`;
    }).join('');

    const dayBlocks = days.map(ds=>{
      const dayEntries = inRange.filter(e=> dayKeyOf(e.date)===ds);
      if(dayEntries.length===0) return '';
      const remedios = [...new Set(dayEntries.filter(e=>e.category==='remedio').map(e=>e.title))];
      const givenSlots = new Set(dayEntries.filter(e=>e.category==='remedio' && e.medId).map(e=> e.medId+'|'+(e.horarioSlot||'')));
      const naoAdmin = [];
      continuos.forEach(m=>{
        const horarios = (m.horarios&&m.horarios.length) ? m.horarios : [''];
        horarios.forEach(h=>{
          if(!givenSlots.has(m.id+'|'+h)) naoAdmin.push(h ? `${m.name} (${h})` : m.name);
        });
      });
      const alimentacao = dayEntries.filter(e=>e.category==='alimentacao')
        .map(e=> `${fmtTime(e.date)} — ${esc(e.title)}${entrySubtitle(e)?` (${esc(entrySubtitle(e))})`:''}`).join('<br/>');
      const interc = dayEntries.filter(e=>e.category==='intercorrencia')
        .map(e=> `${fmtTime(e.date)} — ${esc(e.title)}${e.gravidade?` (${e.gravidade})`:''}${e.note?`: "${esc(e.note)}"`:''}`).join('<br/>');
      const proc = dayEntries.filter(e=> ['procedimento','consulta','exame'].includes(e.category))
        .map(e=>{
          const catLabel = {procedimento:'Procedimento',consulta:'Consulta',exame:'Exame'}[e.category];
          let extra = e.clinica || (e.category==='exame'?e.tipoExame:'') || '';
          return `${fmtTime(e.date)} — ${catLabel}: ${esc(e.title)}${extra?` (${esc(extra)})`:''}${e.note?` — ${esc(e.note)}`:''}`;
        }).join('<br/>');

      let rows = `<div class="rep-day-row"><div class="rep-day-label">Remédios</div><div class="rep-day-val">${remedios.length?esc(remedios.join(', ')):'—'}</div></div>`;
      if(naoAdmin.length) rows += `<div class="rep-day-row"><div class="rep-day-label">Não administrados</div><div class="rep-day-val">${esc(naoAdmin.join(', '))}</div></div>`;
      rows += `<div class="rep-day-row"><div class="rep-day-label">Alimentação</div><div class="rep-day-val">${alimentacao||'Sem registro'}</div></div>`;
      if(interc) rows += `<div class="rep-day-row"><div class="rep-day-label">Intercorrência</div><div class="rep-day-val">${interc}</div></div>`;
      if(proc) rows += `<div class="rep-day-row"><div class="rep-day-label">Procedimento</div><div class="rep-day-val">${proc}</div></div>`;

      return `<div class="rep-day">
        <div class="rep-day-row" style="background:#2E4F3B; color:#fff; border-bottom:none"><div style="padding:4px 6px; font-size:.7rem; font-weight:700">${fmtLongDate(ds)}</div></div>
        ${rows}
      </div>`;
    }).join('');

    const nascStr = settings.birthdate ? fmtDateShort(settings.birthdate) + ` (${ageText()})` : '—';
    const linkHtml = settings.sheetLink ? `<p style="font-size:.82rem; margin:0"><a href="${esc(settings.sheetLink)}" target="_blank" rel="noreferrer" style="color:#2E4F3B; font-weight:700">Clique para ver o histórico dos exames de sangue</a></p>` : '';

    host.innerHTML = `<div class="rep-overlay" id="repDocHost">
      <div class="rep-bar">
        <button class="icon-btn" id="repBack">${icon('x',18)}</button>
        <button class="btn-primary" id="repPrint" style="padding:8px 16px; font-size:.8rem">Imprimir / Salvar PDF</button>
      </div>
      <div class="rep-doc">
        <h1 class="rep-h1">Relatório de saúde — Otto</h1>
        <p class="rep-sub">${esc(settings.raca||'—')} · Nascimento: ${nascStr} · Período: ${fmtDateShort(start)} a ${fmtDateShort(end)}</p>
        <hr class="rep-hr"/>
        <div class="rep-h2">Peso</div>
        ${weightSectionHtml(pesoEntries)}
        <div class="rep-h2">Medicações utilizadas</div>
        <table class="rep-table"><tr><th>Medicação</th><th>Horários</th><th>Posologia</th><th>Duração</th></tr>${medRows || '<tr><td colspan="4">Nenhuma cadastrada</td></tr>'}</table>
        <div class="rep-h2">Exames</div>
        ${linkHtml || '<p class="rep-small">Nenhum link cadastrado.</p>'}
        <div class="rep-h2 rep-daily-start">Registro diário</div>
        ${dayBlocks || '<p class="rep-small">Nenhum registro no período.</p>'}
      </div>
    </div>`;
    document.getElementById('repBack').addEventListener('click', closeModal);
    document.getElementById('repPrint').addEventListener('click', ()=> window.print());
  }

  renderPicker();
}

      </div>
    </div>`;
    const racaEl = document.getElementById('racaInput'); racaEl.addEventListener('input', e=> draftRaca=e.target.value);
    const sexoEl = document.getElementById('sexoInput'); sexoEl.addEventListener('change', e=> draftSexo=e.target.value);
    wireDtField('birthdateInput', v=> draftBirthdate=v);
    const linkEl = document.getElementById('linkInput'); linkEl.addEventListener('input', e=> draftSheetLink=e.target.value);
    const crecheLinkEl = document.getElementById('crecheLinkInput'); crecheLinkEl.addEventListener('input', e=> draftCrecheLink=e.target.value);
    const importFileEl = document.getElementById('importFileInput');
    document.getElementById('reportBtn').addEventListener('click', ()=> openReport());
    document.getElementById('importBtn').addEventListener('click', ()=> importFileEl.click());
    importFileEl.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(!confirm('Isso substitui todos os dados atuais pelos do arquivo de backup. Continuar?')) { importFileEl.value=''; return; }
      await importBackup(file);
      importFileEl.value = '';
    });
    document.getElementById('ovSet').addEventListener('click', e=>{ if(e.target.id==='ovSet' && !saving) closeModal(); });
    document.getElementById('closeSet').addEventListener('click', ()=>{ if(!saving) closeModal(); });

    const addBtn = document.getElementById('addProfilePhotoBtn');
    const input = document.getElementById('profilePhotoInput');
    const removeBtn = document.getElementById('removeProfilePhoto');
    const thumb = document.getElementById('profileThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        draftPhotoBlob = await resizeImageFile(file, 1200, 0.85);
        draftPhotoUrl = URL.createObjectURL(draftPhotoBlob);
        removedPhoto = false;
      }catch(err){
        console.error('Erro ao processar foto', err);
        showWarning('Não consegui processar essa foto. Tenta outra.');
      }
      render();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{ draftPhotoUrl=''; draftPhotoBlob=null; removedPhoto=true; render(); });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(draftPhotoUrl));

    document.getElementById('saveSet').addEventListener('click', async ()=>{
      saving = true; render();
      settings.sheetLink = draftSheetLink.trim();
      settings.crecheLink = draftCrecheLink.trim();
      settings.birthdate = draftBirthdate;
      settings.raca = draftRaca.trim();
      settings.sexo = draftSexo;
      if(draftPhotoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, draftPhotoBlob);
          if(settings.profilePhotoId) idbDeletePhoto(settings.profilePhotoId).catch(()=>{});
          settings.profilePhotoId = newId;
        }catch(err){
          console.error('Erro ao salvar foto do Otto', err);
          showWarning('Não consegui salvar a foto, mas o resto foi salvo.');
        }
      } else if(removedPhoto && settings.profilePhotoId){
        idbDeletePhoto(settings.profilePhotoId).catch(()=>{});
        settings.profilePhotoId = '';
      }
      persistSettings();
      closeModal();
      await loadProfilePhoto();
    });
  }
  render();
}

function openFoodManager(onDone){
  const host = document.getElementById('modalHost');
  let list = foods.slice();
  let editingId = null;
  let draftName = '';
  let draftReceita = '';

  function render(){
    host.innerHTML = `<div class="overlay" id="ovFood">
      <div class="sheet" style="max-height:90%">
        <div class="sheet-head"><div class="sheet-title">Meus alimentos</div><button class="icon-btn" id="closeFood">${icon('x',18)}</button></div>
        <div class="sheet-body">
          ${editingId? `<div class="hint" style="margin-bottom:8px; font-weight:600; color:${CATEGORIES.alimentacao.hex}">Editando</div>` : ''}
          <div class="field"><label>Nome curto</label><input id="foodNameInput" value="${esc(draftName)}" placeholder="ex: Ração seca, Frango com arroz..." style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; background:#FBFAF7; font-family:inherit; box-sizing:border-box"/></div>
          <div class="field"><label>Receita completa (opcional)</label><textarea id="foodRecipeInput" placeholder="ex: 100g frango cozido + 50g abóbora + 1 colher de óleo de linhaça..." style="min-height:80px">${esc(draftReceita)}</textarea></div>
          <div style="display:flex; gap:8px; margin-bottom:14px">
            ${editingId? `<button id="cancelFoodBtn" class="btn-secondary" style="flex:1">Cancelar</button>` : ''}
            <button id="addFoodBtn" style="flex:1; border:none; border-radius:12px; padding:12px; background:${CATEGORIES.alimentacao.hex}; color:#fff; font-weight:600; font-size:.85rem">${editingId?'Salvar':'Adicionar alimento'}</button>
          </div>
          <div id="foodList">${list.map(f=>`
            <div class="manager-item" data-open="${f.id}" style="cursor:pointer">
              <span class="name">${esc(f.name)}</span>
              <button class="del-btn" data-id="${f.id}">${icon('trash',14,'var(--ink-muted)')}</button>
            </div>`).join('') || '<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>'}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneFoodBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovFood').addEventListener('click', e=>{ if(e.target.id==='ovFood') finish(); });
    document.getElementById('closeFood').addEventListener('click', finish);
    document.getElementById('doneFoodBtn').addEventListener('click', finish);
    document.getElementById('addFoodBtn').addEventListener('click', saveFood);
    document.getElementById('foodNameInput').addEventListener('input', e=> draftName=e.target.value);
    document.getElementById('foodRecipeInput').addEventListener('input', e=> draftReceita=e.target.value);
    document.getElementById('foodNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveFood(); } });
    const cancelBtn = document.getElementById('cancelFoodBtn'); if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingId=null; draftName=''; draftReceita=''; render(); });
    document.querySelectorAll('#foodList .del-btn').forEach(b=> b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      list = list.filter(f=>f.id!==b.dataset.id);
      if(editingId===b.dataset.id){ editingId=null; draftName=''; draftReceita=''; }
      render();
    }));
    document.querySelectorAll('#foodList .manager-item').forEach((row, idx)=> row.addEventListener('click', ()=>{
      const f = list[idx];
      if(!f) return;
      editingId = f.id;
      draftName = f.name;
      draftReceita = f.receita || '';
      render();
    }));
  }
  function saveFood(){
    const n = draftName.trim();
    if(!n) return;
    const duplicate = list.some(f=> normalizeSearch(f.name)===normalizeSearch(n) && f.id!==editingId);
    if(duplicate){ showWarning(`"${n}" já está cadastrado.`); return; }
    if(editingId){
      list = list.map(f=> f.id===editingId ? { ...f, name:n, receita:draftReceita.trim() } : f);
    } else {
      list.push({id:genId(), name:n, receita: draftReceita.trim()});
    }
    editingId=null; draftName=''; draftReceita='';
    render();
  }
  function finish(){
    foods = list;
    persistFoods();
    closeModal();
    if(onDone) onDone();
  }
  render();
}

function openMedManager(onDone, jumpToId, startAdding){
  const host = document.getElementById('modalHost');

  let editingId = null;
  let draft = {name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horarios:[]};

  if(jumpToId){
    const m = list.find(x=>x.id===jumpToId);
    if(m){
      editingId = m.id;
      adding = true;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horarios:(m.horarios||[]).slice() };

  }

  function render(){
    submitting = false;
    const scheduled = list.filter(m=> m.tipo!=='sob-demanda');
    const onDemand = list.filter(m=> m.tipo==='sob-demanda');
    const itemHtml = m=> `<div class="manager-item" data-open="${m.id}" style="cursor:pointer"><div><div class="name">${esc(m.name)}</div><div class="sub">${medSubLabel(m)}</div></div><button class="del-btn" data-id="${m.id}">${icon('trash',14,'var(--ink-muted)')}</button></div>`;
    host.innerHTML = `<div class="overlay" id="ovMed">
      <div class="sheet" style="max-height:90vh">
        <div class="sheet-head"><div class="sheet-title">Remédios atuais</div><button class="icon-btn" id="closeMed">${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div id="addArea"></div>
          <div id="medList" style="${adding?'display:none':''}">
            ${scheduled.length? `<div class="hint" style="font-weight:600; margin:10px 0 6px">Horário fixo</div>${scheduled.map(itemHtml).join('')}` : ''}
            ${onDemand.length? `<div class="hint" style="font-weight:600; margin:14px 0 6px">Sob demanda</div>${onDemand.map(itemHtml).join('')}` : ''}
            ${list.length===0 && !adding? '<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>' : ''}
          </div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneMedBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovMed').addEventListener('click', e=>{ if(e.target.id==='ovMed') finish(); });
    document.getElementById('closeMed').addEventListener('click', finish);
    document.getElementById('doneMedBtn').addEventListener('click', finish);
    document.querySelectorAll('#medList .del-btn').forEach(b=> b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      list = list.filter(m=>m.id!==b.dataset.id);
      if(editingId===b.dataset.id){ adding=false; editingId=null; }
      render();
    }));
    document.querySelectorAll('#medList .manager-item').forEach(row=> row.addEventListener('click', ()=>{
      const m = list.find(x=>x.id===row.dataset.open);
      if(!m) return;
      editingId = m.id;
      adding = true;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horarios:(m.horarios||[]).slice() };
      syncMedListVisibility();
      renderAddArea();
      document.getElementById('addArea').scrollIntoView({behavior:'smooth', block:'center'});
    }));
    renderAddArea();
  }

  function syncMedListVisibility(){
    const el = document.getElementById('medList');
    if(el) el.style.display = adding ? 'none' : '';
  }

  function renderAddArea(){
    const area = document.getElementById('addArea');
    if(!adding){
      area.innerHTML = `<button class="add-trigger" id="startAdd" style="margin-bottom:14px">${icon('plus',15)} Cadastrar remédio</button>`;
      document.getElementById('startAdd').addEventListener('click', ()=>{ adding=true; editingId=null; draft={name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horarios:[]}; syncMedListVisibility(); renderAddArea(); });
      return;
    }
    const isScheduled = draft.tipo==='continuo' || draft.tipo==='pontual';
    area.innerHTML = `<div class="add-form">
      ${editingId? `<div class="hint" style="margin-bottom:8px; font-weight:600; color:${CATEGORIES.remedio.hex}">Editando</div>` : ''}
      <div class="field"><label>Nome do remédio</label><input id="d_name" autocomplete="off" value="${esc(draft.name)}" placeholder="ex: Omeprazol"/></div>
      <div class="field"><label>Tipo</label><div class="tipo-toggle">
        <button data-tipo="continuo" class="${draft.tipo==='continuo'?'sel':''}">Contínuo</button>
        <button data-tipo="pontual" class="${draft.tipo==='pontual'?'sel':''}">Pontual (início e fim)</button>
        <button data-tipo="sob-demanda" class="${draft.tipo==='sob-demanda'?'sel':''}">Sob demanda</button>
      </div></div>
      ${draft.tipo==='pontual'? `
        <div class="field"><label>Início</label>${dtField('d_inicio','date',draft.dataInicio)}</div>
        <div class="field"><label>Fim</label>${dtField('d_fim','date',draft.dataFim)}</div>
      ` : ''}
      <div class="field"><label>Dose / instruções (opcional)</label><input id="d_dose" autocomplete="off" value="${esc(draft.dose)}" placeholder="ex: 1 comprimido"/></div>
      ${isScheduled? `<div class="field"><label>Horários</label>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px">
          ${draft.horarios.map((h,i)=>`<span style="display:inline-flex; align-items:center; gap:5px; background:${CATEGORIES.remedio.hex}18; color:${CATEGORIES.remedio.hex}; border-radius:8px; padding:5px 6px 5px 10px; font-size:.82rem; font-weight:600">${h}<button type="button" data-rm-horario="${i}" style="background:none; border:none; padding:2px; display:flex; color:inherit">${icon('x',12,CATEGORIES.remedio.hex)}</button></span>`).join('') || '<span class="hint">Nenhum horário adicionado ainda.</span>'}
        </div>
        <div style="display:flex; gap:8px">
          <div style="flex:1">${dtField('d_horario_new','time','')}</div>
          <button type="button" class="btn-secondary" id="addHorarioBtn">Adicionar</button>
        </div>
      </div>` : ''}
      <div style="display:flex; gap:8px; margin-top:4px">
        ${editingId? `<button class="btn-secondary" id="deleteMedBtn" style="color:#B3261E; padding:0 14px">${icon('trash',16,'#B3261E')}</button>` : ''}
        <button class="btn-secondary" id="cancelAdd" style="flex:1">Cancelar</button>
        <button class="btn-primary" id="confirmAdd" ${draft.name.trim()?'':'disabled'}>${editingId?'Salvar':'Adicionar'}</button>
      </div>
    </div>`;
    document.getElementById('d_name').addEventListener('input', e=>{ draft.name=e.target.value; document.getElementById('confirmAdd').disabled = !draft.name.trim(); });
    const deleteBtn = document.getElementById('deleteMedBtn');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      if(!window.confirm(`Excluir "${draft.name}"? Essa ação não pode ser desfeita.`)) return;
      list = list.filter(m=> m.id!==editingId);
      adding=false; editingId=null;
      render();
    });
    document.querySelectorAll('[data-tipo]').forEach(b=> b.addEventListener('click', ()=>{ draft.tipo=b.dataset.tipo; renderAddArea(); }));
    wireDtField('d_inicio', v=> draft.dataInicio=v);
    wireDtField('d_fim', v=> draft.dataFim=v);
    document.getElementById('d_dose').addEventListener('input', e=> draft.dose=e.target.value);
    if(isScheduled){
      let newHorarioVal = '';
      wireDtField('d_horario_new', v=> newHorarioVal=v);
      document.getElementById('addHorarioBtn').addEventListener('click', ()=>{
        if(!newHorarioVal) return;
        if(!draft.horarios.includes(newHorarioVal)) draft.horarios.push(newHorarioVal);
        draft.horarios.sort();
        renderAddArea();
      });
      document.querySelectorAll('[data-rm-horario]').forEach(b=> b.addEventListener('click', ()=>{
        draft.horarios.splice(Number(b.dataset.rmHorario),1);
        renderAddArea();
      }));
    }
    document.getElementById('cancelAdd').addEventListener('click', ()=>{ adding=false; editingId=null; syncMedListVisibility(); renderAddArea(); });
    document.getElementById('confirmAdd').addEventListener('click', ()=>{
      if(submitting) return;
      const n = draft.name.trim(); if(!n) return;

      const duplicate = list.some(m=> normalizeSearch(m.name)===normalizeSearch(n) && m.id!==editingId);
      if(duplicate){
        showWarning(`Já existe "${n}" cadastrado. Edite ele pra ajustar os horários, em vez de criar de novo.`);
        return;
      }
      submitting = true;
      const payload = {
        name:n, tipo:draft.tipo,
        dataInicio: draft.tipo==='pontual'?draft.dataInicio:'',
        dataFim: draft.tipo==='pontual'?draft.dataFim:'',
        dose:draft.dose.trim(),
        horarios: (draft.tipo==='continuo'||draft.tipo==='pontual') ? draft.horarios.slice() : []
      };
      if(editingId){
        list = list.map(m=> m.id===editingId ? { ...m, ...payload } : m);
      } else {
        list.push({ id:genId(), ...payload });
      }
      adding=false; editingId=null;
      render();
    });
  }

  function finish(){ meds=list; persistMeds(); closeModal(); renderTimeline(); if(onDone) onDone(); }
  render();
}

// ---------- top-level wiring ----------
document.getElementById('searchInput').addEventListener('input', e=>{ search=e.target.value; renderTimeline(); });
document.getElementById('searchToggleBtn').addEventListener('click', ()=>{
  const box = document.getElementById('searchBox');
  const opening = box.style.display==='none';
  box.style.display = opening ? 'flex' : 'none';
  if(opening){ document.getElementById('searchInput').focus(); }
  else { search=''; document.getElementById('searchInput').value=''; renderTimeline(); }
});
document.getElementById('searchCloseBtn').addEventListener('click', ()=>{
  document.getElementById('searchBox').style.display='none';
  search=''; document.getElementById('searchInput').value=''; renderTimeline();
});

renderQuickActions();
renderFilters();
renderAll();
loadProfilePhoto();
checkBackupBanner();
</script>
</body>
</html>
