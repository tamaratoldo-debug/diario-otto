  async function save(){
    const dateIso = new Date(`${form.dateD}T${form.dateT||'12:00'}`).toISOString();
    let entry = { id: editing? editing.id : genId(), category, date: dateIso, note: form.note.trim(), createdAt: editing? editing.createdAt : Date.now() };
    if(category==='peso'){ entry.value = parseFloat(form.value); entry.title='Peso'; }
    else if(category==='exame'){ entry.title=form.tipoExame; entry.tipoExame=form.tipoExame; entry.quemFez=form.quemFez.trim(); entry.cobrarViaCreche=!!form.cobrarViaCreche; if(editing && editing.crecheLancId) entry.crecheLancId = editing.crecheLancId; }
    else if(category==='intercorrencia'){
      entry.title=form.title.trim(); entry.gravidade=form.gravidade;
      if(form.photoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, form.photoBlob);
          entry.photoId = newId;
          if(editing && editing.photoId && editing.photoId!==newId) idbDeletePhoto(editing.photoId).catch(()=>{});
        }catch(err){
          console.error('Erro ao salvar foto', err);
          showWarning('Não consegui salvar a foto, mas o resto do registro foi salvo.');
        }
      } else if(form.photoId && !form.removedPhoto){
        entry.photoId = form.photoId;
      } else if(form.removedPhoto && editing && editing.photoId){
        idbDeletePhoto(editing.photoId).catch(()=>{});
      } else if(!form.removedPhoto && editing && editing.photo){
        entry.photo = editing.photo; // legacy entries saved before the IndexedDB migration
      }
    }
    else if(category==='consulta'){
      entry.title=form.title.trim(); entry.clinica=form.clinica.trim();
      if(form.anexoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, form.anexoBlob);
          entry.anexoId = newId; entry.anexoName = form.anexoName; entry.anexoType = form.anexoType;
          if(editing && editing.anexoId && editing.anexoId!==newId) idbDeletePhoto(editing.anexoId).catch(()=>{});
        }catch(err){
          console.error('Erro ao salvar anexo', err);
          showWarning('Não consegui salvar o anexo, mas o resto foi salvo.');
        }
      } else if(form.anexoId && !form.removedAnexo){
        entry.anexoId = form.anexoId; entry.anexoName = editing?.anexoName||''; entry.anexoType = editing?.anexoType||'';
      } else if(form.removedAnexo && editing && editing.anexoId){
        idbDeletePhoto(editing.anexoId).catch(()=>{});
      }
    }
    else if(category==='alimentacao'){ entry.title=form.title.trim(); entry.comoComeu=form.comoComeu; entry.quantidade=form.quantidade.trim(); }
    else if(category==='procedimento'){
      entry.title=form.title.trim(); entry.quemFez=form.quemFez.trim(); entry.cobrarViaCreche=!!form.cobrarViaCreche;
      if(editing && editing.crecheLancId) entry.crecheLancId = editing.crecheLancId;
    }
    else entry.title=form.title.trim();

    if(editing) entries = entries.map(e=> e.id===editing.id? entry : e);
    else entries.push(entry);
    entries.sort((a,b)=> new Date(b.date)-new Date(a.date));
    const ok = persistEntries();
    if(!ok) showWarning('Não consegui salvar esse registro no armazenamento do navegador. Tente novamente.');

    if(category==='intercorrencia' && entry.title && !chips.intercorrencia.includes(entry.title)){ chips.intercorrencia.push(entry.title); persistChips('intercorrencia'); }
    if(category==='consulta'){
      if(entry.title && !chips.consulta.includes(entry.title)){ chips.consulta.push(entry.title); persistChips('consulta'); }
      if(entry.clinica && !chips.clinica.includes(entry.clinica)){ chips.clinica.push(entry.clinica); persistChips('clinica'); }
    }
    if(category==='procedimento'){
      if(entry.title && !chips.procedimento.includes(entry.title)){ chips.procedimento.push(entry.title); persistChips('procedimento'); }
    }
    if(category==='procedimento' || category==='exame'){
      if(entry.quemFez && !chips.profissional.includes(entry.quemFez)){ chips.profissional.push(entry.quemFez); persistChips('profissional'); }
      const nomeFinanceiro = (entry.title && entry.title.trim()) || (category==='exame'?'Exame':'Procedimento');
      if(entry.cobrarViaCreche){
        const dataStr = toLocalDateStr(new Date(entry.date));
        if(!entry.crecheLancId){
          const newLanc = { id:genId(), servicoId:'outro', servicoNome:nomeFinanceiro, valor:0, data:dataStr, dataSaida:'', obs:entry.quemFez||'', entryId:null, procedimentoEntryId:entry.id, createdAt:Date.now() };
          crecheLancamentos.push(newLanc);
          persistCrecheLancamentos();
          entry.crecheLancId = newLanc.id;
          entries = entries.map(e=> e.id===entry.id? entry : e);
          persistEntries();
        } else {
          const lanc = crecheLancamentos.find(l=> l.id===entry.crecheLancId);
          if(lanc){ lanc.servicoNome=nomeFinanceiro; lanc.data=dataStr; lanc.obs=entry.quemFez||''; persistCrecheLancamentos(); }
        }
      } else if(entry.crecheLancId){
        crecheLancamentos = crecheLancamentos.filter(l=> l.id!==entry.crecheLancId);
        persistCrecheLancamentos();
        delete entry.crecheLancId;
        entries = entries.map(e=> e.id===entry.id? entry : e);
        persistEntries();
      }
    }
    if(category==='alimentacao' && entry.quantidade && !chips.quantidade.includes(entry.quantidade)){ chips.quantidade.push(entry.quantidade); persistChips('quantidade'); }

    closeModal();
    renderAll();
  }

  render();

  if(editing && editing.photoId){
    idbGetPhoto(editing.photoId).then(blob=>{
      if(blob && document.getElementById('bodyEntry')){
        form.photo = URL.createObjectURL(blob);
        refreshBody();
      }
    }).catch(err=> console.error('Erro ao carregar foto', err));
  }
  if(editing && editing.anexoId){
    idbGetPhoto(editing.anexoId).then(blob=>{
      if(blob && document.getElementById('bodyEntry')){
        form.anexoUrl = URL.createObjectURL(blob);
        refreshBody();
      }
    }).catch(err=> console.error('Erro ao carregar anexo', err));
  }
}

function closeModal(){ document.getElementById('modalHost').innerHTML=''; }

// ---------- creche/banho/hotel ----------
function monthKeyOf(dateStr){ return (dateStr||todayStr()).slice(0,7); }
function isMonthFechado(dateStr){ return !!crecheFechados[monthKeyOf(dateStr)]; }
function parseValorBR(s){
  if(s==null || s==='') return 0;
  const n = parseFloat(String(s).replace(/\./g,'').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}
function fmtValorBR(n){
  return (Number(n)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function diffDias(dataStr, dataSaidaStr){
  if(!dataStr || !dataSaidaStr) return 0;
  const a = new Date(dataStr+'T00:00:00'), b = new Date(dataSaidaStr+'T00:00:00');
  const d = Math.round((b-a)/86400000);
  return d>0 ? d : 0;
}

function openCrecheModal(editingLanc){
  const host = document.getElementById('modalHost');
  const cat = CATEGORIES.creche;
  let lanc = editingLanc || null;
  let selectedSvc = lanc ? lanc.servicoId : crecheServicos[0].id;
  let form = null;

  function servicoOf(id){ return crecheServicos.find(s=>s.id===id) || null; }

  function recalcHotelValor(){
    const servico = servicoOf('hotel');
    if(!servico) return;
    const dias = diffDias(form.data, form.dataSaida);
    if(dias>0) form.valor = fmtValorBR(dias*servico.valor);
  }

  function initForm(){
    const servico = servicoOf(selectedSvc);
    const isOutro = selectedSvc==='outro' || !servico;
    if(lanc){
      form = { nome: lanc.servicoNome, valor: fmtValorBR(lanc.valor), data: lanc.data, dataSaida: lanc.dataSaida||'', obs: lanc.obs||'' };
    } else {
      form = { nome: isOutro?'':servico.nome, valor: isOutro?'':fmtValorBR(servico.valor), data: todayStr(), dataSaida:'', obs:'' };
      if(selectedSvc==='hotel') recalcHotelValor();
    }
  }
  initForm();

  function canSave(){ return !!form && form.nome.trim()!=='' && form.data!==''; }

  function selectorHtml(){
    const items = crecheServicos.map(s=>({id:s.id, nome:s.nome})).concat([{id:'outro', nome:'Outro'}]);
    return `<div class="pickgrid" style="justify-content:flex-start; margin-bottom:18px">
      ${items.map(it=> `<button type="button" class="pick-btn ${selectedSvc===it.id?'sel':''}" style="${selectedSvc===it.id?`background:${cat.hex}`:''}" data-svc="${it.id}">${esc(it.nome)}</button>`).join('')}
    </div>`;
  }

  function fieldsHtml(){
    const isHotel = selectedSvc==='hotel';
    const isOutro = selectedSvc==='outro';
    const fechado = isMonthFechado(form.data);
    let h = '';
    if(fechado) h += `<div class="hint" style="margin-bottom:10px">Este mês já está fechado. Reabra em Gerenciar pra editar.</div>`;
    if(isOutro) h += `<div class="field"><label>Serviço</label><input id="f_nome" value="${esc(form.nome)}" ${fechado?'disabled':''}/></div>`;
    h += `<div class="field"${fechado?' style="pointer-events:none; opacity:.6"':''}><label>${isHotel?'Período':'Data'}</label>`;
    h += isHotel
      ? `<div class="row2"><div style="flex:1">${dtField('f_data','date',form.data)}</div><div style="flex:1">${dtField('f_saida','date',form.dataSaida,'Saída')}</div></div>`
      : dtField('f_data','date',form.data);
    h += `</div>
      <div class="field"><label>Valor (R$)</label><input inputmode="decimal" id="f_valor" value="${esc(form.valor)}" ${fechado?'disabled':''}/></div>
      <div class="field"><label>Observação (opcional)</label><textarea id="f_obs" ${fechado?'disabled':''}>${esc(form.obs)}</textarea></div>`;
    return h;
  }

  function render(){
    const fechado = isMonthFechado(form.data);
    host.innerHTML = `<div class="overlay" id="ovCreche">
      <div class="sheet" id="sheetCreche">
        <div class="sheet-head">
          <div class="sheet-title" style="color:${cat.hex}">${icon(cat.icon,17,cat.hex)}<span style="color:var(--ink)">${lanc? 'Editar · Creche' : 'Novo · Creche'}</span></div>
          <div style="display:flex; gap:6px">
            ${lanc && !fechado? `<button class="icon-btn danger" id="btnDelCreche">${icon('trash',17,'#A8473A')}</button>` : ''}
            <button class="icon-btn" id="btnCloseCreche">${icon('x',18)}</button>
          </div>
        </div>
        <div class="sheet-body">
          ${lanc ? '' : `<button type="button" class="link-btn" id="openCrecheMgr" style="color:${cat.hex}; margin-bottom:16px">Ver mês / Gerenciar</button>`}
          ${lanc ? '' : selectorHtml()}
          ${fieldsHtml()}
        </div>
        ${!fechado ? `<div class="sheet-foot">
          <button class="btn-secondary" id="btnCancelCreche">Cancelar</button>
          <button class="btn-primary" id="btnSaveCreche" ${canSave()?'':'disabled'}>${lanc?'Salvar alterações':'Registrar'}</button>
        </div>` : ''}
      </div>
    </div>`;
    wire();
  }

  function wire(){
    document.getElementById('ovCreche').addEventListener('click', e=>{ if(e.target.id==='ovCreche') closeModal(); });
    document.getElementById('btnCloseCreche').addEventListener('click', closeModal);
    const cancelBtn = document.getElementById('btnCancelCreche');
    if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
    const mgrBtn = document.getElementById('openCrecheMgr');
    if(mgrBtn) mgrBtn.addEventListener('click', ()=>{ closeModal(); openCrecheManager(); });
    if(!lanc){
      host.querySelectorAll('[data-svc]').forEach(b=> b.addEventListener('click', ()=>{
        selectedSvc = b.dataset.svc; initForm(); render();
      }));
    }
    const nomeEl = document.getElementById('f_nome');
    if(nomeEl) nomeEl.addEventListener('input', ()=>{ form.nome=nomeEl.value; syncSave(); });
    if(document.getElementById('f_data')) wireDtField('f_data', v=>{
      form.data=v;
      if(selectedSvc==='hotel'){ recalcHotelValor(); const ve=document.getElementById('f_valor'); if(ve) ve.value=form.valor; }
    });
    if(document.getElementById('f_saida')) wireDtField('f_saida', v=>{
      form.dataSaida=v; recalcHotelValor();
      const ve=document.getElementById('f_valor'); if(ve) ve.value=form.valor;
    });
    const valorEl = document.getElementById('f_valor');
    if(valorEl) valorEl.addEventListener('input', ()=>{ form.valor=valorEl.value; syncSave(); });
    const obsEl = document.getElementById('f_obs');
    if(obsEl) obsEl.addEventListener('input', ()=>{ form.obs=obsEl.value; });
    const saveBtn = document.getElementById('btnSaveCreche');
    if(saveBtn) saveBtn.addEventListener('click', save);
    const delBtn = document.getElementById('btnDelCreche');
    if(delBtn) delBtn.addEventListener('click', ()=>{
      closeModal();
      if(lanc.entryId){ openConfirmDelete(lanc.entryId); }
      else { openConfirmDeleteCrecheLanc(lanc.id); }
    });
  }

  function syncSave(){ const b=document.getElementById('btnSaveCreche'); if(b) b.disabled = !canSave(); }

  function save(){
    if(!canSave()) return;
    const valorNum = parseValorBR(form.valor);
    if(lanc){
      lanc.servicoNome = form.nome;
      lanc.valor = valorNum;
      lanc.data = form.data;
      lanc.dataSaida = selectedSvc==='hotel' ? form.dataSaida : '';
      lanc.obs = form.obs.trim();
      persistCrecheLancamentos();
      const entry = entries.find(e=> e.id===lanc.entryId);
      if(entry){ entry.title = form.nome; entry.date = new Date(form.data+'T'+ (entry.date? new Date(entry.date).toTimeString().slice(0,8) : '12:00:00')).toISOString(); persistEntries(); }
      closeModal(); renderAll();
    } else {
      const now = new Date();
      const dateIso = new Date(form.data+'T'+now.toTimeString().slice(0,8)).toISOString();
      const newLanc = { id:genId(), servicoId:selectedSvc, servicoNome:form.nome, valor:valorNum, data:form.data, dataSaida: selectedSvc==='hotel'?form.dataSaida:'', obs:form.obs.trim(), entryId:null, createdAt:Date.now() };
      const newEntry = { id:genId(), category:'creche', crecheId:newLanc.id, title:form.nome, note:'', date:dateIso, createdAt:Date.now() };
      newLanc.entryId = newEntry.id;
      crecheLancamentos.push(newLanc);
      entries.push(newEntry);
      persistCrecheLancamentos(); persistEntries();
      closeModal(); renderAll();
    }
  }

  render();
}

function openCrecheManager(){
  const host = document.getElementById('modalHost');
  const cat = CATEGORIES.creche;
  let monthKey = todayStr().slice(0,7);
  let copiedFeedback = false;

  function lancamentosDoMes(){ return crecheLancamentos.filter(l=> l.data.slice(0,7)===monthKey).sort((a,b)=> a.data.localeCompare(b.data)); }
  function totalDoMes(){ return lancamentosDoMes().reduce((s,l)=> s+l.valor, 0); }
  function fechado(){ return !!crecheFechados[monthKey]; }
  function monthLabel(){ const [y,m] = monthKey.split('-').map(Number); return fmtMonthYear(new Date(y, m-1, 1)); }
  function shiftMonth(delta){ const [y,m] = monthKey.split('-').map(Number); const d = new Date(y, m-1+delta, 1); monthKey = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
  function fmtDDMM(ds){ const [,m,d] = ds.split('-'); return `${d}/${m}`; }

  function resumoTexto(){
    const list = lancamentosDoMes();
    const linhas = list.map(l=>{
      const periodo = l.dataSaida ? `${fmtDDMM(l.data)} a ${fmtDDMM(l.dataSaida)}` : fmtDDMM(l.data);
      const obs = l.obs ? ` - ${l.obs}` : '';
      const valorTxt = l.valor ? `R$ ${fmtValorBR(l.valor)}` : 'valor pendente';
      return `${periodo} - ${l.servicoNome}: ${valorTxt}${obs}`;
    });
    return `${monthLabel()}\n${linhas.join('\n')}\n\nTotal: R$ ${fmtValorBR(totalDoMes())}`;
  }

  function itemHtml(l){
    const periodo = l.dataSaida ? `${fmtDDMM(l.data)} a ${fmtDDMM(l.dataSaida)}` : '';
    const valorHtml = l.valor ? `R$ ${fmtValorBR(l.valor)}` : `<span class="badge" style="background:${cat.bgHex}; color:${cat.hex}">sem valor</span>`;
    return `<div><div class="name">${esc(l.servicoNome)}${l.obs?' · '+esc(l.obs):''}</div>${periodo?`<div class="sub">${periodo}</div>`:''}</div>
      <div style="font-weight:600; font-size:.85rem; flex-shrink:0; margin-left:10px">${valorHtml}</div>`;
  }

  function groupByDate(list){
    const groups = [];
    for(const l of list){
      let g = groups.find(g=> g.data===l.data);
      if(!g){ g = {data:l.data, items:[]}; groups.push(g); }
      g.items.push(l);
    }
    return groups;
  }

  function groupCardHtml(g){
    const rows = g.items.map((l,idx)=> `<div class="manager-item" data-open="${l.id}" style="cursor:pointer; margin-bottom:0; background:none; padding:8px 0; ${idx<g.items.length-1?'border-bottom:1px solid rgba(0,0,0,.05)':''}">${itemHtml(l)}</div>`).join('');
    return `<div class="manager-item" style="flex-direction:column; align-items:stretch; padding:4px 12px">
      <div class="hint" style="font-weight:600; margin-top:6px">${fmtDDMM(g.data)}</div>
      ${rows}
    </div>`;
  }

  function precosHtml(){
    return crecheServicos.map(s=> `<div class="field" style="margin-bottom:8px">
      <label>${esc(s.nome)}${s.id==='hotel'?' (por diária)':''}</label>
      <input inputmode="decimal" data-preco="${s.id}" value="${fmtValorBR(s.valor)}"/>
    </div>`).join('');
  }

  function render(){
    const list = lancamentosDoMes();
    const fech = fechado();
    host.innerHTML = `<div class="overlay" id="ovCrMgr">
      <div class="sheet" style="max-height:90vh">
        <div class="sheet-head">
          <div class="sheet-title" style="color:${cat.hex}">${icon(cat.icon,17,cat.hex)}<span style="color:var(--ink)">Gerenciar creche</span></div>
          <button class="icon-btn" id="btnCloseMgr">${icon('x',18)}</button>
        </div>
        <div class="sheet-body">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px">
            <button class="icon-btn" id="prevMonth">${icon('chevronLeft',16)}</button>
            <div style="font-weight:600; font-size:.9rem">${monthLabel()}</div>
            <button class="icon-btn" id="nextMonth">${icon('chevronRight',16)}</button>
          </div>
          <div style="text-align:center; margin-bottom:18px">
            <div class="hint" style="text-transform:uppercase; letter-spacing:.03em">${fech?'Total do mês (pago)':'Total do mês'}</div>
            <div class="display" style="font-size:1.6rem; font-weight:700; margin-top:2px">R$ ${fmtValorBR(totalDoMes())}</div>
          </div>
          ${list.length? groupByDate(list).map(groupCardHtml).join('') : '<div class="hint" style="text-align:center; padding:10px 0 18px">Nada lançado neste mês.</div>'}
          <div style="display:flex; gap:8px; margin:16px 0">
            <button class="btn-secondary" id="btnCopiarResumo" style="flex:1">${copiedFeedback?'Copiado!':'Copiar resumo'}</button>
            <button class="${fech?'btn-secondary':'btn-primary'}" id="btnToggleFechado" style="flex:1">${fech?'Reabrir mês':'Fechar mês'}</button>
          </div>
          <div class="month-label" style="margin:22px 0 10px">Preços padrão</div>
          ${precosHtml()}
        </div>
      </div>
    </div>`;
    wire();
  }

  function wire(){
    document.getElementById('ovCrMgr').addEventListener('click', e=>{ if(e.target.id==='ovCrMgr') closeModal(); });
    document.getElementById('btnCloseMgr').addEventListener('click', closeModal);
    document.getElementById('prevMonth').addEventListener('click', ()=>{ shiftMonth(-1); copiedFeedback=false; render(); });
    document.getElementById('nextMonth').addEventListener('click', ()=>{ shiftMonth(1); copiedFeedback=false; render(); });
    host.querySelectorAll('[data-open]').forEach(row=> row.addEventListener('click', ()=>{
      const lanc = crecheLancamentos.find(l=> l.id===row.dataset.open);
      if(lanc){ closeModal(); openCrecheModal(lanc); }
    }));
    document.getElementById('btnCopiarResumo').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(resumoTexto());
        copiedFeedback = true; render();
        setTimeout(()=>{ copiedFeedback=false; const b=document.getElementById('btnCopiarResumo'); if(b) b.textContent='Copiar resumo'; }, 2000);
      }catch(err){ showWarning('Não consegui copiar. Tente novamente.'); }
    });
    document.getElementById('btnToggleFechado').addEventListener('click', ()=>{
      if(fechado()) delete crecheFechados[monthKey]; else crecheFechados[monthKey] = true;
      persistCrecheFechados(); render();
    });
    host.querySelectorAll('[data-preco]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const s = crecheServicos.find(x=>x.id===inp.dataset.preco);
        if(s){ s.valor = parseValorBR(inp.value); persistCrecheServicos(); inp.value = fmtValorBR(s.valor); }
      });
    });
  }

  render();
}

function openReport(){
  const host = document.getElementById('modalHost');
  let start = (()=>{ const d=new Date(); d.setDate(d.getDate()-29); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; })();
  let end = todayStr();

  function dayKeyOf(iso){ const d=new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function dateRangeArray(s,e){
    const out=[]; let cur=new Date(s+'T00:00:00'); const endD=new Date(e+'T00:00:00');
    while(cur<=endD){ out.push(dayKeyOf(cur.toISOString())); cur.setDate(cur.getDate()+1); }
    return out.reverse();
  }
  function fmtLongDate(ds){
    const [y,m,d] = ds.split('-');
    const wd = new Date(ds+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    return `${d}/${m}/${y} · ${wd}`;
  }

  function renderPicker(){
    host.innerHTML = `<div class="overlay" id="ovRep">
      <div class="sheet">
        <div class="sheet-head"><div class="sheet-title">Gerar relatório</div><button class="icon-btn" id="closeRep">${icon('x',18)}</button></div>
        <div class="sheet-body">
          <div class="field"><label>De</label>${dtField('rep_start','date',start)}</div>
          <div class="field"><label>Até</label>${dtField('rep_end','date',end)}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="genRepBtn">Gerar relatório</button></div>
      </div>
    </div>`;
    document.getElementById('ovRep').addEventListener('click', e=>{ if(e.target.id==='ovRep') closeModal(); });
    document.getElementById('closeRep').addEventListener('click', closeModal);
    wireDtField('rep_start', v=> start=v);
    wireDtField('rep_end', v=> end=v);
    document.getElementById('genRepBtn').addEventListener('click', ()=>{
      if(!start || !end || start>end){ showWarning('Confira as datas selecionadas.'); return; }
      renderDoc();
    });
  }

  function weightSectionHtml(pesoEntries){
    if(pesoEntries.length===0) return `<p class="rep-small">Sem registro de peso no período.</p>`;
    if(pesoEntries.length===1){
      const e = pesoEntries[0];
      return `<p style="font-size:.85rem; margin:0">Último registro: <b>${e.value} kg</b> (${fmtDateShort(dayKeyOf(e.date))})</p>`;
    }
    // 2+ pontos: grafico de linha em SVG simples, sem biblioteca nenhuma
    const W=540, H=140, PAD=28;
    const vals = pesoEntries.map(e=>e.value);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const stepX = (W-PAD*2) / (pesoEntries.length-1);
    const pts = pesoEntries.map((e,i)=>{
      const x = PAD + i*stepX;
      const y = H-PAD - ((e.value-min)/range) * (H-PAD*2);
      return {x,y,e};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const dots = pts.map(p=> `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="#151515"/><text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" font-size="9" text-anchor="middle" fill="#151515">${p.e.value}</text>`).join('');
    const labels = pts.map((p,i)=> (i===0||i===pts.length-1) ? `<text x="${p.x.toFixed(1)}" y="${H-6}" font-size="8" text-anchor="middle" fill="#5A5A5A">${fmtDateShort(dayKeyOf(p.e.date))}</text>` : '').join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto"><path d="${path}" fill="none" stroke="#151515" stroke-width="1.4"/>${dots}${labels}</svg>`;
  }

  function renderDoc(){
    const days = dateRangeArray(start,end);
    const inRange = entries.filter(e=> { const ds=dayKeyOf(e.date); return ds>=start && ds<=end; });
    const pesoEntries = inRange.filter(e=>e.category==='peso').slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
    const continuos = meds.filter(m=> m.tipo==='continuo');

    const medRows = meds.slice().sort(sortMedsByName).map(m=>{
      const horarios = m.tipo==='sob-demanda'
        ? (m.dose ? `conforme necessário — ${esc(m.dose)}` : 'conforme necessário')
        : ((m.horarios&&m.horarios.length)? m.horarios.map(h=> `${h.time}${h.dose?' — '+esc(h.dose):''}`).join('<br/>') : '—');
      const duracao = m.tipo==='continuo'?'Contínuo' : m.tipo==='sob-demanda'?'Sob demanda' : `Pontual (${fmtDateShort(m.dataInicio)} a ${fmtDateShort(m.dataFim)})`;
      return `<tr><td>${esc(m.name)}</td><td>${horarios}</td><td>${duracao}</td></tr>`;
    }).join('');

    const dayBlocks = days.map(ds=>{
      const dayEntries = inRange.filter(e=> dayKeyOf(e.date)===ds);
      if(dayEntries.length===0) return '';
      const remedios = [...new Set(dayEntries.filter(e=>e.category==='remedio').map(e=>e.title))];
      const givenSlots = new Set(dayEntries.filter(e=>e.category==='remedio' && e.medId).map(e=> e.medId+'|'+(e.horarioSlot||'')));
      const naoAdmin = [];
      continuos.forEach(m=>{
        const horarios = (m.horarios&&m.horarios.length) ? m.horarios : [{time:'', dose:''}];
        horarios.forEach(h=>{
          if(!givenSlots.has(m.id+'|'+h.time)) naoAdmin.push(h.time ? `${m.name} (${h.time})` : m.name);
        });
      });
      const alimentacao = dayEntries.filter(e=>e.category==='alimentacao')
        .map(e=> `${fmtTime(e.date)} — ${esc(e.title)}${entrySubtitle(e)?` (${esc(entrySubtitle(e))})`:''}`).join('<br/>');
      const interc = dayEntries.filter(e=>e.category==='intercorrencia')
        .map(e=> `${fmtTime(e.date)} — ${esc(e.title)}${e.gravidade?` (${e.gravidade})`:''}${e.note?`: "${esc(e.note)}"`:''}`).join('<br/>');
      const proc = dayEntries.filter(e=> ['procedimento','consulta','exame'].includes(e.category))
        .map(e=>{
          const catLabel = {procedimento:'Procedimento',consulta:'Consulta',exame:'Exame'}[e.category];
          let extra = e.clinica || (e.category==='exame'?e.tipoExame:'') || '';
          return `${fmtTime(e.date)} — ${catLabel}: ${esc(e.title)}${extra?` (${esc(extra)})`:''}${e.note?` — ${esc(e.note)}`:''}`;
        }).join('<br/>');

      let rows = `<div class="rep-day-row"><div class="rep-day-label">Remédios</div><div class="rep-day-val">${remedios.length?esc(remedios.join(', ')):'—'}</div></div>`;
      if(naoAdmin.length) rows += `<div class="rep-day-row"><div class="rep-day-label">Não administrados</div><div class="rep-day-val">${esc(naoAdmin.join(', '))}</div></div>`;
      rows += `<div class="rep-day-row"><div class="rep-day-label">Alimentação</div><div class="rep-day-val">${alimentacao||'Sem registro'}</div></div>`;
      if(interc) rows += `<div class="rep-day-row"><div class="rep-day-label">Intercorrência</div><div class="rep-day-val">${interc}</div></div>`;
      if(proc) rows += `<div class="rep-day-row"><div class="rep-day-label">Procedimento</div><div class="rep-day-val">${proc}</div></div>`;

      return `<div class="rep-day">
        <div class="rep-day-row" style="background:#E1E7E2; color:#151515; border-bottom:none"><div style="padding:4px 6px; font-size:.7rem; font-weight:700">${fmtLongDate(ds)}</div></div>
        ${rows}
      </div>`;
    }).join('');

    const nascStr = settings.birthdate ? fmtDateShort(settings.birthdate) + ` (${ageText()})` : '—';
    const linkHtml = settings.sheetLink ? `<p style="font-size:.82rem; margin:0"><a href="${esc(settings.sheetLink)}" target="_blank" rel="noreferrer" style="color:#151515; font-weight:700">Clique para ver o histórico dos exames de sangue</a></p>` : '';

    host.innerHTML = `<div class="rep-overlay" id="repDocHost">
      <div class="rep-bar">
        <button class="icon-btn" id="repBack">${icon('x',18)}</button>
        <button class="btn-primary" id="repPrint" style="padding:8px 16px; font-size:.8rem">Imprimir / Salvar PDF</button>
      </div>
      <div class="rep-doc">
        <h1 class="rep-h1">Relatório de saúde — Otto</h1>
        <p class="rep-sub">${esc(settings.raca||'—')} · Nascimento: ${nascStr} · Período: ${fmtDateShort(start)} a ${fmtDateShort(end)}</p>
        <hr class="rep-hr"/>
        <div class="rep-h2">Peso</div>
        ${weightSectionHtml(pesoEntries)}
        <div class="rep-h2">Medicações utilizadas</div>
        <table class="rep-table"><tr><th>Medicação</th><th>Horários e posologia</th><th>Duração</th></tr>${medRows || '<tr><td colspan="3">Nenhuma cadastrada</td></tr>'}</table>
        <div class="rep-h2">Exames</div>
        ${linkHtml || '<p class="rep-small">Nenhum link cadastrado.</p>'}
        <div class="rep-h2 rep-daily-start">Registro diário</div>
        ${dayBlocks || '<p class="rep-small">Nenhum registro no período.</p>'}
      </div>
    </div>`;
    document.getElementById('repBack').addEventListener('click', closeModal);
    document.getElementById('repPrint').addEventListener('click', ()=> window.print());
  }

  renderPicker();
}

            <button type="button" id="manageMedsBtn" class="btn-secondary" style="flex:1; font-size:.82rem; padding:11px 8px">Gerenciar remédios</button>
            <button type="button" id="reportBtn" class="btn-secondary" style="flex:1; font-size:.82rem; padding:11px 8px">Gerar relatório</button>
          </div>
          <div style="display:flex; gap:10px; padding-top:10px">
            <button type="button" id="importBtn" class="btn-secondary" style="flex:1; font-size:.82rem; padding:11px 8px">Restaurar backup</button>
            <input type="file" id="importFileInput" accept="application/json" style="display:none"/>
          </div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="saveSet" ${saving?'disabled':''}>${saving?'Salvando...':'Salvar'}</button></div>
      </div>
    </div>`;
    const racaEl = document.getElementById('racaInput'); racaEl.addEventListener('input', e=> draftRaca=e.target.value);
    const sexoEl = document.getElementById('sexoInput'); sexoEl.addEventListener('change', e=> draftSexo=e.target.value);
    wireDtField('birthdateInput', v=> draftBirthdate=v);
    const linkEl = document.getElementById('linkInput'); linkEl.addEventListener('input', e=> draftSheetLink=e.target.value);
    const crecheLinkEl = document.getElementById('crecheLinkInput'); crecheLinkEl.addEventListener('input', e=> draftCrecheLink=e.target.value);
    const importFileEl = document.getElementById('importFileInput');
    document.getElementById('manageMedsBtn').addEventListener('click', ()=> openMedManager(()=> openSettings()));
    document.getElementById('reportBtn').addEventListener('click', ()=> openReport());
    document.getElementById('importBtn').addEventListener('click', ()=> importFileEl.click());
    importFileEl.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(!confirm('Isso substitui todos os dados atuais pelos do arquivo de backup. Continuar?')) { importFileEl.value=''; return; }
      await importBackup(file);
      importFileEl.value = '';
    });
    document.getElementById('ovSet').addEventListener('click', e=>{ if(e.target.id==='ovSet' && !saving) closeModal(); });
    document.getElementById('closeSet').addEventListener('click', ()=>{ if(!saving) closeModal(); });

    const addBtn = document.getElementById('addProfilePhotoBtn');
    const input = document.getElementById('profilePhotoInput');
    const removeBtn = document.getElementById('removeProfilePhoto');
    const thumb = document.getElementById('profileThumb');
    if(addBtn && input) addBtn.addEventListener('click', ()=> input.click());
    if(input) input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        draftPhotoBlob = await resizeImageFile(file, 1200, 0.85);
        draftPhotoUrl = URL.createObjectURL(draftPhotoBlob);
        removedPhoto = false;
      }catch(err){
        console.error('Erro ao processar foto', err);
        showWarning('Não consegui processar essa foto. Tenta outra.');
      }
      render();
    });
    if(removeBtn) removeBtn.addEventListener('click', ()=>{ draftPhotoUrl=''; draftPhotoBlob=null; removedPhoto=true; render(); });
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(draftPhotoUrl));

    document.getElementById('saveSet').addEventListener('click', async ()=>{
      saving = true; render();
      settings.sheetLink = draftSheetLink.trim();
      settings.crecheLink = draftCrecheLink.trim();
      settings.birthdate = draftBirthdate;
      settings.raca = draftRaca.trim();
      settings.sexo = draftSexo;
      if(draftPhotoBlob){
        const newId = genId();
        try{
          await idbPutPhoto(newId, draftPhotoBlob);
          if(settings.profilePhotoId) idbDeletePhoto(settings.profilePhotoId).catch(()=>{});
          settings.profilePhotoId = newId;
        }catch(err){
          console.error('Erro ao salvar foto do Otto', err);
          showWarning('Não consegui salvar a foto, mas o resto foi salvo.');
        }
      } else if(removedPhoto && settings.profilePhotoId){
        idbDeletePhoto(settings.profilePhotoId).catch(()=>{});
        settings.profilePhotoId = '';
      }
      persistSettings();
      closeModal();
      await loadProfilePhoto();
    });
  }
  render();
}

// ================= FOOD MANAGER =================
function openFoodManager(onDone){
  const host = document.getElementById('modalHost');
  let list = foods.slice();
  let editingId = null;
  let draftName = '';
  let draftReceita = '';

  function render(){
    host.innerHTML = `<div class="overlay" id="ovFood">
      <div class="sheet" style="max-height:90%">
        <div class="sheet-head"><div class="sheet-title">Meus alimentos</div><button class="icon-btn" id="closeFood">${icon('x',18)}</button></div>
        <div class="sheet-body">
          ${editingId? `<div class="hint" style="margin-bottom:8px; font-weight:600; color:${CATEGORIES.alimentacao.hex}">Editando</div>` : ''}
          <div class="field"><label>Nome curto</label><input id="foodNameInput" value="${esc(draftName)}" placeholder="ex: Ração seca, Frango com arroz..." style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid #E5E0D4; font-size:16px; background:#FBFAF7; font-family:inherit; box-sizing:border-box"/></div>
          <div class="field"><label>Receita completa (opcional)</label><textarea id="foodRecipeInput" placeholder="ex: 100g frango cozido + 50g abóbora + 1 colher de óleo de linhaça..." style="min-height:80px">${esc(draftReceita)}</textarea></div>
          <div style="display:flex; gap:8px; margin-bottom:14px">
            ${editingId? `<button id="cancelFoodBtn" class="btn-secondary" style="flex:1">Cancelar</button>` : ''}
            <button id="addFoodBtn" style="flex:1; border:none; border-radius:12px; padding:12px; background:${CATEGORIES.alimentacao.hex}; color:#fff; font-weight:600; font-size:.85rem">${editingId?'Salvar':'Adicionar alimento'}</button>
          </div>
          <div id="foodList">${list.map(f=>`
            <div class="manager-item" data-open="${f.id}" style="cursor:pointer">
              <span class="name">${esc(f.name)}</span>
              <button class="del-btn" data-id="${f.id}">${icon('trash',14,'var(--ink-muted)')}</button>
            </div>`).join('') || '<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>'}</div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneFoodBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovFood').addEventListener('click', e=>{ if(e.target.id==='ovFood') finish(); });
    document.getElementById('closeFood').addEventListener('click', finish);
    document.getElementById('doneFoodBtn').addEventListener('click', finish);
    document.getElementById('addFoodBtn').addEventListener('click', saveFood);
    document.getElementById('foodNameInput').addEventListener('input', e=> draftName=e.target.value);
    document.getElementById('foodRecipeInput').addEventListener('input', e=> draftReceita=e.target.value);
    document.getElementById('foodNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveFood(); } });
    const cancelBtn = document.getElementById('cancelFoodBtn'); if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingId=null; draftName=''; draftReceita=''; render(); });
    document.querySelectorAll('#foodList .del-btn').forEach(b=> b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      list = list.filter(f=>f.id!==b.dataset.id);
      if(editingId===b.dataset.id){ editingId=null; draftName=''; draftReceita=''; }
      render();
    }));
    document.querySelectorAll('#foodList .manager-item').forEach((row, idx)=> row.addEventListener('click', ()=>{
      const f = list[idx];
      if(!f) return;
      editingId = f.id;
      draftName = f.name;
      draftReceita = f.receita || '';
      render();
    }));
  }
  function saveFood(){
    const n = draftName.trim();
    if(!n) return;
    const duplicate = list.some(f=> normalizeSearch(f.name)===normalizeSearch(n) && f.id!==editingId);
    if(duplicate){ showWarning(`"${n}" já está cadastrado.`); return; }
    if(editingId){
      list = list.map(f=> f.id===editingId ? { ...f, name:n, receita:draftReceita.trim() } : f);
    } else {
      list.push({id:genId(), name:n, receita: draftReceita.trim()});
    }
    editingId=null; draftName=''; draftReceita='';
    render();
  }
  function finish(){
    foods = list;
    persistFoods();
    closeModal();
    if(onDone) onDone();
  }
  render();
}

// ================= MED MANAGER =================
function openMedManager(onDone, jumpToId, startAdding){
  const host = document.getElementById('modalHost');
  let list = meds.slice();
  let adding = false;
  let editingId = null;
  let draft = {name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horarios:[], pausadoDesde:'', encerradoEm:''};
  let submitting = false;
  let confirmingDeleteId = null;
  let confirmingEncerrar = false;
  let isNewDraft = false;

  if(jumpToId){
    const m = list.find(x=>x.id===jumpToId);
    if(m){
      editingId = m.id;
      adding = true;
      isNewDraft = false;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horarios:(m.horarios||[]).map(h=>({...h})), pausadoDesde:m.pausadoDesde||'', encerradoEm:m.encerradoEm||'' };
    }
  } else if(startAdding){
    adding = true;
  }

  function medSubLabel(m){
    if(m.tipo==='sob-demanda') return 'Sob demanda' + (m.dose?' · '+esc(m.dose):'');
    const horarios = (m.horarios&&m.horarios.length) ? m.horarios.map(h=> `${h.time}${h.dose?' ('+esc(h.dose)+')':''}`).join(', ') : (m.dose ? esc(m.dose) : '');
    if(m.tipo==='continuo' && m.encerradoEm) return `Contínuo · Encerrado em ${fmtDateShort(m.encerradoEm)}`;
    if(m.tipo==='continuo' && m.pausadoDesde) return `Contínuo · Pausado desde ${fmtDateShort(m.pausadoDesde)}${horarios?' · '+horarios:''}`;
    return `${m.tipo==='continuo'?'Contínuo':`Pontual · ${fmtDateShort(m.dataInicio)} a ${fmtDateShort(m.dataFim)}`}${horarios?' · '+horarios:''}`;
  }

  function render(){
    submitting = false;
    const scheduled = list.filter(m=> m.tipo!=='sob-demanda').sort(sortMedsByName);
    const onDemand = list.filter(m=> m.tipo==='sob-demanda').sort(sortMedsByName);
    const itemHtml = m=> `<div class="manager-item" data-open="${m.id}" style="cursor:pointer; ${(m.pausadoDesde||m.encerradoEm)?'opacity:.55':''}"><div><div class="name">${esc(m.name)}</div><div class="sub">${medSubLabel(m)}</div></div><button class="del-btn" data-id="${m.id}">${icon('trash',14,'var(--ink-muted)')}</button></div>`;
    host.innerHTML = `<div class="overlay" id="ovMed">
      <div class="sheet" style="max-height:90vh">
        <div class="sheet-head"><div class="sheet-title">Remédios atuais</div></div>
        <div class="sheet-body">
          <div id="addArea"></div>
          <div id="medList" style="${adding?'display:none':''}">
            ${scheduled.length? `<div class="hint" style="font-weight:600; margin:10px 0 6px">Horário fixo</div>${scheduled.map(itemHtml).join('')}` : ''}
            ${onDemand.length? `<div class="hint" style="font-weight:600; margin:14px 0 6px">Sob demanda</div>${onDemand.map(itemHtml).join('')}` : ''}
            ${list.length===0 && !adding? '<div class="hint" style="text-align:center; padding:16px 0">Nada cadastrado ainda.</div>' : ''}
          </div>
        </div>
        <div class="sheet-foot"><button class="btn-primary" id="doneMedBtn">Pronto</button></div>
      </div>
    </div>`;
    document.getElementById('ovMed').addEventListener('click', e=>{ if(e.target.id==='ovMed') finish(); });
    document.getElementById('doneMedBtn').addEventListener('click', finish);
    document.querySelectorAll('#medList .del-btn').forEach(b=> b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const m = list.find(x=>x.id===b.dataset.id);
      if(!m) return;
      editingId = m.id;
      adding = true;
      isNewDraft = false;
      confirmingDeleteId = m.id;
      confirmingEncerrar = false;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horarios:(m.horarios||[]).map(h=>({...h})), pausadoDesde:m.pausadoDesde||'', encerradoEm:m.encerradoEm||'' };
      syncMedListVisibility();
      renderAddArea();
      document.getElementById('addArea').scrollIntoView({behavior:'smooth', block:'center'});
    }));
    document.querySelectorAll('#medList .manager-item').forEach(row=> row.addEventListener('click', ()=>{
      const m = list.find(x=>x.id===row.dataset.open);
      if(!m) return;
      editingId = m.id;
      adding = true;
      isNewDraft = false;
      confirmingDeleteId = null;
      confirmingEncerrar = false;
      draft = { name:m.name, tipo:m.tipo, dataInicio:m.dataInicio||todayStr(), dataFim:m.dataFim||'', dose:m.dose||'', horarios:(m.horarios||[]).map(h=>({...h})), pausadoDesde:m.pausadoDesde||'', encerradoEm:m.encerradoEm||'' };
      syncMedListVisibility();
      renderAddArea();
      document.getElementById('addArea').scrollIntoView({behavior:'smooth', block:'center'});
    }));
    renderAddArea();
  }

  function syncMedListVisibility(){
    const el = document.getElementById('medList');
    if(el) el.style.display = adding ? 'none' : '';
  }

  // Se tiver hora/dose digitada mas ainda não comprometida na lista (ex: dose
  // ainda com foco quando a pessoa aperta Adicionar/Pronto direto), garante
  // que não fica perdida.
  function flushPendingHorario(){
    const t = document.getElementById('d_horario_new');
    if(!t) return;
    const v = t.value;
    if(!v) return;
    const doseEl = document.getElementById('d_horario_dose');
    const doseVal = ((doseEl && doseEl.value) || '').trim();
    if(draft.horarios.some(h=>h.time===v)){
      draft.horarios = draft.horarios.map(h=> h.time===v ? {time:v, dose:doseVal} : h);
    } else {
      draft.horarios.push({time:v, dose:doseVal});
    }
    draft.horarios.sort((a,b)=> a.time.localeCompare(b.time));
  }

  // Salva ao vivo: toda mudança em qualquer campo já reflete na lista. Sem
  // nome ainda não existe remédio de fato, então não cria nada até ter nome;
  // se o nome for apagado de novo, remove o rascunho fantasma.
  function syncDraftToList(){
    const n = draft.name.trim();
    if(!editingId){
      if(!n) return;
      editingId = genId();
      isNewDraft = true;
      list.push({ id: editingId, name:'', tipo:draft.tipo, dataInicio:'', dataFim:'', dose:'', horarios:[] });
    }
    if(!n){
      if(isNewDraft){
        list = list.filter(m=> m.id!==editingId);
        editingId = null;
      }
      // remédio já existente: não apaga, só não atualiza até ter um nome de novo
      return;
    }
    const payload = {
      name:n, tipo:draft.tipo,
      dataInicio: draft.tipo==='pontual'?draft.dataInicio:'',
      dataFim: draft.tipo==='pontual'?draft.dataFim:'',
      dose: draft.tipo==='sob-demanda' ? draft.dose.trim() : '',
      horarios: (draft.tipo==='continuo'||draft.tipo==='pontual') ? draft.horarios.map(h=>({...h})) : [],
      pausadoDesde: draft.tipo==='continuo' ? (draft.pausadoDesde||'') : '',
      encerradoEm: draft.encerradoEm||''
    };
    list = list.map(m=> m.id===editingId ? { ...m, ...payload } : m);
  }

  function renderAddArea(){
    const area = document.getElementById('addArea');
    if(!adding){
      area.innerHTML = `<button type="button" class="link-btn" id="startAdd" style="color:${CATEGORIES.remedio.hex}; margin-bottom:14px">+ Cadastrar remédio</button>`;
      document.getElementById('startAdd').addEventListener('click', ()=>{
        adding=true; editingId=null; confirmingDeleteId=null; confirmingEncerrar=false;
        draft={name:'', tipo:'continuo', dataInicio:todayStr(), dataFim:'', dose:'', horarios:[], pausadoDesde:'', encerradoEm:''};
        syncMedListVisibility(); renderAddArea();
      });
      return;
    }
    const isScheduled = draft.tipo==='continuo' || draft.tipo==='pontual';
    area.innerHTML = `<div class="add-form">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px">
        <button type="button" id="backToList" style="background:none; border:none; padding:0; font-family:inherit; font-size:.82rem; color:var(--ink-muted); cursor:pointer">‹ Remédios</button>
        ${editingId? `<button type="button" id="deleteMedBtn" style="background:none; border:none; padding:4px; display:flex; color:#B3261E; cursor:pointer">${icon('trash',16,'#B3261E')}</button>` : ''}
      </div>
      <div class="field"><label>Nome do remédio</label><input id="d_name" autocomplete="off" value="${esc(draft.name)}" placeholder="ex: Omeprazol"/></div>
      <div class="field"><label>Tipo</label><div class="tipo-toggle">
        <button data-tipo="continuo" class="${draft.tipo==='continuo'?'sel':''}">Contínuo</button>
        <button data-tipo="pontual" class="${draft.tipo==='pontual'?'sel':''}">Pontual (início e fim)</button>
        <button data-tipo="sob-demanda" class="${draft.tipo==='sob-demanda'?'sel':''}">Sob demanda</button>
      </div></div>
      ${(editingId && !isNewDraft && draft.tipo==='continuo' && !draft.encerradoEm) ? `
        <button type="button" id="togglePauseBtn" class="btn-secondary" style="width:100%; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:14px">${draft.pausadoDesde? icon('play',14)+' Retomar' : icon('pause',14)+' Pausar'}</button>
      ` : ''}
      ${draft.encerradoEm? `<div class="hint" style="margin:-6px 0 14px">Encerrado em ${fmtDateShort(draft.encerradoEm)}.</div>` : ''}
      ${draft.tipo==='pontual'? `
        <div class="field"><label>Início</label>${dtField('d_inicio','date',draft.dataInicio)}</div>
        <div class="field"><label>Fim</label>${dtField('d_fim','date',draft.dataFim)}</div>
      ` : ''}
      ${!isScheduled? `<div class="field"><label>Dose / instruções (opcional)</label><input id="d_dose" autocomplete="off" value="${esc(draft.dose)}" placeholder="ex: 1 comprimido"/></div>` : ''}
      ${isScheduled? `<div class="field"><label>Horários e posologia</label>
        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px">
          ${draft.horarios.map((h,i)=>`<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; background:${CATEGORIES.remedio.hex}18; border-radius:8px; padding:7px 8px 7px 12px">
            <span style="font-size:.85rem; font-weight:600; color:${CATEGORIES.remedio.hex}">${h.time}${h.dose?' · '+esc(h.dose):''}</span>
            <button type="button" data-rm-horario="${i}" style="background:none; border:none; padding:2px; display:flex; color:${CATEGORIES.remedio.hex}">${icon('x',13,CATEGORIES.remedio.hex)}</button>
          </div>`).join('')}
        </div>
        <div style="display:flex; gap:8px; align-items:flex-end">
          <div style="flex:1">${dtField('d_horario_new','time','')}</div>
          <div style="flex:1"><input id="d_horario_dose" autocomplete="off" placeholder="dose (opcional)" style="width:100%; padding:11px 12px; border-radius:10px; border:1px solid #E5E0D4; font-family:inherit; font-size:16px; box-sizing:border-box"/></div>
        </div>
      </div>` : ''}
      ${nameConflict()? `<div class="hint" style="color:#B3261E; margin-top:-6px">Já existe um remédio chamado "${esc(draft.name.trim())}".</div>` : ''}
      ${(editingId && !isNewDraft && draft.tipo==='continuo' && !draft.encerradoEm) ? `<button type="button" class="link-btn" id="encerrarMedBtn" style="color:var(--ink-muted); margin-top:6px">Encerrar este remédio</button>` : ''}
      ${confirmingEncerrar? `
        <div style="background:#F1EEE6; border-radius:10px; padding:10px 12px; margin-top:10px; display:flex; flex-direction:column; gap:8px">
          <span style="font-size:.82rem; color:var(--ink)">Isso encerra "${esc(draft.name)}" hoje. Pra retomar depois, você cadastra ele de novo. Confirmar?</span>
          <div style="display:flex; gap:6px; justify-content:flex-end">
            <button type="button" id="cancelEncerrarBtn" style="background:none; border:none; padding:5px 8px; font-family:inherit; font-size:.78rem; color:var(--ink-muted); cursor:pointer">Cancelar</button>
            <button type="button" id="confirmEncerrarBtn" style="background:var(--ink); color:#fff; border:none; border-radius:7px; padding:5px 10px; font-family:inherit; font-size:.78rem; font-weight:600; cursor:pointer">Encerrar</button>
          </div>
        </div>
      ` : ''}
      ${editingId && confirmingDeleteId===editingId? `
        <div style="background:#FBEAE9; border-radius:10px; padding:10px 12px; margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:8px">
          <span style="font-size:.82rem; color:#B3261E">Excluir "${esc(draft.name)}"?</span>
          <div style="display:flex; gap:6px; flex-shrink:0">
            <button type="button" id="cancelDeleteMedBtn" style="background:none; border:none; padding:5px 8px; font-family:inherit; font-size:.78rem; color:var(--ink-muted); cursor:pointer">Cancelar</button>
            <button type="button" id="confirmDeleteMedBtn" style="background:#B3261E; color:#fff; border:none; border-radius:7px; padding:5px 10px; font-family:inherit; font-size:.78rem; font-weight:600; cursor:pointer">Excluir</button>
          </div>
        </div>
      ` : ''}
    </div>`;
    document.getElementById('backToList').addEventListener('click', ()=>{ flushPendingHorario(); syncDraftToList(); adding=false; confirmingDeleteId=null; confirmingEncerrar=false; syncMedListVisibility(); render(); });
    document.getElementById('d_name').addEventListener('input', e=>{ draft.name=e.target.value; syncDraftToList(); refreshInlineOnly(); });
    const deleteBtn = document.getElementById('deleteMedBtn');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{ confirmingDeleteId = editingId; confirmingEncerrar=false; renderAddArea(); });
    const cancelDeleteBtn = document.getElementById('cancelDeleteMedBtn');
    if(cancelDeleteBtn) cancelDeleteBtn.addEventListener('click', ()=>{ confirmingDeleteId = null; renderAddArea(); });
    const confirmDeleteBtn = document.getElementById('confirmDeleteMedBtn');
    if(confirmDeleteBtn) confirmDeleteBtn.addEventListener('click', ()=>{
      list = list.filter(m=> m.id!==editingId);
      adding=false; editingId=null; confirmingDeleteId=null;
      render();
    });
    document.querySelectorAll('[data-tipo]').forEach(b=> b.addEventListener('click', ()=>{ draft.tipo=b.dataset.tipo; syncDraftToList(); renderAddArea(); }));
    const togglePauseBtn = document.getElementById('togglePauseBtn');
    if(togglePauseBtn) togglePauseBtn.addEventListener('click', ()=>{
      draft.pausadoDesde = draft.pausadoDesde ? '' : todayStr();
      syncDraftToList();
      renderAddArea();
    });
    const encerrarBtn = document.getElementById('encerrarMedBtn');
    if(encerrarBtn) encerrarBtn.addEventListener('click', ()=>{ confirmingEncerrar = true; confirmingDeleteId=null; renderAddArea(); });
    const cancelEncerrarBtn = document.getElementById('cancelEncerrarBtn');
    if(cancelEncerrarBtn) cancelEncerrarBtn.addEventListener('click', ()=>{ confirmingEncerrar = false; renderAddArea(); });
    const confirmEncerrarBtn = document.getElementById('confirmEncerrarBtn');
    if(confirmEncerrarBtn) confirmEncerrarBtn.addEventListener('click', ()=>{
      draft.encerradoEm = todayStr();
      draft.pausadoDesde = '';
      confirmingEncerrar = false;
      syncDraftToList();
      renderAddArea();
    });
    wireDtField('d_inicio', v=>{ draft.dataInicio=v; syncDraftToList(); });
    wireDtField('d_fim', v=>{ draft.dataFim=v; syncDraftToList(); });
    const doseInput = document.getElementById('d_dose');
    if(doseInput) doseInput.addEventListener('input', e=>{ draft.dose=e.target.value; syncDraftToList(); });
    if(isScheduled){
      wireDtField('d_horario_new', ()=>{}); // só atualiza o texto exibido; o commit real acontece ao sair do campo de dose
      document.getElementById('d_horario_dose').addEventListener('blur', ()=>{ flushPendingHorario(); syncDraftToList(); renderAddArea(); });
      document.querySelectorAll('[data-rm-horario]').forEach(b=> b.addEventListener('click', ()=>{
        draft.horarios.splice(Number(b.dataset.rmHorario),1);
        syncDraftToList();
        renderAddArea();
      }));
    }
  }

  // Atualiza só o texto de conflito de nome sem re-renderizar o campo (que
  // perderia o foco/cursor a cada letra digitada).
  function refreshInlineOnly(){
    const area = document.getElementById('addArea');
    const existingWarn = area.querySelector('.hint[style*="B3261E"]');
    const shouldWarn = nameConflict();
    if(shouldWarn && !existingWarn){ renderAddArea(); return; }
    if(!shouldWarn && existingWarn){ renderAddArea(); }
  }
  function nameConflict(){
    const n = draft.name.trim();
    if(!n) return false;
    return list.some(m=> normalizeSearch(m.name)===normalizeSearch(n) && m.id!==editingId);
  }

  function finish(){
    if(adding){
      flushPendingHorario();
      syncDraftToList();
    }
    meds=list; persistMeds(); closeModal(); renderTimeline(); if(onDone) onDone();
  }
  render();
}

// ---------- top-level wiring ----------
document.getElementById('searchInput').addEventListener('input', e=>{ search=e.target.value; renderTimeline(); });
document.getElementById('searchToggleBtn').addEventListener('click', ()=>{
  const box = document.getElementById('searchBox');
  const opening = box.style.display==='none';
  box.style.display = opening ? 'flex' : 'none';
  if(opening){ document.getElementById('searchInput').focus(); }
  else { search=''; document.getElementById('searchInput').value=''; renderTimeline(); }
});
document.getElementById('searchCloseBtn').addEventListener('click', ()=>{
  document.getElementById('searchBox').style.display='none';
  search=''; document.getElementById('searchInput').value=''; renderTimeline();
});

renderQuickActions();
renderFilters();
renderAll();
loadProfilePhoto();
checkBackupBanner();
</script>
</body>
